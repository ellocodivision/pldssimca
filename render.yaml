services:
  - type: web
    name: aml-formats-app
    env: node
    plan: starter
    buildCommand: PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npm install && PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npx puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "false"
      - key: ALLOWED_EMAILS
        value: michelle@viceroyplayadelcarmen.com,marion@viceroyplayadelcarmen.com,manuel@viceroyplayadelcarmen.com,karla@viceroyplayadelcarmen.com,daniela@viceroyplayadelcarmen.com,martin@viceroyplayadelcarmen.com
