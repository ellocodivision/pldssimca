<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viceroy KPI Reservas</title>
  <style>
    :root{
      --bg:#f4f1e8;
      --card:#ffffff;
      --ink:#1c1d22;
      --muted:#6a6f78;
      --line:#d9d4c6;
      --accent:#efe47a;
      --ok:#1f8d3c;
      --danger:#c43a2b;
      --pill:#ece8d8;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:1320px;margin:0 auto;padding:24px 16px 40px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .title{margin:0;font-size:32px;line-height:1.05}
    .sub{margin:8px 0 0;color:var(--muted)}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid #bfb8a5;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;color:#202225;text-decoration:none}
    .btn.primary{background:var(--accent);border-color:#111}
    .btn.secondary{background:#fff}
    .btn.danger{background:#fff3f0;border-color:#d26a58;color:#8b1f16}
    .card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .status{margin-top:8px;color:var(--muted);font-size:13px;min-height:18px}
    .status.ok{color:var(--ok)}
    .status.error{color:var(--danger)}
    .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--pill);font-size:12px;font-weight:700}
    .hint{margin-top:8px;color:var(--muted);font-size:12px}
    .field{min-width:220px;padding:8px 10px;border:1px solid #cfc8b8;border-radius:10px;background:#fff}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:1120px}
    th,td{padding:10px;border-bottom:1px solid #ebe4d6;text-align:left;font-size:13px;vertical-align:top}
    th{background:#faf7f0;position:sticky;top:0;z-index:1}
    .table-wrap tbody tr:hover{background:#fbf8ee}
    .small{font-size:12px;color:var(--muted)}
    .kpi-chip{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:999px;background:#f3f0e4;font-size:11px;font-weight:700;min-width:34px}
    .kpi-chip.paid{background:#e6f4ea;color:#1f6f34}
    .kpi-chip.no{background:#f4efe1;color:#6f6651}
    .kpi-chip.na{background:#f0f0f0;color:#767676}
    .cell-actions{display:flex;gap:6px;flex-wrap:wrap}
    .cell-actions .btn{padding:7px 10px;font-size:12px}
    .owner{font-size:12px;color:var(--muted);display:block}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
    .modal.open{display:flex}
    .modal-card{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .modal-head h2{margin:0;font-size:24px;line-height:1.1}
    .modal-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .modal-field{font-size:13px}
    .modal-label{font-size:11px;color:var(--muted);display:block;margin:0 0 4px}
    .modal-input,.modal-select{width:100%;padding:10px 12px;border:1px solid #cec7b8;border-radius:10px;background:#fff;font:inherit}
    .modal-input[readonly]{background:#f6f4ee}
    .modal-actions{margin-top:14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    @media (max-width: 760px){
      .title{font-size:26px}
      .modal-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <h1 class="title">KPI Reservas</h1>
      </div>
      <div class="actions">
        <a class="btn" href="/viceroy">Volver a Viceroy</a>
        <button id="newBtn" class="btn primary" type="button">Nuevo cliente</button>
        <button id="exportBtn" class="btn secondary" type="button">Descargar Excel</button>
        <button id="refreshBtn" class="btn secondary" type="button">Actualizar</button>
      </div>
    </div>

    <section class="card">
      <div class="meta">
        <span id="rowsBadge" class="badge">0 filas</span>
        <span id="updatedBadge" class="badge">Actualizado: -</span>
      </div>
      <div class="row" style="margin-top:10px">
        <input id="searchInput" class="field" placeholder="Buscar unidad reservada, cliente, país o ciudad" />
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="rowsTbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">Nuevo cliente</h2>
          <p id="modalSub">Completa el registro para KPI Reservas.</p>
        </div>
        <span id="modalOwnerBadge" class="badge">-</span>
      </div>
      <form id="form">
        <div class="modal-grid">
          <label id="advisorWrap" class="modal-field" hidden>
            <span class="modal-label">Asignar a</span>
            <select id="advisorInput" class="modal-select"></select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Unidad reservada</span>
            <input id="unitInput" class="modal-input" placeholder="Unidad reservada" required />
          </label>
          <label class="modal-field">
            <span class="modal-label">Nombre cliente</span>
            <input id="nameInput" class="modal-input" placeholder="Nombre del cliente" required />
          </label>
          <label class="modal-field">
            <span class="modal-label">País</span>
            <input id="countryInput" class="modal-input" placeholder="País" />
          </label>
          <label class="modal-field">
            <span class="modal-label">Ciudad</span>
            <input id="cityInput" class="modal-input" placeholder="Ciudad" />
          </label>
          <label class="modal-field">
            <span class="modal-label">Tipo de venta</span>
            <input id="tipoVentaInput" class="modal-input" placeholder="Tipo de venta" />
          </label>
          <label class="modal-field">
            <span class="modal-label">Hoja de reserva</span>
            <select id="hojaReservaInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Reserva pagada</span>
            <select id="reservaPagadaInput" class="modal-select">
              <option value="SI">SI</option>
              <option value="NO">NO</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Documentos completos</span>
            <select id="documentosCompletosInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Contrato solicitado</span>
            <select id="contratoSolicitadoInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Contrato enviado</span>
            <select id="contratoEnviadoInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">DocuSign solicitado</span>
            <select id="docusignSolicitadoInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">DocuSign enviado</span>
            <select id="docusignEnviadoInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Contrato firmado</span>
            <select id="contratoFirmadoInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-label">Enganche pagado</span>
            <select id="enganchePagadoInput" class="modal-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </label>
        </div>
        <div class="modal-actions">
          <button id="cancelBtn" class="btn" type="button">Cerrar</button>
          <button class="btn primary" type="submit">Guardar cliente</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const state = {
        rows: [],
        filtered: [],
        advisors: [],
        systemUsers: [],
        updatedAt: '',
        sourceFile: '',
        currentEmail: '',
        currentName: '',
        isGerente: false,
        editingId: '',
        modalMode: 'create'
      };

      const els = {
        status: document.getElementById('status'),
        rowsBadge: document.getElementById('rowsBadge'),
        updatedBadge: document.getElementById('updatedBadge'),
        searchInput: document.getElementById('searchInput'),
        rowsTbody: document.getElementById('rowsTbody'),
        tableHead: document.getElementById('tableHead'),
        refreshBtn: document.getElementById('refreshBtn'),
        newBtn: document.getElementById('newBtn'),
        exportBtn: document.getElementById('exportBtn'),
        modal: document.getElementById('modal'),
        modalTitle: document.getElementById('modalTitle'),
        modalSub: document.getElementById('modalSub'),
        modalOwnerBadge: document.getElementById('modalOwnerBadge'),
        form: document.getElementById('form'),
        cancelBtn: document.getElementById('cancelBtn'),
        advisorWrap: document.getElementById('advisorWrap'),
        advisorInput: document.getElementById('advisorInput'),
        unitInput: document.getElementById('unitInput'),
        nameInput: document.getElementById('nameInput'),
        countryInput: document.getElementById('countryInput'),
        cityInput: document.getElementById('cityInput'),
        tipoVentaInput: document.getElementById('tipoVentaInput'),
        hojaReservaInput: document.getElementById('hojaReservaInput'),
        reservaPagadaInput: document.getElementById('reservaPagadaInput'),
        documentosCompletosInput: document.getElementById('documentosCompletosInput'),
        contratoSolicitadoInput: document.getElementById('contratoSolicitadoInput'),
        contratoEnviadoInput: document.getElementById('contratoEnviadoInput'),
        docusignSolicitadoInput: document.getElementById('docusignSolicitadoInput'),
        docusignEnviadoInput: document.getElementById('docusignEnviadoInput'),
        contratoFirmadoInput: document.getElementById('contratoFirmadoInput'),
        enganchePagadoInput: document.getElementById('enganchePagadoInput')
      };

      function escapeText(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalize(value) {
        return String(value == null ? '' : value).trim().toLowerCase();
      }

      function formatUpdatedAt(value) {
        const raw = String(value || '').trim();
        if (!raw) return '—';
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) return raw;
        return new Intl.DateTimeFormat('es-MX', {
          dateStyle: 'medium',
          timeStyle: 'short'
        }).format(date);
      }

      function yesNoChip(value) {
        const raw = String(value || '').trim().toUpperCase();
        if (raw === 'SI') return '<span class="kpi-chip paid">SI</span>';
        if (raw === 'NO') return '<span class="kpi-chip no">NO</span>';
        return '<span class="kpi-chip na">—</span>';
      }

      function renderAdvisorOptions(selectedValue = '') {
        if (!els.advisorInput) return;
        const values = Array.from(new Map(
          (Array.isArray(state.systemUsers) ? state.systemUsers : [])
            .map((user) => {
              const name = String(user && user.name || '').trim();
              const email = String(user && user.email || '').trim();
              const label = name || email;
              return label ? [normalize(label), { label, value: label, email }] : null;
            })
            .filter(Boolean)
        ).values());
        const fallbackLabel = state.currentName || state.currentEmail;
        if (fallbackLabel && !values.some((item) => normalize(item.value) === normalize(fallbackLabel))) {
          values.unshift({ label: fallbackLabel, value: fallbackLabel, email: state.currentEmail });
        }
        const current = String(selectedValue || '').trim();
        els.advisorInput.innerHTML = values.length
          ? values.map((item) => {
              const suffix = item.email && normalize(item.email) !== normalize(item.value) ? ` · ${item.email}` : '';
              return `<option value="${escapeText(item.value)}">${escapeText(item.label)}${escapeText(suffix)}</option>`;
            }).join('')
          : '<option value="">Sin usuarios</option>';
        if (current && values.some((item) => normalize(item.value) === normalize(current))) {
          els.advisorInput.value = values.find((item) => normalize(item.value) === normalize(current)).value || current;
        } else if (values.length) {
          els.advisorInput.value = values[0].value;
        } else {
          els.advisorInput.value = '';
        }
      }

      function rowMatches(row) {
        const search = normalize(els.searchInput.value);
        if (!search) return true;
        const haystack = [
          row.asesor,
          row.nombreCliente,
          row.unidadReservada,
          row.tipoVenta,
          row.pais,
          row.ciudad,
          row.kpi && row.kpi.hojaReserva,
          row.kpi && row.kpi.reservaPagada,
          row.documentosCompletos,
          row.kpi && row.kpi.contratoSolicitado,
          row.kpi && row.kpi.contratoEnviado,
          row.kpi && row.kpi.docusignSolicitado,
          row.kpi && row.kpi.docusignEnviado,
          row.kpi && row.kpi.contratoFirmado,
          row.kpi && row.kpi.enganchePagado
        ].map(normalize).join(' | ');
        return haystack.includes(search);
      }

      function renderTableHead() {
        const cols = [];
        if (state.isGerente) cols.push('<th>Asesor</th>');
        cols.push(
          '<th>Unidad reservada</th>',
          '<th>Cliente</th>',
          '<th>Tipo de venta</th>',
          '<th>País</th>',
          '<th>Ciudad</th>',
          '<th>Hoja reserva</th>',
          '<th>Reserva pagada</th>',
          '<th>Documentos completos</th>',
          '<th>Contrato solicitado</th>',
          '<th>Contrato enviado</th>',
          '<th>DocuSign solicitado</th>',
          '<th>DocuSign enviado</th>',
          '<th>Contrato firmado</th>',
          '<th>Enganche pagado</th>',
          '<th>Editar</th>',
          '<th>Eliminar</th>',
          '<th>Última actualización</th>'
        );
        els.tableHead.innerHTML = `<tr>${cols.join('')}</tr>`;
      }

      function renderTable() {
        state.filtered = state.rows.filter(rowMatches);
        els.rowsBadge.textContent = `${state.filtered.length} fila${state.filtered.length === 1 ? '' : 's'}`;
        els.updatedBadge.textContent = `Actualizado: ${state.updatedAt ? new Date(state.updatedAt).toLocaleString('es-MX') : '-'}`;
        renderTableHead();
        els.rowsTbody.innerHTML = state.filtered.map((row) => {
          const cells = [];
          if (state.isGerente) cells.push(`<td>${escapeText(row.asesor || '—')}</td>`);
          cells.push(
            `<td><strong>${escapeText(row.unidadReservada || '—')}</strong></td>`,
            `<td><strong>${escapeText(row.nombreCliente || '—')}</strong></td>`,
            `<td>${escapeText(row.tipoVenta || '—')}</td>`,
          `<td>${escapeText(row.pais || '—')}</td>`,
            `<td>${escapeText(row.ciudad || '—')}</td>`,
            `<td>${yesNoChip(row.kpi && row.kpi.hojaReserva)}</td>`,
            `<td>${yesNoChip(row.kpi && row.kpi.reservaPagada)}</td>`,
          `<td>${yesNoChip(row.documentosCompletos)}</td>`,
          `<td>${yesNoChip(row.kpi && row.kpi.contratoSolicitado)}</td>`,
          `<td>${yesNoChip(row.kpi && row.kpi.contratoEnviado)}</td>`,
          `<td>${yesNoChip(row.kpi && row.kpi.docusignSolicitado)}</td>`,
          `<td>${yesNoChip(row.kpi && row.kpi.docusignEnviado)}</td>`,
          `<td>${yesNoChip(row.kpi && row.kpi.contratoFirmado)}</td>`,
          `<td>${yesNoChip(row.kpi && row.kpi.enganchePagado)}</td>`,
          `<td><div class="cell-actions"><button class="btn" type="button" data-edit="${escapeText(row.id)}">Editar</button></div></td>`,
          `<td><div class="cell-actions"><button class="btn danger" type="button" data-delete="${escapeText(row.id)}">Eliminar</button></div></td>`,
          `<td>${escapeText(formatUpdatedAt(row.updatedAt))}</td>`
        );
        return `<tr>${cells.join('')}</tr>`;
        }).join('') || `<tr><td colspan="${state.isGerente ? 18 : 17}" class="small">No hay clientes para mostrar.</td></tr>`;
      }

      function openModal(mode, row) {
        state.modalMode = mode;
        state.editingId = row && row.id ? String(row.id) : '';
        els.modal.classList.add('open');
        els.modal.setAttribute('aria-hidden', 'false');
        els.modalTitle.textContent = mode === 'edit' ? 'Editar cliente' : 'Nuevo cliente';
        els.modalSub.textContent = mode === 'edit'
          ? 'Edita solo las columnas permitidas de KPI Reservas.'
          : 'Crea un cliente nuevo dentro de KPI Reservas.';
        els.modalOwnerBadge.textContent = state.isGerente ? 'Gerente asigna usuarios' : `Solo: ${state.currentEmail || 'mi usuario'}`;
        els.advisorWrap.hidden = !state.isGerente;
        if (state.isGerente) {
          renderAdvisorOptions(row ? String(row.asesor || '') : state.currentName);
        } else {
          els.advisorInput.innerHTML = '';
        }
        els.unitInput.value = row ? String(row.unidadReservada || '') : '';
        els.nameInput.value = row ? String(row.nombreCliente || '') : '';
        els.countryInput.value = row ? String(row.pais || '') : '';
        els.cityInput.value = row ? String(row.ciudad || '') : '';
        els.tipoVentaInput.value = row ? String(row.tipoVenta || '') : '';
        els.hojaReservaInput.value = row && row.kpi ? String(row.kpi.hojaReserva || 'NO').toUpperCase() : 'NO';
        els.reservaPagadaInput.value = row && row.kpi ? String(row.kpi.reservaPagada || 'SI').toUpperCase() : 'SI';
        els.documentosCompletosInput.value = row ? String(row.documentosCompletos || 'NO').toUpperCase() : 'NO';
        els.contratoSolicitadoInput.value = row && row.kpi ? String(row.kpi.contratoSolicitado || 'NO').toUpperCase() : 'NO';
        els.contratoEnviadoInput.value = row && row.kpi ? String(row.kpi.contratoEnviado || 'NO').toUpperCase() : 'NO';
        els.docusignSolicitadoInput.value = row && row.kpi ? String(row.kpi.docusignSolicitado || 'NO').toUpperCase() : 'NO';
        els.docusignEnviadoInput.value = row && row.kpi ? String(row.kpi.docusignEnviado || 'NO').toUpperCase() : 'NO';
        els.contratoFirmadoInput.value = row && row.kpi ? String(row.kpi.contratoFirmado || 'NO').toUpperCase() : 'NO';
        els.enganchePagadoInput.value = row && row.kpi ? String(row.kpi.enganchePagado || 'NO').toUpperCase() : 'NO';
        els.nameInput.focus();
      }

      function closeModal() {
        els.modal.classList.remove('open');
        els.modal.setAttribute('aria-hidden', 'true');
      }

      function readFormValues() {
        return {
          asesor: state.isGerente ? els.advisorInput.value : state.currentName,
          unidadReservada: els.unitInput.value,
          nombreCliente: els.nameInput.value,
          pais: els.countryInput.value,
          ciudad: els.cityInput.value,
          tipoVenta: els.tipoVentaInput.value,
          hojaReserva: els.hojaReservaInput.value,
          reservaPagada: els.reservaPagadaInput.value,
          documentosCompletos: els.documentosCompletosInput.value,
          contratoSolicitado: els.contratoSolicitadoInput.value,
          contratoEnviado: els.contratoEnviadoInput.value,
          docusignSolicitado: els.docusignSolicitadoInput.value,
          docusignEnviado: els.docusignEnviadoInput.value,
          contratoFirmado: els.contratoFirmadoInput.value,
          enganchePagado: els.enganchePagadoInput.value
        };
      }

      async function saveModal(event) {
        event.preventDefault();
        const payload = readFormValues();
        if (!String(payload.nombreCliente || '').trim()) {
          els.status.textContent = 'El nombre del cliente es obligatorio.';
          els.status.className = 'status error';
          return;
        }
        if (!String(payload.unidadReservada || '').trim()) {
          els.status.textContent = 'La unidad reservada es obligatoria.';
          els.status.className = 'status error';
          return;
        }
        const editing = Boolean(state.editingId);
        const url = editing
          ? `/api/viceroy/kpi-reservas/rows/${encodeURIComponent(state.editingId)}`
          : '/api/viceroy/kpi-reservas/rows';
        try {
          els.status.textContent = editing ? 'Guardando cambios...' : 'Creando cliente...';
          els.status.className = 'status';
          const res = await fetch(url, {
            method: editing ? 'PATCH' : 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'No se pudo guardar el cliente');
          closeModal();
          await loadData(true);
          els.status.textContent = editing ? 'Cliente actualizado.' : 'Cliente creado.';
          els.status.className = 'status ok';
        } catch (err) {
          els.status.textContent = err.message || 'No se pudo guardar el cliente';
          els.status.className = 'status error';
        }
      }

      async function loadData(silent = false) {
        if (!silent) {
          els.status.textContent = 'Cargando KPI Reservas...';
          els.status.className = 'status';
        }
        els.refreshBtn.disabled = true;
        try {
          const [res, usersRes] = await Promise.all([
            fetch('/api/viceroy/kpi-reservas', { credentials: 'same-origin' }),
            fetch('/api/viceroy/kpi-reservas/users', { credentials: 'same-origin', cache: 'no-store' })
          ]);
          const data = await res.json().catch(() => ({}));
          const usersData = await usersRes.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'No se pudo cargar KPI Reservas');
          state.rows = Array.isArray(data.rows) ? data.rows : [];
          state.updatedAt = data.updatedAt || '';
          state.sourceFile = data.sourceFile || '';
          state.currentEmail = data.currentEmail || '';
          state.currentName = data.currentName || '';
          state.isGerente = Boolean(data.isGerente);
          state.systemUsers = Array.isArray(usersData.users) ? usersData.users : [];
          renderTable();
          if (!silent) {
            els.status.textContent = `Se cargaron ${state.rows.length} clientes.`;
            els.status.className = 'status ok';
          }
        } catch (err) {
          els.status.textContent = err.message || 'Error al cargar KPI Reservas';
          els.status.className = 'status error';
        } finally {
          els.refreshBtn.disabled = false;
        }
      }

      async function exportExcel() {
        try {
          els.exportBtn.disabled = true;
          els.status.textContent = 'Descargando Excel de KPI Reservas...';
          els.status.className = 'status';
          const res = await fetch('/api/viceroy/kpi-reservas/export.xlsx', {
            credentials: 'same-origin'
          });
          if (!res.ok) {
            let message = 'No se pudo descargar el Excel';
            try {
              const data = await res.json();
              message = data && data.error ? data.error : message;
            } catch {}
            throw new Error(message);
          }
          const blob = await res.blob();
          const fileName = (() => {
            const header = res.headers.get('Content-Disposition') || '';
            const match = header.match(/filename="([^"]+)"/i);
            return match && match[1] ? match[1] : 'viceroy-kpi-reservas.xlsx';
          })();
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          els.status.textContent = 'Excel descargado.';
          els.status.className = 'status ok';
        } catch (err) {
          els.status.textContent = err && err.message ? err.message : 'No se pudo descargar el Excel';
          els.status.className = 'status error';
        } finally {
          els.exportBtn.disabled = false;
        }
      }

      els.searchInput.addEventListener('input', renderTable);
      els.refreshBtn.addEventListener('click', () => loadData());
      els.exportBtn.addEventListener('click', exportExcel);
      els.newBtn.addEventListener('click', () => openModal('create', null));
      els.cancelBtn.addEventListener('click', closeModal);
      els.modal.addEventListener('click', (event) => {
        if (event.target === els.modal) closeModal();
      });
      els.form.addEventListener('submit', saveModal);
      els.rowsTbody.addEventListener('click', (event) => {
        const button = event.target.closest('[data-edit]');
        if (!button) return;
        const rowId = String(button.getAttribute('data-edit') || '');
        const row = state.rows.find((item) => String(item.id || '') === rowId);
        if (!row) return;
        openModal('edit', row);
      });
      els.rowsTbody.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-delete]');
        if (!button) return;
        const rowId = String(button.getAttribute('data-delete') || '');
        const row = state.rows.find((item) => String(item.id || '') === rowId);
        if (!row) return;
        if (!confirm(`¿Eliminar este contacto de KPI Reservas?\n${row.unidadReservada || ''} · ${row.nombreCliente || ''}`)) return;
        try {
          els.status.textContent = 'Eliminando cliente...';
          els.status.className = 'status';
          const res = await fetch('/api/viceroy/kpi-reservas/rows/' + encodeURIComponent(rowId), {
            method: 'DELETE',
            credentials: 'same-origin'
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'No se pudo eliminar el cliente');
          await loadData(true);
          els.status.textContent = 'Cliente eliminado.';
          els.status.className = 'status ok';
        } catch (err) {
          els.status.textContent = err && err.message ? err.message : 'No se pudo eliminar el cliente';
          els.status.className = 'status error';
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && els.modal.classList.contains('open')) closeModal();
      });

      loadData();
    })();
  </script>
</body>
</html>
