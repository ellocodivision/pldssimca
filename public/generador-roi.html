<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retorno de Inversión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#e0ded6;--card:#ffffff;--ink:#1a1a1a;--muted:#6b6b6b;--accent:#ffe816;--accent-2:#111111;--border:#d7d2c6;--shadow:0 10px 30px rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:"Instrument Sans","Work Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.container{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;object-fit:contain}
.title{font-size:28px;letter-spacing:.3px;margin:0}
.subtitle{margin:6px 0 0;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.control-card{padding:18px}
label{display:block;font-weight:600;margin-bottom:6px}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:white;font-size:15px}
select:disabled{background:#f2f2f2;color:#9b9b9b}
button{padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:#111;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.15)}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.kv{padding:14px;border-radius:12px;background:#faf8f4;border:1px solid var(--border)}
.kv .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv .v{font-size:16px;font-weight:700;margin-top:6px}
.section{margin-top:22px}
.section h3{margin:0 0 10px;font-size:18px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left}
.table th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#ecfeff;color:#0e7490;font-weight:600;font-size:12px}
.note{color:var(--muted);font-size:13px}
.results{padding:20px;margin-top:18px}
.pdf-logo-wrap{display:flex;justify-content:center;align-items:center;padding:4px 0 14px}
.pdf-logo{max-width:320px;width:100%;height:auto;max-height:64px;object-fit:contain}
.highlight{background:#fff7ed;border:1px dashed #fdba74}
@media (max-width:900px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
@media print{body{background:white} .no-print{display:none !important} .card{box-shadow:none} .container{padding:0} @page{size:A4; margin:12mm}}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <div class="brand">
      <img src="https://static.wixstatic.com/media/5ed051_a217a1c95a2040d09f666d19aa6c1ad7~mv2.png" alt="Logo" />
      <div>
        <h1 class="title">Retorno de Inversión</h1>
        <p class="subtitle">Selecciona desarrollo y unidad para ver resultados por temporada.</p>
      </div>
    </div>
    <div class="no-print">
      <button type="button" onclick="history.back()">Regresar</button>
      <button id="printBtn" disabled>Descargar PDF (A4)</button>
    </div>
  </div>

  <div class="card control-card no-print">
    <div class="controls">
      <div>
        <label for="devSelect">Desarrollo</label>
        <select id="devSelect"><option value="">Selecciona desarrollo...</option></select>
      </div>
      <div>
        <label for="unitSelect">Unidad</label>
        <select id="unitSelect" disabled><option value="">Selecciona unidad...</option></select>
      </div>
      <div>
        <button id="clearBtn" type="button">Limpiar</button>
      </div>
    </div>
    <div class="controls" style="margin-top:12px">
      <div>
        <label for="adminPctInput">% Administración</label>
        <input id="adminPctInput" type="number" min="0" max="100" step="0.1" value="30" />
      </div>
      <div>
        <div class="note" id="csvStatus">Cargando CSV maestro...</div>
      </div>
    </div>
    <p class="note">Elige un desarrollo para desbloquear las unidades disponibles.</p>
  </div>

  <div id="results" class="card results" style="display:none"></div>
</div>

<script>
let DATA = {rows:[],seasons:{baja:{occ:'',nights:''},media:{occ:'',nights:''},alta:{occ:'',nights:''},fiestas:{occ:'',nights:''}}};
const devSelect = document.getElementById('devSelect');
const unitSelect = document.getElementById('unitSelect');
const results = document.getElementById('results');
const printBtn = document.getElementById('printBtn');
const clearBtn = document.getElementById('clearBtn');
const csvStatus = document.getElementById('csvStatus');
const adminPctInput = document.getElementById('adminPctInput');
const DEV_LOGO_MAP = [
  { keys: ['SERENADA'], src: '/assets/roi-logos/serenada.png' },
  { keys: ['IPANA'], src: '/assets/roi-logos/ipana.png' },
  { keys: ['SAINT MARINE'], src: '/assets/roi-logos/saint-marine.png' },
  { keys: ['MARILA'], src: '/assets/roi-logos/marila.png' },
  { keys: ['CEIBA'], src: '/assets/roi-logos/ceiba.png' },
  { keys: ['GRAN TULUM'], src: '/assets/roi-logos/gran-tulum.png' },
  { keys: ['SINGULAR'], src: '/assets/roi-logos/singular.png' },
  { keys: ['MARESOL'], src: '/assets/roi-logos/maresol.png' },
  { keys: ['SOLAR STUDIOS'], src: '/assets/roi-logos/solar-studios.png' },
  { keys: ['SOLAR'], src: '/assets/roi-logos/solar-mt.png' }
];

function colToIndex(col){
  const letters = String(col || '').trim().toUpperCase();
  let n = 0;
  for(let i = 0; i < letters.length; i++){
    n = n * 26 + (letters.charCodeAt(i) - 64);
  }
  return n;
}

const COL = {
  LOCATION: colToIndex('A'),
  DEV: colToIndex('C'),
  UNIT: colToIndex('D'),
  BED: colToIndex('E'),
  M2: colToIndex('F'),
  SQFT: colToIndex('G'),
  LIST: colToIndex('H'),
  DISC_PCT: colToIndex('I'),
  DISC_AMT: colToIndex('J'),
  FINAL: colToIndex('K'),
  BAJA: colToIndex('CL'),
  MEDIA: colToIndex('CM'),
  ALTA: colToIndex('CN'),
  FIESTAS: colToIndex('CO'),
  BAJA2: colToIndex('CR'),
  MEDIA2: colToIndex('CS'),
  ALTA2: colToIndex('CT'),
  FIESTAS2: colToIndex('CU'),
  GROSS: colToIndex('CW'),
  GASTOS: colToIndex('CY'),
  MANT: colToIndex('CZ'),
  PREDIAL: colToIndex('DA'),
  ROI: colToIndex('DB')
};

const LOCATION_SEASONS = {
  PLAYA_DEL_CARMEN: {
    baja: { occ: '40%', nights: '91' },
    media: { occ: '65%', nights: '150' },
    alta: { occ: '85%', nights: '90' },
    fiestas: { occ: '95%', nights: '21' }
  },
  TULUM: {
    baja: { occ: '30%', nights: '105' },
    media: { occ: '55%', nights: '150' },
    alta: { occ: '75%', nights: '75' },
    fiestas: { occ: '95%', nights: '35' }
  }
};

function normalizeText(v){
  return String(v || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .trim();
}

function logoForDevelopment(dev){
  const name = normalizeText(dev);
  for(const item of DEV_LOGO_MAP){
    for(const key of item.keys){
      if(name.includes(key)) return item.src;
    }
  }
  return '';
}

function getSeasonProfile(row){
  const location = normalizeText(get(row, COL.LOCATION));
  if(location.includes('PLAYA DEL CARMEN')) return LOCATION_SEASONS.PLAYA_DEL_CARMEN;
  if(location.includes('TULUM')) return LOCATION_SEASONS.TULUM;
  return { baja: { occ: '', nights: '' }, media: { occ: '', nights: '' }, alta: { occ: '', nights: '' }, fiestas: { occ: '', nights: '' } };
}

function getSeasons(row){
  const profile = getSeasonProfile(row);
  return [
    { label: 'Baja', idxs: [COL.BAJA, COL.BAJA2], nights: profile.baja.nights, occupancy: profile.baja.occ },
    { label: 'Media', idxs: [COL.MEDIA, COL.MEDIA2], nights: profile.media.nights, occupancy: profile.media.occ },
    { label: 'Alta', idxs: [COL.ALTA, COL.ALTA2], nights: profile.alta.nights, occupancy: profile.alta.occ },
    { label: 'Fiestas', idxs: [COL.FIESTAS, COL.FIESTAS2], nights: profile.fiestas.nights, occupancy: profile.fiestas.occ }
  ];
}

function clean(v){return (v||'').toString().trim();}
function toNumber(v){const n=parseFloat(String(v||'').replace(/[^0-9.-]/g,''));return isNaN(n)?0:n;}
function toRatio(v){
  const s = String(v || '').trim();
  if(!s) return 0;
  const n = toNumber(s);
  if(!n) return 0;
  if(s.includes('%')) return n / 100;
  return n <= 1 ? n : n / 100;
}
function fmtMoney(v){if(v===null||v===undefined||v==='') return '-'; if(typeof v==='string' && v.trim().startsWith('$')) return v.trim(); const n=toNumber(v); return n? n.toLocaleString('en-US',{style:'currency',currency:'USD'}): (String(v).trim()||'-');}
function fmtText(v){return clean(v)||'-';}
function get(row, idx){return row[idx-1] ?? '';}
function firstNonEmptyAny(row, idxs){
  for(const idx of idxs){
    const val = clean(get(row, idx));
    if(val) return get(row, idx);
  }
  return '';
}

let rows = [];
let currentRow = null;

function getAdminPct(){
  const n = parseFloat(adminPctInput.value);
  if (isNaN(n)) return 30;
  return Math.min(100, Math.max(0, n));
}

function loadFromRows(rowsAll){
  if(!rowsAll || !rowsAll.length) return;
  const headerIdx = rowsAll.findIndex((r)=>{
    const devCell = normalizeText(get(r, COL.DEV));
    const unitCell = normalizeText(get(r, COL.UNIT));
    return devCell.includes('DESARROLLO') || unitCell.includes('UNIDAD');
  });
  const dataStart = headerIdx >= 0 ? headerIdx + 1 : 0;
  rows = rowsAll.slice(dataStart).filter(r=>{
    const dev = normalizeText(get(r, COL.DEV));
    return dev && !dev.includes('DESARROLLO');
  });
  devSelect.innerHTML = '<option value=\"\">Selecciona desarrollo...</option>';
  const devs = [...new Set(rows.map(r=>clean(get(r, COL.DEV))))].sort();
  for(const d of devs){
    const opt=document.createElement('option');
    opt.value=d; opt.textContent=d; devSelect.appendChild(opt);
  }
  unitSelect.innerHTML = '<option value=\"\">Selecciona unidad...</option>';
  unitSelect.disabled=true;
  csvStatus.textContent = `CSV cargado: ${rows.length} registros.`;
}

function parseCsvText(text){
  const rowsRaw=[];
  let cur='', inq=false;
  let row=[];
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='\"'){
      if(inq && text[i+1]==='\"'){cur+='\"'; i++;} else {inq=!inq;}
    } else if(ch===',' && !inq){
      row.push(cur); cur='';
    } else if((ch==='\n' || ch==='\r') && !inq){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(cur); rowsRaw.push(row); row=[]; cur='';
    } else {
      cur+=ch;
    }
  }
  if(cur.length || row.length){ row.push(cur); rowsRaw.push(row); }
  return rowsRaw.filter(r=>r.some(c=>String(c||'').trim().length));
}

async function autoloadMasterCsv(){
  try {
    const res = await fetch('/api/roi/master-csv', { credentials: 'same-origin' });
    if(!res.ok){
      csvStatus.textContent = 'No hay CSV maestro disponible. Pídele a un gerente que lo actualice desde el panel principal.';
      return;
    }
    const text = await res.text();
    const rowsAll = parseCsvText(text);
    loadFromRows(rowsAll);
    clearAll();
    csvStatus.textContent = `CSV maestro cargado automáticamente (${rows.length} registros).`;
  } catch (err) {
    csvStatus.textContent = 'No se pudo cargar el CSV maestro automáticamente.';
  }
}

function populateUnits(dev){
  unitSelect.innerHTML = '<option value="">Selecciona unidad...</option>';
  const units = rows.filter(r=>clean(get(r, COL.DEV))===dev).map(r=>clean(get(r, COL.UNIT)));
  const uniqueUnits=[...new Set(units)].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  for(const u of uniqueUnits){
    const opt=document.createElement('option');
    opt.value=u; opt.textContent=u; unitSelect.appendChild(opt);
  }
  unitSelect.disabled=false;
}

function renderResult(row){
  currentRow = row;
  const seasons = getSeasons(row);
  const computedGross = seasons.reduce((acc, s)=>{
    const price = toNumber(firstNonEmptyAny(row, s.idxs));
    const nights = toNumber(s.nights);
    const occ = toRatio(s.occupancy);
    return acc + (price * nights * occ);
  }, 0);
  const grossRaw = toNumber(get(row, COL.GROSS));
  const gross = grossRaw > 0 ? grossRaw : computedGross;
  const adminPct = getAdminPct();
  const admin = gross * (adminPct / 100);
  const gastos = get(row, COL.GASTOS);
  const mant = get(row, COL.MANT);
  const predial = get(row, COL.PREDIAL);
  const finalPrice = get(row, COL.FINAL);
  const net = gross - toNumber(admin) - toNumber(gastos) - toNumber(mant) - toNumber(predial);
  const roiValue = toNumber(finalPrice) > 0 ? (net / toNumber(finalPrice)) * 100 : 0;
  const roiText = toNumber(finalPrice) > 0 ? `${roiValue.toFixed(2)}%` : fmtText(get(row, COL.ROI));

  const seasonRows = seasons.map(s=>`<tr>
    <td><span class="badge">${s.label}</span></td>
    <td>${fmtMoney(firstNonEmptyAny(row, s.idxs))}</td>
    <td>${fmtText(s.nights)}</td>
    <td>${fmtText(s.occupancy)}</td>
  </tr>`).join('');

  const devName = fmtText(get(row, COL.DEV));
  const logoSrc = logoForDevelopment(devName);
  const logoHtml = logoSrc ? `<div class="pdf-logo-wrap"><img class="pdf-logo" src="${logoSrc}" alt="Logo ${devName}" /></div>` : '';

  results.innerHTML = `
    ${logoHtml}
    <div class="section">
      <h3>Detalle de la Unidad</h3>
      <div class="grid">
        <div class="kv"><div class="k">Desarrollo</div><div class="v">${fmtText(get(row, COL.DEV))}</div></div>
        <div class="kv"><div class="k">Unidad</div><div class="v">${fmtText(get(row, COL.UNIT))}</div></div>
        <div class="kv"><div class="k">Ubicación</div><div class="v">${fmtText(get(row, COL.LOCATION))}</div></div>
        <div class="kv"><div class="k">Recámaras</div><div class="v">${fmtText(get(row, COL.BED))}</div></div>
        <div class="kv"><div class="k">M2 / SQFT</div><div class="v">${fmtText(get(row, COL.M2))} / ${fmtText(get(row, COL.SQFT))}</div></div>
        <div class="kv"><div class="k">Precio Lista</div><div class="v">${fmtMoney(get(row, COL.LIST))}</div></div>
        <div class="kv"><div class="k">Descuento</div><div class="v">${fmtText(get(row, COL.DISC_PCT))} (${fmtMoney(get(row, COL.DISC_AMT))})</div></div>
        <div class="kv"><div class="k">Precio Final</div><div class="v">${fmtMoney(get(row, COL.FINAL))}</div></div>
        <div class="kv highlight"><div class="k">Retorno</div><div class="v">${roiText}</div></div>
      </div>
    </div>

    <div class="section">
      <h3>Temporadas</h3>
      <table class="table">
        <thead><tr><th>Temporada</th><th>Precio por noche</th><th>Noches</th><th>Ocupación</th></tr></thead>
        <tbody>${seasonRows}</tbody>
      </table>
    </div>

    <div class="section">
      <h3>Ingresos y Costos</h3>
      <table class="table">
        <tbody>
          <tr><th>Ingreso bruto</th><td>${fmtMoney(gross)}</td></tr>
          <tr><th>Administración (${adminPct.toFixed(1)}%)</th><td>${fmtMoney(admin)}</td></tr>
          <tr><th>Gastos generales</th><td>${fmtMoney(gastos)}</td></tr>
          <tr><th>Mantenimiento</th><td>${fmtMoney(mant)}</td></tr>
          <tr><th>Predial</th><td>${fmtMoney(predial)}</td></tr>
          <tr><th>Ingreso neto (estimado)</th><td><strong>${fmtMoney(net)}</strong></td></tr>
        </tbody>
      </table>
    </div>
  `;
  results.style.display='block';
  printBtn.disabled=false;
}

function clearAll(){
  currentRow = null;
  devSelect.value='';
  unitSelect.innerHTML='<option value="">Selecciona unidad...</option>';
  unitSelect.disabled=true;
  results.style.display='none';
  results.innerHTML='';
  printBtn.disabled=true;
}

async function waitForImages(container){
  const images = Array.from(container.querySelectorAll('img'));
  if(!images.length) return;
  await Promise.all(images.map((img)=>new Promise((resolve)=>{
    if(img.complete) return resolve();
    const done = () => resolve();
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
  })));
}

function buildFilename(){
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const dev = String(currentRow ? get(currentRow, COL.DEV) : 'DESARROLLO').replace(/[^A-Z0-9]+/ig,'_');
  const unit = String(currentRow ? get(currentRow, COL.UNIT) : 'UNIDAD').replace(/[^A-Z0-9]+/ig,'_');
  return `${stamp}_ROI_${dev}_${unit}.pdf`;
}

async function downloadPdfA4(){
  if(!currentRow || results.style.display === 'none'){
    alert('Selecciona una unidad primero.');
    return;
  }
  if(!window.jspdf || !window.jspdf.jsPDF || !window.html2canvas){
    alert('No se pudo cargar el generador de PDF.');
    return;
  }
  const btnText = printBtn.textContent;
  printBtn.disabled = true;
  printBtn.textContent = 'Generando PDF...';
  try{
    await waitForImages(results);
    const canvas = await window.html2canvas(results, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff'
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'p', unit:'mm', format:'a4' });
    const margin = 10;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const maxW = pageW - (margin * 2);
    const maxH = pageH - (margin * 2);
    const imgW = canvas.width;
    const imgH = canvas.height;
    let renderW = maxW;
    let renderH = (imgH * renderW) / imgW;
    if(renderH > maxH){
      renderH = maxH;
      renderW = (imgW * renderH) / imgH;
    }
    const x = (pageW - renderW) / 2;
    const y = (pageH - renderH) / 2;
    doc.addImage(imgData, 'PNG', x, y, renderW, renderH, undefined, 'FAST');
    doc.save(buildFilename());
  } finally {
    printBtn.textContent = btnText;
    printBtn.disabled = false;
  }
}

printBtn.addEventListener('click',downloadPdfA4);
clearBtn.addEventListener('click',clearAll);
adminPctInput.addEventListener('input',()=>{
  if(currentRow) renderResult(currentRow);
});

devSelect.addEventListener('change',e=>{
  const dev=clean(e.target.value);
  if(!dev){clearAll();return;}
  populateUnits(dev);
  results.style.display='none';
  printBtn.disabled=true;
});

unitSelect.addEventListener('change',e=>{
  const dev=clean(devSelect.value);
  const unit=clean(e.target.value);
  if(!dev || !unit) return;
  const row=rows.find(r=>clean(get(r, COL.DEV))===dev && clean(get(r, COL.UNIT))===unit);
  if(row) renderResult(row);
});

autoloadMasterCsv();
</script>
</body>
</html>
