<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viceroy Whisperlist</title>
  <style>
    :root{
      --bg:#f4f1e8;
      --card:#ffffff;
      --ink:#101010;
      --muted:#67645c;
      --line:#d8d1c1;
      --accent:#f3df2b;
      --ok:#1f8d3c;
      --warn:#c23a2b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 40px;}
    .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;}
    .title{margin:0;font-size:32px;line-height:1}
    .sub{margin:8px 0 0;color:var(--muted)}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid #bdb8a9;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
    .btn.primary{background:var(--accent);border-color:#111}
    .card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .status{margin-top:8px;color:var(--muted);font-size:13px;min-height:18px}
    .status.ok{color:var(--ok)}
    .status.error{color:var(--warn)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{padding:10px;border-bottom:1px solid #ebe4d6;text-align:left;font-size:13px;vertical-align:top}
    th{background:#faf7f0;position:sticky;top:0;z-index:1}
    .cell-input{width:100%;padding:7px 8px;border:1px solid #cec7b8;border-radius:8px;background:#fff}
    .cell-input[disabled]{background:#f4f2ed;color:#6f6b62}
    .email{font-family:monospace;font-size:12px}
    .lock{font-size:12px;color:#6f6b62}
    .save-btn{padding:7px 9px;font-size:12px}
    .hint{margin-top:8px;color:var(--muted);font-size:12px}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#ece7da;font-size:12px;font-weight:700}
    @media (max-width:700px){
      .title{font-size:26px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 class="title">Viceroy Whisperlist</h1>
        <p class="sub"></p>
      </div>
      <div class="actions">
        <a class="btn" href="/">Volver</a>
        <button id="reloadBtn" class="btn" type="button">Recargar</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <span class="badge">Nuevo cliente</span>
        <input id="newCanal" class="cell-input" placeholder="CANAL" />
        <input id="newTipoVenta" class="cell-input" placeholder="TIPO DE VENTA" />
        <input id="newNombreCliente" class="cell-input" placeholder="NOMBRE CLIENTE" />
        <button id="addBtn" class="btn primary" type="button">Agregar</button>
      </div>
      <p class="hint">El nuevo cliente se asigna automáticamente a tu correo.</p>
      <p id="addStatus" class="status"></p>
    </div>

    <div id="managerCard" class="card" hidden>
      <div class="row">
        <span class="badge">Importar Excel</span>
        <input id="excelInput" type="file" accept=".xlsx,.xls" />
        <button id="importBtn" class="btn primary" type="button">Importar</button>
      </div>
      <p class="hint">Solo gerente. Reemplaza toda la tabla con el Excel cargado.</p>
      <p id="importStatus" class="status"></p>
    </div>

    <div class="card">
      <div class="row">
        <span id="metaUser" class="badge">Usuario: -</span>
        <span id="metaRows" class="badge">Filas: 0</span>
      </div>
      <p id="globalStatus" class="status"></p>
    </div>

    <div class="card table-wrap">
      <table id="rowsTable">
        <thead>
          <tr>
            <th>ASESOR</th>
            <th>CORREO</th>
            <th>CANAL</th>
            <th>TIPO DE VENTA</th>
            <th>NOMBRE CLIENTE</th>
            <th>ACCION</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    (function () {
      const state = {
        rows: [],
        currentEmail: '',
        isGerente: false
      };

      const els = {
        tbody: document.querySelector('#rowsTable tbody'),
        reloadBtn: document.getElementById('reloadBtn'),
        globalStatus: document.getElementById('globalStatus'),
        metaUser: document.getElementById('metaUser'),
        metaRows: document.getElementById('metaRows'),
        managerCard: document.getElementById('managerCard'),
        excelInput: document.getElementById('excelInput'),
        importBtn: document.getElementById('importBtn'),
        importStatus: document.getElementById('importStatus'),
        newCanal: document.getElementById('newCanal'),
        newTipoVenta: document.getElementById('newTipoVenta'),
        newNombreCliente: document.getElementById('newNombreCliente'),
        addBtn: document.getElementById('addBtn'),
        addStatus: document.getElementById('addStatus')
      };

      function setStatus(el, text, level) {
        el.textContent = text || '';
        el.classList.remove('ok', 'error');
        if (level) el.classList.add(level);
      }

      function rowHtml(row) {
        const canEdit = Boolean(row.canEdit);
        const lockText = canEdit ? '' : '<div class="lock">Solo lectura</div>';
        const disabled = canEdit ? '' : 'disabled';
        return `
          <tr data-id="${String(row.id)}">
            <td>${escapeHtml(row.asesor || '')}</td>
            <td class="email">${escapeHtml(row.correo || '')}</td>
            <td><input class="cell-input" data-field="canal" value="${escapeHtml(row.canal || '')}" ${disabled}></td>
            <td><input class="cell-input" data-field="tipoVenta" value="${escapeHtml(row.tipoVenta || '')}" ${disabled}></td>
            <td><input class="cell-input" data-field="nombreCliente" value="${escapeHtml(row.nombreCliente || '')}" ${disabled}></td>
            <td>
              ${canEdit ? '<button class="btn save-btn primary" type="button">Guardar</button>' : lockText}
            </td>
          </tr>
        `;
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderRows() {
        els.tbody.innerHTML = state.rows.map(rowHtml).join('');
      }

      async function fetchData() {
        setStatus(els.globalStatus, 'Cargando...', null);
        const res = await fetch('/api/whisperlist', { credentials: 'same-origin' });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || 'No se pudo cargar la tabla');
        state.rows = Array.isArray(data.rows) ? data.rows : [];
        state.currentEmail = String(data.currentEmail || '');
        state.isGerente = Boolean(data.isGerente);
        els.metaUser.textContent = 'Usuario: ' + state.currentEmail;
        els.metaRows.textContent = 'Filas: ' + state.rows.length;
        els.managerCard.hidden = !state.isGerente;
        setStatus(els.globalStatus, 'Tabla cargada.', 'ok');
        renderRows();
      }

      async function saveRow(tr) {
        const id = tr.getAttribute('data-id');
        const payload = {
          canal: tr.querySelector('[data-field="canal"]').value,
          tipoVenta: tr.querySelector('[data-field="tipoVenta"]').value,
          nombreCliente: tr.querySelector('[data-field="nombreCliente"]').value
        };
        const btn = tr.querySelector('.save-btn');
        if (btn) btn.disabled = true;
        setStatus(els.globalStatus, 'Guardando fila...', null);
        try {
          const res = await fetch('/api/whisperlist/rows/' + encodeURIComponent(id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'No se pudo guardar');
          setStatus(els.globalStatus, 'Fila guardada.', 'ok');
        } catch (err) {
          setStatus(els.globalStatus, err.message || 'Error al guardar', 'error');
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      async function addRow() {
        const payload = {
          canal: els.newCanal.value,
          tipoVenta: els.newTipoVenta.value,
          nombreCliente: els.newNombreCliente.value
        };
        if (!String(payload.nombreCliente || '').trim()) {
          setStatus(els.addStatus, 'Nombre cliente es obligatorio.', 'error');
          return;
        }
        els.addBtn.disabled = true;
        setStatus(els.addStatus, 'Agregando...', null);
        try {
          const res = await fetch('/api/whisperlist/rows', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'No se pudo agregar');
          setStatus(els.addStatus, 'Cliente agregado.', 'ok');
          els.newCanal.value = '';
          els.newTipoVenta.value = '';
          els.newNombreCliente.value = '';
          await fetchData();
        } catch (err) {
          setStatus(els.addStatus, err.message || 'Error al agregar', 'error');
        } finally {
          els.addBtn.disabled = false;
        }
      }

      async function importExcel() {
        const file = els.excelInput.files && els.excelInput.files[0];
        if (!file) {
          setStatus(els.importStatus, 'Selecciona un archivo .xlsx', 'error');
          return;
        }
        els.importBtn.disabled = true;
        setStatus(els.importStatus, 'Importando...', null);
        try {
          const base64 = await new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const res = await fetch('/api/whisperlist/import-excel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ fileName: file.name, base64: base64 })
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'No se pudo importar');
          setStatus(els.importStatus, 'Excel importado. Filas: ' + String(data.importedRows || 0), 'ok');
          await fetchData();
        } catch (err) {
          setStatus(els.importStatus, err.message || 'Error al importar', 'error');
        } finally {
          els.importBtn.disabled = false;
        }
      }

      els.reloadBtn.addEventListener('click', function () {
        fetchData().catch(function (err) {
          setStatus(els.globalStatus, err.message || 'Error de carga', 'error');
        });
      });

      els.addBtn.addEventListener('click', function () {
        addRow();
      });

      els.importBtn.addEventListener('click', function () {
        importExcel();
      });

      els.tbody.addEventListener('click', function (ev) {
        const btn = ev.target.closest('.save-btn');
        if (!btn) return;
        const tr = btn.closest('tr');
        if (!tr) return;
        saveRow(tr);
      });

      fetchData().catch(function (err) {
        setStatus(els.globalStatus, err.message || 'Error de carga', 'error');
      });
    })();
  </script>
</body>
</html>
