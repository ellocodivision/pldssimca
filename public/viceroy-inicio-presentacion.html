<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viceroy Inicio - Presentacion</title>
  <style>
    :root {
      --bg: #efe8dc;
      --panel: rgba(255,255,255,0.86);
      --ink: #171717;
      --muted: #5c5c5c;
      --line: rgba(89, 77, 58, 0.18);
      --accent: #ffe816;
      --shadow: 0 16px 36px rgba(65, 49, 24, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(255, 232, 22, 0.2), transparent 22%),
        linear-gradient(180deg, #f7f2e9 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .page {
      width: min(1380px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 14px 0 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding: 6px 0;
    }
    .title-wrap h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
    }
    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #bbb3a5;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .btn.primary {
      background: var(--accent);
      border-color: #e2cf1a;
    }
    .viewer-shell {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 14px;
      backdrop-filter: blur(10px);
    }
    .viewer {
      width: 100%;
      height: calc(100vh - 165px);
      min-height: 720px;
      border: 0;
      border-radius: 18px;
      background: #d8d8d8;
    }
    .note {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 820px) {
      .page { width: min(100vw - 16px, 1380px); }
      .viewer-shell { border-radius: 18px; padding: 10px; }
      .viewer {
        height: calc(100vh - 210px);
        min-height: 560px;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Presentacion</h1>
        <p>PDF cargado directamente dentro de la pagina para consulta interna.</p>
      </div>
      <div class="actions">
        <a class="btn" href="/viceroy/inicio">Volver a Inicio</a>
        <a class="btn" href="/viceroy/inicio/presentacion/pdf" target="_blank" rel="noopener noreferrer">Abrir PDF</a>
        <a class="btn primary" href="/viceroy/inicio/presentacion/pdf" download="Maresol_PPT_Sales_Desktop.pdf">Descargar PDF</a>
      </div>
    </header>

    <section class="viewer-shell">
      <iframe
        class="viewer"
        src="/viceroy/inicio/presentacion/pdf#view=FitH"
        title="Presentacion Viceroy"
      ></iframe>
    </section>

    <p class="note">Si en algún navegador el visor embebido no se renderiza, el botón "Abrir PDF" lo muestra directamente en una pestaña nueva sin cambiar el archivo original.</p>
  </main>
</body>
</html>
