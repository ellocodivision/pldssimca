<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoja de Reserva SIMCA</title>
  <style>
    :root{
      --bg:#ece5d6;
      --paper:#fffef9;
      --line:#2d2d2d;
      --muted:#6d675f;
      --accent:#ffd91a;
      --ink:#222222;
      --page-width:816px;
      --page-height:1056px;
      --side-rail:50px;
      --header-height:88px;
      --font:"Akkurat","Segoe UI",Tahoma,sans-serif;
      --heading-font:"Akkurat","Segoe UI",Tahoma,sans-serif;
      --rail-offset-y:88px;
      --rail-height:162px;
      --rail-text-color:#1d1c18;
      --logo-width:320px;
      --logo-offset-x:0px;
      --logo-offset-y:0px;
      --footer-logo-width:52px;
      --title-offset-x:0px;
      --title-offset-y:0px;
      --page1-header-offset-x:0px;
      --page1-header-offset-y:0px;
      --page1-scale:.92;
      --page1-offset-x:0px;
      --page1-offset-y:-10px;
      --page2-header-offset-x:0px;
      --page2-header-offset-y:0px;
      --page2-scale:.94;
      --page2-offset-x:0px;
      --page2-offset-y:-10px;
      --obs-height:82px;
      --payments-offset-y:-8px;
      --payments-scale:.9;
      --card-offset-y:-12px;
      --card-scale:.94;
      --signature-offset-y:-6px;
      --footer-offset-x:0px;
      --footer-offset-y:0px;
      --holder-offset-y:0px;
      --coowner-offset-y:0px;
      --docs-offset-y:0px;
      --page1-label-size:18px;
      --page1-value-size:16px;
      --page2-label-size:18px;
      --page2-value-size:16px;
      --table-header-size:14px;
      --table-body-size:15px;
      --signature-title-size:20px;
      --signature-note-size:12px;
      --docs-title-size:14px;
      --docs-text-size:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--font);
      background:linear-gradient(180deg,#f6f0e4 0%, var(--bg) 100%);
      color:var(--ink);
    }
    body.preview-mode{
      background:#d9dbe2;
    }
    body.print-preview-mode{
      background:#fff;
    }
    body.preview-mode .topbar,
    body.print-preview-mode .topbar,
    body.preview-mode .panel{
      display:none !important;
    }
    body.print-preview-mode .panel{
      display:none !important;
    }
    body.preview-mode .app{
      display:block;
      width:auto;
      padding:18px 0;
    }
    body.print-preview-mode .app{
      display:block;
      width:auto;
      padding:0;
    }
    body.preview-mode .preview-wrap{
      max-height:none;
      overflow:visible;
      padding-right:0;
    }
    body.print-preview-mode .preview-wrap{
      max-height:none;
      overflow:visible;
      padding-right:0;
    }
    body.print-preview-mode .preview-page-title{
      display:none !important;
    }
    body.print-preview-mode .page{
      margin:0 auto;
      box-shadow:none;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      padding:14px 18px;
      border-bottom:1px solid rgba(0,0,0,.08);
      background:rgba(246,240,228,.95);
      backdrop-filter:blur(10px);
    }
    .top-actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn,.link-btn{
      appearance:none;
      border:1px solid #b8af9d;
      border-radius:12px;
      background:#fff;
      color:#242424;
      padding:10px 14px;
      font:inherit;
      font-size:13px;
      text-decoration:none;
      cursor:pointer;
    }
    .btn.primary{
      background:var(--accent);
      border-color:#201f1a;
      font-weight:700;
    }
    .status{
      font-size:13px;
      color:var(--muted);
      min-height:18px;
    }
    .app{
      width:min(1440px, 96vw);
      margin:0 auto;
      padding:18px 0 28px;
      display:grid;
      grid-template-columns:minmax(360px, 470px) minmax(0, 1fr);
      gap:20px;
      align-items:start;
    }
    .panel{
      background:#fffdf8;
      border:1px solid #dad2c2;
      border-radius:22px;
      padding:18px;
      box-shadow:0 20px 44px rgba(68,56,34,.08);
    }
    .panel h1{
      margin:0 0 6px;
      font-size:28px;
      line-height:1.05;
    }
    .panel p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }
    .history-box{
      margin-bottom:14px;
      border:1px solid #e0d7c8;
      border-radius:16px;
      background:#fff;
      padding:14px;
    }
    .history-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:10px;
      flex-wrap:wrap;
    }
    .history-title{
      font-size:13px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:#4d463b;
    }
    .history-list{
      display:grid;
      gap:8px;
      max-height:220px;
      overflow:auto;
      padding-right:4px;
    }
    .history-item{
      border:1px solid #e7e1d4;
      border-radius:12px;
      padding:10px;
      background:#fffdfa;
    }
    .history-item strong{display:block;font-size:13px;margin-bottom:4px}
    .history-meta{font-size:12px;color:var(--muted);line-height:1.4}
    .history-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .history-btn{
      appearance:none;
      border:1px solid #c9c2b3;
      border-radius:999px;
      background:#fff;
      color:#1d1c18;
      min-height:32px;
      padding:0 10px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
    .editor{
      display:grid;
      gap:14px;
      max-height:calc(100vh - 108px);
      overflow:auto;
      padding-right:4px;
    }
    .section{
      border:1px solid #e3dccf;
      border-radius:18px;
      padding:14px;
      background:#fff;
    }
    .section h2{
      margin:0 0 12px;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#4d463b;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px 12px;
    }
    .grid.one{grid-template-columns:1fr}
    label{
      display:block;
      font-size:12px;
      color:#5a544b;
      margin-bottom:4px;
    }
    input, textarea{
      width:100%;
      border:1px solid #d5cebf;
      border-radius:10px;
      background:#fffefb;
      padding:9px 10px;
      font:inherit;
      font-size:13px;
      color:var(--ink);
    }
    textarea{min-height:74px; resize:vertical}
    .payments-grid{
      display:grid;
      gap:10px;
    }
    .payment-row{
      display:grid;
      grid-template-columns:1.6fr .6fr 1fr 1fr;
      gap:8px;
      align-items:end;
    }
    .preview-wrap{
      overflow:auto;
      max-height:calc(100vh - 108px);
      padding-right:6px;
    }
    .page-divider{
      margin:14px 0 18px;
      padding:8px 0 6px;
      border-top:2px solid rgba(95,91,80,.18);
      border-bottom:2px solid rgba(95,91,80,.18);
      text-align:center;
      color:#6c6558;
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .page{
      width:var(--page-width);
      min-height:var(--page-height);
      height:var(--page-height);
      margin:0 auto 20px;
      background:var(--paper);
      position:relative;
      box-shadow:0 0 0 1px rgba(39,39,39,.3), 0 22px 56px rgba(40,34,24,.12);
      overflow:hidden;
    }
    .page-break{page-break-after:always}
    .page-shell{
      min-height:100%;
      height:100%;
      display:grid;
      grid-template-columns:var(--side-rail) 1fr;
      background:var(--paper);
      position:relative;
    }
    .rail{
      position:relative;
      min-height:100%;
      background:var(--paper);
      overflow:hidden;
    }
    .rail .bar{
      position:absolute;
      left:0;
      top:var(--rail-offset-y);
      width:100%;
      height:var(--rail-height);
      background:var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      font-size:14px;
      font-weight:600;
      color:var(--rail-text-color);
    }
    .content{
      display:flex;
      flex-direction:column;
      min-width:0;
      min-height:100%;
      background:var(--paper);
      position:relative;
      overflow:hidden;
    }
    .header{
      height:var(--header-height);
      padding:18px 28px 14px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
    }
    .header-title{
      font-size:24px;
      font-weight:700;
      line-height:1.12;
      transform:translate(var(--title-offset-x), var(--title-offset-y));
      font-family:var(--heading-font);
    }
    .logo{
      display:flex;
      align-items:flex-end;
      justify-content:flex-end;
      text-align:right;
      line-height:1;
      white-space:nowrap;
      transform:translate(var(--logo-offset-x), var(--logo-offset-y));
      width:var(--logo-width);
      margin-left:auto;
      max-height:calc(var(--header-height) - 18px);
      overflow:hidden;
    }
    .page-header-block{
      width:100%;
      transform-origin:top left;
      will-change:transform;
    }
    .page-header-1{
      transform:translate(var(--page1-header-offset-x), var(--page1-header-offset-y));
    }
    .page-header-2{
      transform:translate(var(--page2-header-offset-x), var(--page2-header-offset-y));
    }
    .logo img{
      display:block;
      max-width:100%;
      max-height:100%;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:right bottom;
    }
    .logo-main{
      font-size:58px;
      font-weight:800;
      letter-spacing:.02em;
    }
    .logo-sub{
      display:inline-block;
      margin-left:10px;
      font-size:15px;
      line-height:1.1;
      font-weight:500;
      vertical-align:top;
      transform:translateY(10px);
    }
    .body{
      padding:18px 28px 0;
      display:flex;
      flex-direction:column;
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }
    .page-scale{
      display:flex;
      flex-direction:column;
      min-height:0;
      flex:1 1 auto;
      transform-origin:top left;
      width:100%;
    }
    .page-flow{
      display:flex;
      flex-direction:column;
      min-height:0;
      flex:1 1 auto;
      width:100%;
      transform-origin:top left;
      will-change:transform;
    }
    .page-1-flow{
      transform:translate(var(--page1-offset-x), var(--page1-offset-y));
    }
    .page-1-flow .page-scale{
      transform:scale(var(--page1-scale));
      width:calc(100% / var(--page1-scale));
    }
    .page-2-flow{
      transform:translate(var(--page2-offset-x), var(--page2-offset-y));
    }
    .page-2-flow .page-scale{
      transform:scale(var(--page2-scale));
      width:calc(100% / var(--page2-scale));
    }
    .page-block{
      display:flex;
      flex-direction:column;
      min-height:0;
      width:100%;
    }
    .stack{display:grid; gap:12px}
    .row-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .line-field{
      display:grid;
      gap:4px;
    }
    .line-field .label{
      font-size:var(--page1-label-size);
      font-weight:600;
      line-height:1.15;
    }
    .page-2-scale .line-field .label{font-size:var(--page2-label-size)}
    .line-field.small .label{font-size:calc(var(--page1-label-size) - 2px)}
    .page-2-scale .line-field.small .label{font-size:calc(var(--page2-label-size) - 2px)}
    .line-field .value{
      min-height:29px;
      border-bottom:1px solid var(--line);
      padding:2px 6px 3px 0;
      font-size:var(--page1-value-size);
      line-height:1.25;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .page-2-scale .line-field .value{font-size:var(--page2-value-size)}
    .line-field.tall .value{min-height:58px}
    .line-field.xl .value{min-height:var(--obs-height)}
    .payments{
      margin-top:6px;
      padding:0 86px;
      transform:translateY(var(--payments-offset-y)) scale(var(--payments-scale));
      transform-origin:top left;
      width:calc(100% / var(--payments-scale));
    }
    .payments-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:16px;
    }
    .payments-table th,
    .payments-table td{
      border-bottom:1px solid var(--line);
      border-right:1px solid var(--line);
      padding:4px 8px;
      height:32px;
      vertical-align:middle;
    }
    .payments-table th:last-child,
    .payments-table td:last-child{border-right:none}
    .payments-table th{
      font-size:var(--table-header-size);
      font-weight:700;
    }
    .payments-table td{
      font-size:var(--table-body-size);
    }
    .payments-table th:nth-child(1){width:32%}
    .payments-table th:nth-child(2){width:11%}
    .payments-table th:nth-child(3){width:25%}
    .payments-table th:nth-child(4){width:32%}
    .signature{
      margin-top:auto;
      padding-top:18px;
      transform:translateY(var(--signature-offset-y));
      flex:0 0 auto;
    }
    .signature-line{
      border-bottom:1px solid var(--line);
      height:28px;
      margin-bottom:4px;
    }
    .signature-title{
      text-align:center;
      font-size:var(--signature-title-size);
      font-weight:700;
      margin-bottom:4px;
    }
    .signature-note{
      text-align:center;
      font-size:var(--signature-note-size);
      color:#47413a;
      line-height:1.3;
    }
    .footer{
      padding:18px 24px 16px;
      display:grid;
      grid-template-columns:1fr 80px;
      gap:12px;
      align-items:center;
      font-size:12px;
      line-height:1.28;
      text-align:center;
      transform:translate(var(--footer-offset-x), var(--footer-offset-y));
      flex:0 0 auto;
    }
    .footer-mark{
      width:var(--footer-logo-width);
      min-height:52px;
      margin-left:auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .footer-mark img{
      display:block;
      width:100%;
      height:auto;
      max-width:100%;
    }
    .subsection-title{
      margin-top:2px;
      font-size:var(--page2-label-size);
      font-weight:800;
      line-height:1.2;
    }
    .docs{
      margin-top:auto;
      padding:22px 4px 18px;
      font-size:var(--docs-text-size);
      line-height:1.25;
      transform:translateY(var(--docs-offset-y));
      flex:0 0 auto;
    }
    .holder-block{transform:translateY(var(--holder-offset-y))}
    .coowner-block{transform:translateY(var(--coowner-offset-y))}
    .card-block{
      transform:translateY(var(--card-offset-y)) scale(var(--card-scale));
      transform-origin:top left;
      width:calc(100% / var(--card-scale));
    }
    .free-lines{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:3;
    }
    .free-line{
      position:absolute;
      transform-origin:top left;
    }
    .docs-title{
      font-size:var(--docs-title-size);
      font-weight:800;
      margin-bottom:10px;
    }
    .docs-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }
    .docs-item{display:block}
    .muted{color:var(--muted)}
    .preview-page-title{
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#71695e;
      margin:0 0 10px 6px;
    }
    @media (max-width:1180px){
      .app{grid-template-columns:1fr}
      .editor,.preview-wrap{max-height:none}
    }
    @media (max-width:860px){
      .page{
        width:min(100%, var(--page-width));
        transform-origin:top center;
      }
      .preview-wrap{overflow:visible}
    }
    @media print{
      @page{
        size:portrait;
        margin:0;
      }
      html, body{
        background:var(--paper);
        width:100%;
        min-height:100%;
      }
      body{background:#fff}
      .topbar,.panel{display:none !important}
      .app{display:block;width:auto;padding:0}
      .preview-wrap{max-height:none;overflow:visible;padding:0}
      .page{
        max-width:none;
        width:816px;
        min-height:1056px;
        height:1056px;
        margin:0 auto;
        box-shadow:none;
        break-after:page;
        page-break-after:always;
      }
      .page-shell{
        min-height:1056px;
        height:1056px;
        overflow:hidden;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <strong>Hoja de Reserva SIMCA</strong>
      <div class="status" id="statusText">Captura los datos y descarga el PDF exacto.</div>
    </div>
    <div class="top-actions">
      <a class="link-btn" href="/simca">Volver</a>
      <a class="link-btn" href="/hoja-reserva-simca/editor" id="editorBtn" hidden>Editor PDF Martin SIMCA</a>
      <button class="btn primary" type="button" id="downloadPdfBtn">Descargar PDF exacto</button>
    </div>
  </div>

  <main class="app">
    <section class="panel">
      <div style="margin-bottom:14px">
        <h1>Editor</h1>
        <p>Llena la hoja y la vista previa se actualiza al instante.</p>
      </div>
      <div class="history-box">
        <div class="history-head">
          <div class="history-title">Versiones guardadas</div>
          <div class="actions-inline">
            <button class="small-btn" type="button" id="restoreLatestBtn">Recuperar ultima</button>
            <button class="small-btn" type="button" id="refreshHistoryBtn">Actualizar lista</button>
          </div>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
      <div class="editor">
        <section class="section">
          <h2>Reserva</h2>
          <div class="grid">
            <div><label>Full Name / Nombre Completo</label><input data-bind="fullName"></div>
            <div><label>E-mail</label><input data-bind="email"></div>
            <div><label>Phone / Teléfono</label><input data-bind="phone"></div>
            <div><label>Development / Desarrollo</label><input data-bind="development"></div>
            <div><label>Unit # / No. Unidad</label><input data-bind="unitNumber"></div>
            <div><label>Price Listed / Precio de Lista</label><input data-bind="priceListed"></div>
          </div>
          <div class="grid one" style="margin-top:10px">
            <div><label>Observations / Observaciones</label><textarea data-bind="observations"></textarea></div>
          </div>
        </section>

        <section class="section">
          <h2>Pago</h2>
          <div class="payments-grid">
            <div class="payment-row">
              <div><label>Payment / Pago</label><input data-bind="payment1" value="Reservation Fee / Reserva"></div>
              <div><label>%</label><input data-bind="paymentPercent1"></div>
              <div><label>Amount / Monto</label><input data-bind="paymentAmount1"></div>
              <div><label>Date / Fecha</label><input data-bind="paymentDate1"></div>
            </div>
            <div class="payment-row">
              <div><label>Payment / Pago</label><input data-bind="payment2"></div>
              <div><label>%</label><input data-bind="paymentPercent2"></div>
              <div><label>Amount / Monto</label><input data-bind="paymentAmount2"></div>
              <div><label>Date / Fecha</label><input data-bind="paymentDate2"></div>
            </div>
            <div class="payment-row">
              <div><label>Payment / Pago</label><input data-bind="payment3"></div>
              <div><label>%</label><input data-bind="paymentPercent3"></div>
              <div><label>Amount / Monto</label><input data-bind="paymentAmount3"></div>
              <div><label>Date / Fecha</label><input data-bind="paymentDate3"></div>
            </div>
            <div class="payment-row">
              <div><label>Payment / Pago</label><input data-bind="payment4"></div>
              <div><label>%</label><input data-bind="paymentPercent4"></div>
              <div><label>Amount / Monto</label><input data-bind="paymentAmount4"></div>
              <div><label>Date / Fecha</label><input data-bind="paymentDate4"></div>
            </div>
            <div class="payment-row">
              <div><label>Payment / Pago</label><input data-bind="payment5"></div>
              <div><label>%</label><input data-bind="paymentPercent5"></div>
              <div><label>Amount / Monto</label><input data-bind="paymentAmount5"></div>
              <div><label>Date / Fecha</label><input data-bind="paymentDate5"></div>
            </div>
          </div>
          <div class="grid" style="margin-top:12px">
            <div><label>Amount & currency / Monto & moneda</label><input data-bind="amountCurrency"></div>
            <div><label>Card Number / Número de tarjeta</label><input data-bind="cardNumber"></div>
            <div><label>Name in the Card / Nombre en la tarjeta</label><input data-bind="cardName"></div>
            <div><label>VISA / MASTER CARD</label><input data-bind="cardType"></div>
            <div><label>Address / Dirección</label><input data-bind="cardAddress"></div>
            <div><label>City, State & Zip Code / Ciudad, Edo y C.P.</label><input data-bind="cardCityStateZip"></div>
            <div><label>Expiration Date / Fecha Expiración</label><input data-bind="expirationDate"></div>

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (_) {
          return fallback;
        }
      }

      function writeJson(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function cloneState() {
        return Object.keys(state).reduce(function (acc, key) {
          acc[key] = state[key];
          return acc;
        }, {});
      }

      function applyState(nextState) {
        Object.keys(state).forEach(function (key) {
          if (Object.prototype.hasOwnProperty.call(nextState, key)) {
            state[key] = nextState[key] == null ? "" : String(nextState[key]);
          }
        });
        document.querySelectorAll("[data-bind]").forEach(function (input) {
          const key = input.getAttribute("data-bind");
          if (!key) return;
          if (Object.prototype.hasOwnProperty.call(state, key)) {
            input.value = state[key];
          }
        });
        renderPreview();
      }

      function loadDraftState() {
        const draft = readJson(DRAFT_KEY, null);
        if (!draft || typeof draft !== 'object') return;
        applyState(draft);
      }

      function loadHistory() {
        const items = readJson(HISTORY_KEY, []);
        return Array.isArray(items) ? items : [];
      }

      function persistHistory(items) {
        writeJson(HISTORY_KEY, items.slice(0, HISTORY_LIMIT));
      }

      function persistDraft() {
        writeJson(DRAFT_KEY, cloneState());
      }

      function snapshotSignature(payload) {
        return JSON.stringify(payload);
      }

      function saveSnapshot(reason) {
        const payload = cloneState();
        persistDraft();
        const items = loadHistory();
        const signature = snapshotSignature(payload);
        const latest = items[0];
        if (latest && latest.signature === signature) return;
        const record = {
          id: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8),
          createdAt: new Date().toISOString(),
          label: reason || 'Version guardada',
          fullName: payload.fullName || '',
          unitNumber: payload.unitNumber || '',
          signature,
          payload
        };
        items.unshift(record);
        persistHistory(items);
        renderHistory();
      }

      function scheduleAutosave() {
        persistDraft();
        if (autosaveTimer) clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(function () {
          saveSnapshot('Auto');
        }, 900);
      }

      function renderHistory() {
        const items = loadHistory();
        if (!historyList) return;
        historyList.innerHTML = '';
        if (!items.length) {
          historyList.innerHTML = '<div class="history-item"><div class="history-meta">Sin versiones guardadas todavia.</div></div>';
          return;
        }
        items.forEach(function (item, idx) {
          const row = document.createElement('div');
          row.className = 'history-item';
          const dateTxt = item.createdAt ? new Date(item.createdAt).toLocaleString() : '';
          row.innerHTML = `
            <strong>${item.label || 'Version'}</strong>
            <div class="history-meta">${dateTxt}</div>
            <div class="history-meta">Nombre: ${item.fullName || 'N/A'} | Unidad: ${item.unitNumber || 'N/A'}</div>
            <div class="history-actions">
              <button class="history-btn" type="button" data-load-history="${idx}">Cargar</button>
              <button class="history-btn" type="button" data-delete-history="${idx}">Eliminar</button>
            </div>
          `;
          historyList.appendChild(row);
        });
      }

      function restoreHistoryItem(index) {
        const items = loadHistory();
        const item = items[index];
        if (!item || !item.payload) return;
        applyState(item.payload);
        persistDraft();
      }

      function deleteHistoryItem(index) {
        const items = loadHistory();
        if (!items[index]) return;
        items.splice(index, 1);
        persistHistory(items);
        renderHistory();
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function field(label, value, options) {
        const className = options && options.className ? ` ${options.className}` : "";
        return `<div class="line-field${className}"><div class="label">${label}</div><div class="value">${esc(value || "")}</div></div>`;

          const height = horizontal ? Math.max(1, Number(line.width || 1)) + 'px' : line.length + '%';
          return '<span class="free-line" style="' +
            'left:' + line.x + '%;' +
            'top:' + line.y + '%;' +
            'width:' + width + ';' +
            'height:' + height + ';' +
            'background:' + esc(line.color || currentLayout.lineColor || '#2d2d2d') + ';' +
            'opacity:' + esc(line.opacity || 1) + ';"></span>';

                            <div class="row-2">
                              ${field("Phone / Teléfono:", state.holderPhone)}
                              ${field("Email:", state.holderEmail)}
                            </div>
                            ${field("Notes / RFC y CURP (solo ciudadanos Mexicanos):", state.holderNotes)}
                          </div>
                        </div>

                        <div class="coowner-block">
                          <div class="subsection-title" style="margin-top:18px">Co-owner / Copropietario</div>
                          <div class="stack" style="margin-top:6px">
                            ${field("Name as in Passport  / Nombre como el Pasaporte:", state.coOwnerName)}
                            ${field("Day & Place of Birth  / Día y Lugar de Nacimiento:", state.coOwnerBirth)}
                            <div class="row-2">
                              ${field("Occupation / Ocupación:", state.coOwnerOccupation)}
                              ${field("Nationality / Nacionalidad:", state.coOwnerNationality)}
                            </div>
                            <div class="row-2">
                              ${field("Passport/ Pasaporte:", state.coOwnerPassport)}
                              ${field("Marital Status / Edo. Civil :", state.coOwnerMaritalStatus)}
                            </div>
                            ${field("Address / Dirección:", state.coOwnerAddress)}
                            ${field("City, Estate & Zip Code / Ciudad, Estado y C.P.:", state.coOwnerCityStateZip)}
                            <div class="row-2">
                              ${field("Phone / Teléfono:", state.coOwnerPhone)}
                              ${field("Email:", state.coOwnerEmail)}
                            </div>
                            ${field("Notes / RFC y CURP (solo ciudadanos Mexicanos):", state.coOwnerNotes)}
                          </div>
                        </div>

                        <div class="docs">
                          <div class="docs-title">Please provide LEGIBLE copies of the following documents / Enviar copias LEGIBLES de los siguientes documentos:</div>
                          <div class="docs-cols">
                            <div>
                              <span class="docs-item">Completed and signed Unit Reservation Form</span>
                              <span class="docs-item">Copy of Passport</span>
                              <span class="docs-item">Proof of Address</span>
                              <span class="docs-item">Bank Statement</span>
                            </div>
                            <div>
                              <span class="docs-item">Carta de Reservación de la Unidad llenada y firmada</span>
                              <span class="docs-item">Copia de INE (solo mexicanos) o pasaporte</span>
                              <span class="docs-item">Comprobante de Domicilio.</span>
                              <span class="docs-item">Carátula Bancaria</span>
                              <span class="docs-item">Copia de la Constancia de RFC</span>
                              <span class="docs-item">Copia de CURP</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                ${footerTwo()}
              </div>
            </div>
          </div>
        `;
      }

      function renderPreview() {
        printRoot.innerHTML = buildPreviewHtml();
        notifyPreviewHeight();
      }

      function notifyPreviewHeight() {
        if (window.parent === window) return;
        const height = Math.max(
          document.documentElement ? document.documentElement.scrollHeight : 0,
          document.body ? document.body.scrollHeight : 0,
          printRoot ? printRoot.scrollHeight : 0
        );
        window.parent.postMessage({
          type: 'hoja-reserva-simca-preview-height',
          height: height
        }, window.location.origin);
      }

      async function loadLayout() {
        try {
          const res = await fetch('/api/hoja-reserva-simca/layout', { credentials: 'same-origin' });
          const data = await res.json().catch(function () { return {}; });
          applyLayout(res.ok && data && data.ok ? data.layout : defaultLayout);
        } catch (_) {
          applyLayout(defaultLayout);
        }
        renderPreview();
      }

      async function syncEditorAccess() {
        if (!editorBtn) return;
        try {
          const res = await fetch('/api/session-info', { credentials: 'same-origin' });
          const data = await res.json().catch(function () { return {}; });
          editorBtn.hidden = !(res.ok && data && data.ok && data.isGerente);
        } catch (_) {
          editorBtn.hidden = true;
        }
      }

      document.querySelectorAll("[data-bind]").forEach((input) => {
        const key = input.getAttribute("data-bind");
        if (Object.prototype.hasOwnProperty.call(state, key) && !state[key] && input.value) {
          state[key] = input.value;
        } else if (Object.prototype.hasOwnProperty.call(state, key)) {
          input.value = state[key];
        }
        input.addEventListener("input", () => {
          state[key] = input.value;
          renderPreview();
          scheduleAutosave();
        });
      });

      loadDraftState();
      renderHistory();

      if (historyList) {
        historyList.addEventListener('click', function (event) {
          const loadBtn = event.target.closest('[data-load-history]');
          if (loadBtn) {
            restoreHistoryItem(Number(loadBtn.getAttribute('data-load-history')));
            return;
          }
          const deleteBtn = event.target.closest('[data-delete-history]');
          if (deleteBtn) {
            deleteHistoryItem(Number(deleteBtn.getAttribute('data-delete-history')));
          }
        });
      }

      if (restoreLatestBtn) {
        restoreLatestBtn.addEventListener('click', function () {
          restoreHistoryItem(0);
        });
      }

      if (refreshHistoryBtn) {
        refreshHistoryBtn.addEventListener('click', function () {
          renderHistory();
        });
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        const payload = event.data || {};
        if (payload.type !== 'hoja-reserva-simca-layout-preview') return;
        applyLayout(payload.layout || defaultLayout);
        renderPreview();
      });

      function buildPdfSnapshotHtml() {
        const clone = document.documentElement.cloneNode(true);
        const body = clone.querySelector('body');
        if (body) {
          body.classList.remove('preview-mode', 'print-preview-mode');
          body.classList.add('print-preview-mode');
        }
        clone.querySelectorAll('script').forEach(function (node) {
          node.remove();
        });
        return '<!doctype html>\n' + clone.outerHTML;
      }

      async function downloadPdf() {
        const original = downloadPdfBtn.textContent;
        downloadPdfBtn.disabled = true;
        downloadPdfBtn.textContent = "Generando PDF...";
        statusText.textContent = "Generando PDF exacto...";
        try {
          const res = await fetch("/api/hoja-reserva-simca/render-pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({
              html: buildPdfSnapshotHtml(),
              fileNamePrefix: `hoja-reserva-${state.fullName || "simca"}`
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err && err.error ? err.error : `No se pudo generar el PDF (${res.status})`);
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "hoja-reserva-simca.pdf";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          saveSnapshot('Descarga');
          statusText.textContent = "PDF generado correctamente.";
        } catch (err) {
          statusText.textContent = err && err.message ? err.message : "No se pudo generar el PDF.";
        } finally {
          downloadPdfBtn.disabled = false;
          downloadPdfBtn.textContent = original;
        }
      }

      downloadPdfBtn.addEventListener("click", downloadPdf);
      syncEditorAccess();
      loadLayout();
    })();
  </script>
</body>
</html>
