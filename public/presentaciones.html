<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentaciones</title>
  <style>
    :root{--bg:#f4f1e8;--card:#fff;--line:#d8d1c1;--ink:#1a1a1a;--muted:#5f5f5f;--accent:#ffe816;}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 52px;}
    .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
    h1{margin:0;font-size:30px;}
    .sub{margin:6px 0 0;color:var(--muted);}
    .btn{display:inline-block;padding:10px 12px;border:1px solid #bdb8a9;border-radius:10px;background:#fff;color:#111;text-decoration:none;font-size:13px;font-weight:700;}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;}
    .card{display:block;background:var(--card);border:1px solid #dcd7cb;border-radius:14px;padding:18px;text-decoration:none;color:inherit;}
    .card:hover{border-color:#b9b39f;}
    .name{margin:0;font-size:21px;}
    @media (max-width:900px){.grid{grid-template-columns:1fr;}h1{font-size:24px;}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="hero">
      <div>
        <h1>Presentaciones</h1>
        <p class="sub">Selecciona el proyecto para generar vista previa con unidades del CBS.</p>
      </div>
      <a class="btn" href="/">Volver al backend</a>
    </div>
    <section class="grid">
      <a class="card" href="/presentaciones/solar-midtown">
        <h2 class="name">Solar Midtown</h2>
      </a>
      <a class="card" href="/presentaciones/ceiba">
        <h2 class="name">Ceiba</h2>
      </a>
    </section>
  </main>
</body>
</html>
