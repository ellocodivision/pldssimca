<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viceroy Inicio - Apartar Unidad</title>
  <style>
    :root { --bg: #f4f1e8; --card: #fff; --ink: #1a1a1a; --muted: #5f5f5f; --line: #d8d1c1; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 48px); }
    p { margin: 0 0 18px; color: var(--muted); }
    a {
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid #bdb8a9;
      border-radius: 999px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Apartar Unidad</h1>
    <p>Modulo base listo para conectar contenido.</p>
    <a href="/viceroy/inicio">Volver a Viceroy Inicio</a>
  </main>
</body>
</html>
