<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios Comerciales</title>
<style>
  :root{
    --bg:#f5f0e6;
    --card:#fffdf8;
    --card-soft:#f8f3e8;
    --ink:#1f1b16;
    --muted:#72685c;
    --line:#ddd2c0;
    --accent:#f2d24b;
    --accent-ink:#2c2412;
    --shadow:0 26px 70px rgba(62, 46, 17, 0.08);
    --morning:#8c6b11;
    --afternoon:#7fba49;
    --mid:#f6bf21;
    --gt:#5c98d2;
    --off:#eb2c2c;
    --free:#ece7dd;
    --team-a:#d56d6d;
    --team-b:#f1c232;
    --team-c:#8d7bd1;
    --row-height:86px;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at top left, rgba(242,210,75,.18), transparent 28%),
      linear-gradient(180deg, #faf6ee 0%, var(--bg) 100%);
  }

  .page{
    max-width:1480px;
    margin:0 auto;
    padding:24px 18px 40px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }

  .topbar-left{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }

  .back-btn,
  .nav-btn,
  .today-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:0 16px;
    border-radius:999px;
    text-decoration:none;
    border:1px solid #c8bda9;
    background:rgba(255,255,255,.9);
    color:#241d14;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }

  .today-btn{
    background:var(--accent);
    border-color:#ceb13f;
    color:var(--accent-ink);
  }

  .summary-strip,
  .board-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
  }

  .week-pill{
    display:inline-flex;
    align-items:center;
    gap:10px;
    min-height:42px;
    padding:0 16px;
    border-radius:999px;
    background:#f4efe3;
    border:1px solid var(--line);
    font-weight:700;
    color:#46392a;
  }

  .summary-strip{
    display:block;
    padding:18px;
    margin-top:18px;
  }

  .counters-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
  }

  .mini-stat{
    padding:14px;
    border-radius:18px;
    background:var(--card-soft);
    border:1px solid #e8dcc8;
  }

  .mini-stat .k{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#7d7264;
  }

  .mini-stat .v{
    margin-top:8px;
    font-size:18px;
    font-weight:800;
    line-height:1.15;
  }

  .board-card{
    padding:16px;
    overflow:hidden;
  }

  .board-scroll{
    overflow:auto;
  }

  .board{
    min-width:1180px;
    display:grid;
    grid-template-columns:250px repeat(7, minmax(150px, 1fr));
    grid-auto-rows:var(--row-height);
    align-items:stretch;
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    background:#fff;
  }

  .head-cell,
  .person-cell,
  .shift-cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    height:var(--row-height);
    overflow:hidden;
  }

  .head-cell{
    padding:12px 12px 10px;
    background:#f8f3e7;
  }

  .head-cell.blank{
    background:#f4eee2;
  }

  .day-name{
    font-size:15px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .day-date{
    margin-top:8px;
    font-size:13px;
    color:#73695f;
    font-weight:700;
  }

  .person-cell{
    padding:14px 16px;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
  }

  .person-name{
    font-size:18px;
    font-weight:800;
    line-height:1.05;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .person-theory{
    font-size:12px;
    color:#7a6f62;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .person-cell.group-start,
  .shift-cell.group-start{
    border-top:3px solid #e7dbc6;
  }

  .shift-cell{
    padding:10px;
    background:#fff;
  }

  .shift-cell.editable{
    cursor:pointer;
  }

  .shift-cell.editable:hover{
    background:#fbf6eb;
  }

  .shift-cell.manual .shift-card{
    box-shadow:inset 0 0 0 2px rgba(44, 36, 18, 0.24);
  }

  .shift-card{
    height:100%;
    min-height:64px;
    border-radius:20px;
    padding:12px 12px 10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:10px;
    color:#15120e;
    font-weight:800;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
    overflow:hidden;
  }

  .shift-card .title{
    font-size:13px;
    line-height:1.15;
    letter-spacing:.04em;
    text-transform:uppercase;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .shift-card .meta{
    font-size:12px;
    font-weight:700;
    opacity:.9;
  }

  .shift-card.morning,
  .shift-card.nineToTwo{background:color-mix(in srgb, var(--morning) 88%, white); color:#fff7df;}
  .shift-card.afternoon,
  .shift-card.twoToSeven{background:color-mix(in srgb, var(--afternoon) 88%, white); color:#10200d;}
  .shift-card.mid,
  .shift-card.elevenToFour{background:color-mix(in srgb, var(--mid) 90%, white); color:#241b08;}
  .shift-card.gt,
  .shift-card.onCall{background:color-mix(in srgb, var(--gt) 88%, white); color:#f6fbff;}
  .shift-card.off{background:color-mix(in srgb, var(--off) 90%, white); color:#fff4f4;}
  .shift-card.weekendSingle{background:color-mix(in srgb, var(--accent) 90%, white); color:#2c2412;}
  .shift-card.weekendMorning{background:color-mix(in srgb, var(--morning) 88%, white); color:#fff7df;}
  .shift-card.weekendAfternoon{background:color-mix(in srgb, var(--afternoon) 88%, white); color:#10200d;}
  .shift-card.free{background:#fff; color:#72675b; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}

  .manual-badge{
    align-self:flex-start;
    padding:3px 8px;
    border-radius:999px;
    background:rgba(255,255,255,.28);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .editor-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:0 0 14px;
    flex-wrap:wrap;
  }

  .editor-note{
    font-size:13px;
    color:var(--muted);
    font-weight:700;
  }

  .editor-note strong{
    color:var(--ink);
  }

  .editor-status{
    min-height:20px;
    font-size:13px;
    color:#6d624f;
    font-weight:700;
  }

  .editor-status.error{
    color:#b42318;
  }

  .cell-editor{
    position:fixed;
    right:20px;
    bottom:20px;
    width:min(320px, calc(100vw - 24px));
    padding:16px;
    border-radius:24px;
    border:1px solid var(--line);
    background:rgba(255,253,248,.98);
    box-shadow:var(--shadow);
    z-index:30;
  }

  .cell-editor[hidden]{
    display:none;
  }

  .cell-editor-title{
    font-size:15px;
    font-weight:800;
  }

  .cell-editor-meta{
    margin-top:6px;
    font-size:13px;
    color:var(--muted);
    font-weight:700;
  }

  .cell-editor-select{
    width:100%;
    margin-top:12px;
    min-height:44px;
    border-radius:14px;
    border:1px solid #ccbfa9;
    background:#fff;
    padding:0 12px;
    font:inherit;
  }

  .cell-editor-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
  }

  .cell-editor-btn{
    flex:1;
    min-height:42px;
    border-radius:999px;
    border:1px solid #c8bda9;
    background:#fff;
    color:#241d14;
    font:inherit;
    font-weight:800;
    cursor:pointer;
  }

  .cell-editor-btn.primary{
    background:var(--accent);
    border-color:#ceb13f;
  }

  .count-cell{
    min-height:var(--row-height);
    height:var(--row-height);
    padding:12px 14px;
    background:#faf7f1;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }

  .count-cell.label{
    font-size:16px;
    font-weight:800;
    display:flex;
    align-items:center;
  }

  .count-stack{
    display:grid;
    gap:6px;
  }

  .count-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    color:#5b5145;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  .count-line strong{
    font-size:15px;
    color:#1f1b16;
    letter-spacing:0;
    text-transform:none;
  }

  @media (max-width: 720px){
    .page{
      padding:18px 12px 30px;
    }
    .counters-grid{
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="/simca">Regresar a SIMCA</a>
        <button class="nav-btn" id="prevWeekBtn" type="button">Semana anterior</button>
        <div class="week-pill" id="weekRangePill">Semana</div>
        <button class="today-btn" id="currentWeekBtn" type="button">Semana actual</button>
        <button class="nav-btn" id="nextWeekBtn" type="button">Semana siguiente</button>
      </div>
    </div>

    <div class="editor-bar">
      <div class="editor-note" id="editorNote">Vista de horario.</div>
      <div class="editor-status" id="editorStatus"></div>
    </div>

    <section class="board-card">
      <div class="board-scroll">
        <div class="board" id="board"></div>
      </div>
    </section>

    <section class="summary-strip">
      <div class="counters-grid" id="countersGrid"></div>
    </section>
  </main>

  <div class="cell-editor" id="cellEditor" hidden>
    <div class="cell-editor-title" id="cellEditorTitle">Editar horario</div>
    <div class="cell-editor-meta" id="cellEditorMeta"></div>
    <select class="cell-editor-select" id="cellEditorSelect"></select>
    <div class="cell-editor-actions">
      <button class="cell-editor-btn primary" id="cellEditorSaveBtn" type="button">Guardar</button>
      <button class="cell-editor-btn" id="cellEditorDeleteBtn" type="button">Quitar ajuste</button>
      <button class="cell-editor-btn" id="cellEditorCancelBtn" type="button">Cerrar</button>
    </div>
  </div>

<script>
(function () {
  const WEEKDAY_NAMES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const MONTH_NAMES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const BASE_MONDAY = '2026-03-30';

  const ADVISORS = [
    { id: 'rodrigo', name: 'Rodrigo' },
    { id: 'andres', name: 'Andrés Castro' },
    { id: 'lu', name: 'Lu' },
    { id: 'angeles', name: 'Ángeles' },
    { id: 'rafa', name: 'Rafa' },
    { id: 'claudia', name: 'Claudia' },
    { id: 'ayrton', name: 'Ayrton' },
    { id: 'abi', name: 'Abi' }
  ];

  const WEEKEND_SINGLE_ORDER = ['angeles', 'abi', 'rafa', 'rodrigo', 'ayrton', 'lu', 'andres', 'claudia'];
  const WEEKEND_SINGLE_OFFSET = 5;
  const WEEKDAY_ROLE_ORDER = ['nineToTwo', 'elevenToFour', 'twoToSeven', 'callNineToTwo', 'callElevenToFour', 'callTwoToSeven'];
  const SHIFT_META = {
    nineToTwo: { title: 'Turno 9 a 2', short: '9 a 2', tone: 'morning' },
    elevenToFour: { title: 'Turno 11 a 4', short: '11 a 4', tone: 'mid' },
    twoToSeven: { title: 'Turno 2 a 7', short: '2 a 7', tone: 'afternoon' },
    callNineToTwo: { title: 'Bajo llamado', short: 'Llamado 9 a 2', tone: 'call' },
    callElevenToFour: { title: 'Bajo llamado', short: 'Llamado 11 a 4', tone: 'call' },
    callTwoToSeven: { title: 'Bajo llamado', short: 'Llamado 2 a 7', tone: 'call' },
    onCall: { title: 'Bajo llamado', short: 'Llamado', tone: 'call' },
    morning: { title: 'Turno 9 a 2', short: '9 a 2', tone: 'morning' },
    afternoon: { title: 'Turno 2 a 7', short: '2 a 7', tone: 'afternoon' },
    mid: { title: 'Turno 11 a 4', short: '11 a 4', tone: 'mid' },
    off: { title: 'OFF', short: 'OFF', tone: 'off' },
    weekendSingle: { title: 'Guardia fin de semana 10 a 6', short: '10 a 6', tone: 'weekend' },
    weekendMorning: { title: 'Guardia fin de semana mañana', short: 'Guardia mañana', tone: 'weekend' },
    weekendAfternoon: { title: 'Guardia fin de semana tarde', short: 'Guardia tarde', tone: 'weekend' },
    free: { title: '', short: '', tone: 'free' }
  };

  const boardEl = document.getElementById('board');
  const countersGridEl = document.getElementById('countersGrid');
  const weekRangePillEl = document.getElementById('weekRangePill');
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  const currentWeekBtn = document.getElementById('currentWeekBtn');
  const editorNoteEl = document.getElementById('editorNote');
  const editorStatusEl = document.getElementById('editorStatus');
  const cellEditorEl = document.getElementById('cellEditor');
  const cellEditorTitleEl = document.getElementById('cellEditorTitle');
  const cellEditorMetaEl = document.getElementById('cellEditorMeta');
  const cellEditorSelectEl = document.getElementById('cellEditorSelect');
  const cellEditorSaveBtn = document.getElementById('cellEditorSaveBtn');
  const cellEditorDeleteBtn = document.getElementById('cellEditorDeleteBtn');
  const cellEditorCancelBtn = document.getElementById('cellEditorCancelBtn');

  const MANUAL_SHIFT_OPTIONS = [
    { value: 'nineToTwo', label: 'Turno 9 a 2' },
    { value: 'elevenToFour', label: 'Turno 11 a 4' },
    { value: 'twoToSeven', label: 'Turno 2 a 7' },
    { value: 'callNineToTwo', label: 'Bajo llamado 9 a 2' },
    { value: 'callElevenToFour', label: 'Bajo llamado 11 a 4' },
    { value: 'callTwoToSeven', label: 'Bajo llamado 2 a 7' },
    { value: 'off', label: 'OFF' },
    { value: 'weekendSingle', label: 'Guardia fin de semana 10 a 6' },
    { value: 'weekendMorning', label: 'Guardia fin de semana mañana' },
    { value: 'weekendAfternoon', label: 'Guardia fin de semana tarde' }
  ];

  let selectedMonday = maxDate(startOfWeek(new Date()), parseIsoDate(BASE_MONDAY));
  let currentSim = null;
  let currentOverrides = [];
  let isGerente = false;
  let lastLoadToken = 0;
  let activeCellContext = null;

  function parseIsoDate(value) {
    const [y, m, d] = String(value).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }

  function startOfWeek(date) {
    const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = copy.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    copy.setDate(copy.getDate() + diff);
    copy.setHours(0, 0, 0, 0);
    return copy;
  }

  function addDays(date, days) {
    const next = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    next.setDate(next.getDate() + days);
    next.setHours(0, 0, 0, 0);
    return next;
  }

  function maxDate(a, b) {
    return a.getTime() >= b.getTime() ? a : b;
  }

  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatShortDate(date) {
    return `${date.getDate()} ${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
  }

  function formatCompactDate(date) {
    return `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
  }

  function diffWeeks(base, target) {
    return Math.max(0, Math.round((startOfWeek(target).getTime() - startOfWeek(base).getTime()) / (7 * 24 * 60 * 60 * 1000)));
  }

  function buildCell(type, meta) {
    const resolved = SHIFT_META[type] || SHIFT_META.off;
    return {
      type: SHIFT_META[type] ? type : 'off',
      title: resolved.title,
      meta: meta || ''
    };
  }

  function createHistory() {
    return ADVISORS.reduce((acc, advisor) => {
      acc[advisor.id] = {
        active: 0,
        work: 0,
        call: 0,
        nineToTwo: 0,
        elevenToFour: 0,
        twoToSeven: 0,
        callNineToTwo: 0,
        callElevenToFour: 0,
        callTwoToSeven: 0,
        off: 0,
        weekend: 0,
        lastRoleWeek: {
          nineToTwo: -1,
          elevenToFour: -1,
          twoToSeven: -1,
          callNineToTwo: -1,
          callElevenToFour: -1,
          callTwoToSeven: -1,
          off: -1
        },
        lastRoleOrder: {
          nineToTwo: -1,
          elevenToFour: -1,
          twoToSeven: -1,
          callNineToTwo: -1,
          callElevenToFour: -1,
          callTwoToSeven: -1,
          off: -1
        },
        lastWeekendWeek: -1,
        lastWeekendOrder: -1,
        lastActiveWeek: -1,
        lastActiveOrder: -1,
        lastReducedActiveWeek: -1,
        lastReducedCallWeek: -1
      };
      return acc;
    }, {});
  }

  function rotateArray(items, offset) {
    const list = Array.isArray(items) ? items.slice() : [];
    if (!list.length) return list;
    const index = ((offset % list.length) + list.length) % list.length;
    return list.slice(index).concat(list.slice(0, index));
  }

  function pickAdvisorForRole(candidates, history, role) {
    return candidates.slice().sort((a, b) => {
      const aRecord = history[a.id];
      const bRecord = history[b.id];
      const aCount = aRecord ? aRecord[role] : 0;
      const bCount = bRecord ? bRecord[role] : 0;
      if (aCount !== bCount) return aCount - bCount;
      const aTotal = aRecord ? (aRecord.nineToTwo + aRecord.elevenToFour + aRecord.twoToSeven + aRecord.callNineToTwo + aRecord.callElevenToFour + aRecord.callTwoToSeven + aRecord.off) : 0;
      const bTotal = bRecord ? (bRecord.nineToTwo + bRecord.elevenToFour + bRecord.twoToSeven + bRecord.callNineToTwo + bRecord.callElevenToFour + bRecord.callTwoToSeven + bRecord.off) : 0;
      if (aTotal !== bTotal) return aTotal - bTotal;
      const aWeek = aRecord && aRecord.lastRoleWeek ? aRecord.lastRoleWeek[role] : -1;
      const bWeek = bRecord && bRecord.lastRoleWeek ? bRecord.lastRoleWeek[role] : -1;
      if (aWeek !== bWeek) return aWeek - bWeek;
      const aOrder = aRecord && aRecord.lastRoleOrder ? aRecord.lastRoleOrder[role] : -1;
      const bOrder = bRecord && bRecord.lastRoleOrder ? bRecord.lastRoleOrder[role] : -1;
      if (aOrder !== bOrder) return aOrder - bOrder;
      return a.name.localeCompare(b.name, 'es');
    })[0] || null;
  }

  function selectWeekendAdvisor(history, weekIndex, excludedIds) {
    const startIndex = (weekIndex + WEEKEND_SINGLE_OFFSET) % WEEKEND_SINGLE_ORDER.length;
    for (let offset = 0; offset < WEEKEND_SINGLE_ORDER.length; offset += 1) {
      const advisorId = WEEKEND_SINGLE_ORDER[(startIndex + offset) % WEEKEND_SINGLE_ORDER.length];
      if (!excludedIds || !excludedIds.has(advisorId)) {
        return advisorId;
      }
    }
    return WEEKEND_SINGLE_ORDER[weekIndex % WEEKEND_SINGLE_ORDER.length];
  }

  function markWeeklyRole(history, advisorId, role, weekIndex, orderIndex) {
    const record = history[advisorId];
    if (!record || !Object.prototype.hasOwnProperty.call(record, role)) return;
    record[role] += 1;
    record.lastRoleWeek[role] = weekIndex;
    record.lastRoleOrder[role] = (weekIndex * 10) + orderIndex;
    if (role !== 'off') {
      record.active += 1;
      record.lastActiveWeek = weekIndex;
      record.lastActiveOrder = (weekIndex * 10) + orderIndex;
      if (role.startsWith('call')) {
        record.call += 1;
      } else {
        record.work += 1;
      }
    }
  }

  function markWeekendRole(history, advisorId, weekIndex, orderIndex) {
    const record = history[advisorId];
    if (!record) return;
    record.weekend += 1;
    record.lastWeekendWeek = weekIndex;
    record.lastWeekendOrder = (weekIndex * 10) + orderIndex;
  }

  function getNextWorkRole(record) {
    const sequence = ['nineToTwo', 'elevenToFour', 'twoToSeven'];
    return sequence[record.work % sequence.length];
  }

  function getNextCallRole(record) {
    const sequence = ['callNineToTwo', 'callElevenToFour', 'callTwoToSeven'];
    return sequence[record.call % sequence.length];
  }

  function getHistoryLoadScore(record) {
    return record.active + (record.weekend * 2);
  }

  function buildWeeklyTargets(history, weekendAdvisorId) {
    const targets = {};
    ADVISORS.forEach((advisor) => {
      targets[advisor.id] = { active: 2, call: 2 };
    });

    function pickReducedAdvisor(metric, excludedIds) {
      const excluded = excludedIds || new Set();
      return ADVISORS.slice().filter((advisor) => !excluded.has(advisor.id)).sort((a, b) => {
        const aRecord = history[a.id];
        const bRecord = history[b.id];
        const aCount = metric === 'call' ? aRecord.call : aRecord.active;
        const bCount = metric === 'call' ? bRecord.call : bRecord.active;
        if (aCount !== bCount) return bCount - aCount;
        const aReducedWeek = metric === 'call' ? aRecord.lastReducedCallWeek : aRecord.lastReducedActiveWeek;
        const bReducedWeek = metric === 'call' ? bRecord.lastReducedCallWeek : bRecord.lastReducedActiveWeek;
        if (aReducedWeek !== bReducedWeek) return aReducedWeek - bReducedWeek;
        const aScore = getHistoryLoadScore(aRecord);
        const bScore = getHistoryLoadScore(bRecord);
        if (aScore !== bScore) return bScore - aScore;
        return a.name.localeCompare(b.name, 'es');
      })[0] || null;
    }

    const activeReduced = pickReducedAdvisor('active', new Set());
    if (activeReduced) {
      targets[activeReduced.id].active = 1;
    }

    const callReduced = pickReducedAdvisor('call', new Set());
    if (callReduced) {
      targets[callReduced.id].call = 1;
    }

    return targets;
  }

  function rankSlotCandidates(candidates, history, weekState, slotRole, slotType) {
    const slotKind = slotType === 'call' ? 'call' : 'work';
    return candidates.slice().sort((a, b) => {
      const aRecord = history[a.id];
      const bRecord = history[b.id];
      const aState = weekState[a.id] || { activeRemaining: 0, callRemaining: 0 };
      const bState = weekState[b.id] || { activeRemaining: 0, callRemaining: 0 };
      const aRemaining = slotKind === 'call' ? aState.callRemaining : aState.activeRemaining;
      const bRemaining = slotKind === 'call' ? bState.callRemaining : bState.activeRemaining;
      if (aRemaining !== bRemaining) return bRemaining - aRemaining;

      if (slotKind === 'work') {
        const aNext = getNextWorkRole(aRecord);
        const bNext = getNextWorkRole(bRecord);
        if (aNext === slotRole && bNext !== slotRole) return -1;
        if (bNext === slotRole && aNext !== slotRole) return 1;
        if (aRecord.work !== bRecord.work) return aRecord.work - bRecord.work;
      } else {
        const aNext = getNextCallRole(aRecord);
        const bNext = getNextCallRole(bRecord);
        if (aNext === slotRole && bNext !== slotRole) return -1;
        if (bNext === slotRole && aNext !== slotRole) return 1;
        if (aRecord.call !== bRecord.call) return aRecord.call - bRecord.call;
      }

      const aActiveLoad = getHistoryLoadScore(aRecord);
      const bActiveLoad = getHistoryLoadScore(bRecord);
      if (aActiveLoad !== bActiveLoad) return aActiveLoad - bActiveLoad;
      if (aRecord.lastActiveWeek !== bRecord.lastActiveWeek) return aRecord.lastActiveWeek - bRecord.lastActiveWeek;
      if (aRecord.lastActiveOrder !== bRecord.lastActiveOrder) return aRecord.lastActiveOrder - bRecord.lastActiveOrder;
      return a.name.localeCompare(b.name, 'es');
    });
  }

  function takeFirstEligible(candidates, history, weekState, slotRole, slotType, assignedIds) {
    const filtered = candidates.filter((advisor) => !assignedIds.has(advisor.id));
    const ranked = rankSlotCandidates(filtered, history, weekState, slotRole, slotType);
    return ranked[0] || null;
  }

  function summarizeDayCounts(cells) {
    return ADVISORS.reduce((acc, advisor) => {
      const type = cells[advisor.id] ? cells[advisor.id].type : 'off';
      if (type === 'nineToTwo') acc.nineToTwo += 1;
      if (type === 'elevenToFour') acc.elevenToFour += 1;
      if (type === 'twoToSeven') acc.twoToSeven += 1;
      if (type === 'callNineToTwo') acc.callNineToTwo += 1;
      if (type === 'callElevenToFour') acc.callElevenToFour += 1;
      if (type === 'callTwoToSeven') acc.callTwoToSeven += 1;
      if (type === 'callNineToTwo' || type === 'callElevenToFour' || type === 'callTwoToSeven' || type === 'onCall') acc.onCall += 1;
      if (type === 'off') acc.off += 1;
      if (type === 'weekendSingle' || type === 'weekendMorning' || type === 'weekendAfternoon') acc.weekend += 1;
      return acc;
    }, {
      nineToTwo: 0,
      elevenToFour: 0,
      twoToSeven: 0,
      callNineToTwo: 0,
      callElevenToFour: 0,
      callTwoToSeven: 0,
      onCall: 0,
      off: 0,
      weekend: 0
    });
  }

  function buildGeneratedWeek(weekStart, history, weekIndex) {
    const weekendAdvisorId = selectWeekendAdvisor(history, weekIndex);
    const weeklyTargets = buildWeeklyTargets(history, weekendAdvisorId);
    const weekState = {};
    ADVISORS.forEach((advisor) => {
      weekState[advisor.id] = {
        activeRemaining: weeklyTargets[advisor.id] ? weeklyTargets[advisor.id].active : 2,
        callRemaining: weeklyTargets[advisor.id] ? weeklyTargets[advisor.id].call : 2
      };
    });
    const days = [];
    for (let dayIndex = 0; dayIndex < 7; dayIndex += 1) {
      const date = addDays(weekStart, dayIndex);
      const cells = {};
      ADVISORS.forEach((advisor) => {
        cells[advisor.id] = buildCell('off');
      });

      if (dayIndex <= 4) {
        const excluded = new Set();
        if (dayIndex >= 3) {
          excluded.add(weekendAdvisorId);
        }
        const assignedIds = new Set();
        const workSlots = ['nineToTwo', 'elevenToFour', 'twoToSeven'];
        const callSlots = ['callNineToTwo', 'callElevenToFour', 'callTwoToSeven'];

        workSlots.forEach((role, roleOrderIndex) => {
          const eligible = ADVISORS.filter((advisor) => {
            const state = weekState[advisor.id];
            return state.activeRemaining > 0 && !excluded.has(advisor.id) && !assignedIds.has(advisor.id);
          });
          let candidate = takeFirstEligible(eligible, history, weekState, role, 'work', assignedIds);
          if (!candidate) {
            candidate = takeFirstEligible(ADVISORS.filter((advisor) => {
              const state = weekState[advisor.id];
              return state.activeRemaining > 0 && !excluded.has(advisor.id);
            }), history, weekState, role, 'work', assignedIds);
          }
          if (!candidate) return;
          assignedIds.add(candidate.id);
          weekState[candidate.id].activeRemaining -= 1;
          const callMeta = '';
          cells[candidate.id] = buildCell(role, callMeta);
          markWeeklyRole(history, candidate.id, role, weekIndex, (dayIndex * 10) + roleOrderIndex);
        });

        callSlots.forEach((role, roleOrderIndex) => {
          const eligible = ADVISORS.filter((advisor) => {
            const state = weekState[advisor.id];
            return state.callRemaining > 0 && !excluded.has(advisor.id) && !assignedIds.has(advisor.id);
          });
          let candidate = takeFirstEligible(eligible, history, weekState, role, 'call', assignedIds);
          if (!candidate) {
            candidate = takeFirstEligible(ADVISORS.filter((advisor) => {
              const state = weekState[advisor.id];
              return state.callRemaining > 0 && !excluded.has(advisor.id);
            }), history, weekState, role, 'call', assignedIds);
          }
          if (!candidate) return;
          assignedIds.add(candidate.id);
          weekState[candidate.id].callRemaining -= 1;
          const callMeta = role === 'callNineToTwo' ? '9 a 2'
            : role === 'callElevenToFour' ? '11 a 4'
            : role === 'callTwoToSeven' ? '2 a 7'
            : '';
          cells[candidate.id] = buildCell(role, callMeta);
          markWeeklyRole(history, candidate.id, role, weekIndex, (dayIndex * 10) + 3 + roleOrderIndex);
        });

        ADVISORS.forEach((advisor) => {
          if (!assignedIds.has(advisor.id)) {
            cells[advisor.id] = buildCell('off');
            markWeeklyRole(history, advisor.id, 'off', weekIndex, (dayIndex * 10) + 9);
          }
        });
      } else {
        cells[weekendAdvisorId] = buildCell('weekendSingle', '10:00 - 18:00');
        ADVISORS.forEach((advisor) => {
          if (advisor.id !== weekendAdvisorId) {
            markWeeklyRole(history, advisor.id, 'off', weekIndex, (dayIndex * 10) + 9);
          }
        });
        if (dayIndex === 5) {
          markWeekendRole(history, weekendAdvisorId, weekIndex, dayIndex);
        }
      }

      days.push({ date, cells });
    }

    ADVISORS.forEach((advisor) => {
      if (weeklyTargets[advisor.id]) {
        if (weeklyTargets[advisor.id].active === 1) history[advisor.id].lastReducedActiveWeek = weekIndex;
        if (weeklyTargets[advisor.id].call === 1) history[advisor.id].lastReducedCallWeek = weekIndex;
      }
    });

    return {
      weekIndex,
      weekStart,
      days,
      rolesByAdvisor: Object.fromEntries(ADVISORS.map((advisor) => [advisor.id, 'mixed'])),
      weekendPair: [{ id: weekendAdvisorId, shift: 'weekendSingle' }],
      history
    };
  }

  function buildWeekSimulation(targetMonday) {
    const history = createHistory();
    const baseMonday = parseIsoDate(BASE_MONDAY);
    const totalWeeks = diffWeeks(baseMonday, targetMonday);
    let targetWeek = null;

    for (let weekIndex = 0; weekIndex <= totalWeeks; weekIndex += 1) {
      const weekStart = addDays(baseMonday, weekIndex * 7);
      const weekResult = buildGeneratedWeek(weekStart, history, weekIndex);
      if (weekIndex === totalWeeks) {
        targetWeek = weekResult;
      }
    }

    return targetWeek;
  }

  function cloneWeekSimulation(sim) {
    return {
      ...sim,
      days: sim.days.map((day) => ({
        ...day,
        cells: Object.keys(day.cells).reduce((acc, advisorId) => {
          acc[advisorId] = { ...day.cells[advisorId] };
          return acc;
        }, {})
      }))
    };
  }

  function applyOverridesToSimulation(sim, rows) {
    const nextSim = cloneWeekSimulation(sim);
    const rowsByDateAdvisor = new Map(
      rows.map((row) => [`${row.date}::${row.advisorId}`, row])
    );
    nextSim.days.forEach((day) => {
      const dayKey = dateKey(day.date);
      ADVISORS.forEach((advisor) => {
        const override = rowsByDateAdvisor.get(`${dayKey}::${advisor.id}`);
        if (!override) return;
        day.cells[advisor.id] = {
          ...buildCell(override.type),
          isManual: true
        };
      });
    });
    return nextSim;
  }

  function setEditorStatus(message, isError) {
    editorStatusEl.textContent = message || '';
    editorStatusEl.className = isError ? 'editor-status error' : 'editor-status';
  }

  function populateCellEditorOptions() {
    cellEditorSelectEl.innerHTML = MANUAL_SHIFT_OPTIONS.map((option) => (
      `<option value="${option.value}">${option.label}</option>`
    )).join('');
  }

  function closeCellEditor() {
    activeCellContext = null;
    cellEditorEl.hidden = true;
  }

  function openCellEditor(context) {
    if (!isGerente) return;
    activeCellContext = context;
    cellEditorTitleEl.textContent = `Editar ${context.advisorName}`;
    cellEditorMetaEl.textContent = `${WEEKDAY_NAMES[context.dayIndex]} · ${formatCompactDate(parseIsoDate(context.date))}`;
    cellEditorSelectEl.value = context.type;
    cellEditorDeleteBtn.disabled = !context.isManual;
    cellEditorEl.hidden = false;
  }

  async function loadOverridesForWeek(monday, keepStatus) {
    const token = ++lastLoadToken;
    if (!keepStatus) setEditorStatus('Cargando ajustes manuales...');
    try {
      const response = await fetch(`/api/horarios-simca/overrides?weekStart=${encodeURIComponent(dateKey(monday))}`, {
        credentials: 'same-origin'
      });
      const contentType = String(response.headers.get('content-type') || '').toLowerCase();
      if (!response.ok) {
        throw new Error(`No se pudo cargar ajustes (${response.status}).`);
      }
      if (!contentType.includes('application/json')) {
        throw new Error('La respuesta de ajustes no vino en JSON.');
      }
      const data = await response.json();
      if (token !== lastLoadToken) return;
      currentOverrides = Array.isArray(data.rows) ? data.rows : [];
      isGerente = !!data.isGerente;
      editorNoteEl.innerHTML = isGerente
        ? '<strong>Edicion manual activa.</strong> Da click en una celda para cambiar solo ese dia sin alterar semanas futuras.'
        : 'Vista de horario.';
      if (!keepStatus) setEditorStatus('');
      currentSim = applyOverridesToSimulation(buildWeekSimulation(monday), currentOverrides);
      renderWeek(currentSim);
      renderCounters(currentSim);
    } catch (err) {
      if (token !== lastLoadToken) return;
      setEditorStatus(err && err.message ? err.message : 'No se pudieron cargar los ajustes manuales.', true);
      currentOverrides = [];
      isGerente = false;
      editorNoteEl.textContent = 'Vista de horario.';
      currentSim = buildWeekSimulation(monday);
      renderWeek(currentSim);
      renderCounters(currentSim);
    }
  }

  function getRoleLabel(role) {
    if (role === 'mixed') return 'Rotación semanal';
    return SHIFT_META[role] ? SHIFT_META[role].short : '';
  }

  function renderWeek(sim) {
    const weekEnd = addDays(sim.weekStart, 6);
    weekRangePillEl.textContent = `${formatShortDate(sim.weekStart)} · ${formatShortDate(weekEnd)}`;

    const header = [
      '<div class="head-cell blank"></div>',
      ...sim.days.map((day) => `
        <div class="head-cell">
          <div class="day-name">${WEEKDAY_NAMES[day.date.getDay() === 0 ? 6 : day.date.getDay() - 1]}</div>
          <div class="day-date">${formatCompactDate(day.date)}</div>
        </div>
      `)
    ].join('');

    const rows = ADVISORS.map((advisor) => {
      const role = sim.rolesByAdvisor && sim.rolesByAdvisor[advisor.id] ? sim.rolesByAdvisor[advisor.id] : 'off';
      const theoryLabel = getRoleLabel(role);
      const row = [
        `<div class="person-cell">
          <div class="person-name">${advisor.name}</div>
          <div class="person-theory">${theoryLabel}</div>
        </div>`
      ];
      sim.days.forEach((day, dayIndex) => {
        const cell = day.cells[advisor.id];
        const manualBadge = cell.isManual ? '<div class="manual-badge">Manual</div>' : '';
        const editableClass = isGerente ? ' editable' : '';
        const manualClass = cell.isManual ? ' manual' : '';
        row.push(`
          <div
            class="shift-cell${editableClass}${manualClass}"
            data-advisor-id="${advisor.id}"
            data-date="${dateKey(day.date)}"
            data-day-index="${dayIndex}"
          >
            <div class="shift-card ${cell.type}">
              <div class="title">${cell.title}</div>
              ${manualBadge}
              <div class="meta">${cell.meta || ''}</div>
            </div>
          </div>
        `);
      });
      return row.join('');
    }).join('');

    const totalsRow = [
      '<div class="count-cell label">Conteo</div>',
      ...sim.days.map((day) => {
        const counts = summarizeDayCounts(day.cells);
        return `
          <div class="count-cell">
            <div class="count-stack">
              <div class="count-line"><span>9 a 2</span><strong>${counts.nineToTwo}</strong></div>
              <div class="count-line"><span>11 a 4</span><strong>${counts.elevenToFour}</strong></div>
              <div class="count-line"><span>2 a 7</span><strong>${counts.twoToSeven}</strong></div>
              <div class="count-line"><span>Llamado</span><strong>${counts.onCall}</strong></div>
              <div class="count-line"><span>FDS</span><strong>${counts.weekend}</strong></div>
            </div>
          </div>
        `;
      })
    ].join('');

    boardEl.innerHTML = header + rows + totalsRow;
  }

  function renderCounters(sim) {
    countersGridEl.innerHTML = ADVISORS.map((advisor) => {
      const record = sim.history[advisor.id];
      const callTotal = record.callNineToTwo + record.callElevenToFour + record.callTwoToSeven;
      return `
        <div class="mini-stat">
          <div class="k">${advisor.name}</div>
          <div class="v">9-2: ${record.nineToTwo} · 11-4: ${record.elevenToFour} · 2-7: ${record.twoToSeven} · Llamado: ${callTotal} · OFF: ${record.off} · FDS: ${record.weekend}</div>
        </div>
      `;
    }).join('');
  }

  async function rerender() {
    const monday = maxDate(startOfWeek(selectedMonday), parseIsoDate(BASE_MONDAY));
    selectedMonday = monday;
    closeCellEditor();
    await loadOverridesForWeek(monday);
  }

  boardEl.addEventListener('click', function (event) {
    if (!isGerente || !currentSim) return;
    const cellEl = event.target.closest('.shift-cell[data-advisor-id]');
    if (!cellEl) return;
    const advisorId = String(cellEl.dataset.advisorId || '');
    const date = String(cellEl.dataset.date || '');
    const dayIndex = Number(cellEl.dataset.dayIndex || 0);
    const advisor = ADVISORS.find((item) => item.id === advisorId);
    const day = currentSim.days[dayIndex];
    const cell = day && day.cells ? day.cells[advisorId] : null;
    if (!advisor || !cell || !date) return;
    openCellEditor({
      advisorId,
      advisorName: advisor.name,
      date,
      dayIndex,
      type: cell.type,
      isManual: !!cell.isManual
    });
  });

  cellEditorCancelBtn.addEventListener('click', function () {
    closeCellEditor();
  });

  cellEditorSaveBtn.addEventListener('click', async function () {
    if (!activeCellContext) return;
    setEditorStatus('Guardando ajuste manual...');
    try {
      const response = await fetch('/api/horarios-simca/overrides', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          weekStart: dateKey(selectedMonday),
          date: activeCellContext.date,
          advisorId: activeCellContext.advisorId,
          type: cellEditorSelectEl.value
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data && data.error ? data.error : 'No se pudo guardar.');
      closeCellEditor();
      setEditorStatus('Ajuste manual guardado.');
      await loadOverridesForWeek(selectedMonday, true);
    } catch (err) {
      setEditorStatus(err && err.message ? err.message : 'No se pudo guardar el ajuste.', true);
    }
  });

  cellEditorDeleteBtn.addEventListener('click', async function () {
    if (!activeCellContext || !activeCellContext.isManual) return;
    setEditorStatus('Quitando ajuste manual...');
    try {
      const response = await fetch('/api/horarios-simca/overrides', {
        method: 'DELETE',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          weekStart: dateKey(selectedMonday),
          date: activeCellContext.date,
          advisorId: activeCellContext.advisorId
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data && data.error ? data.error : 'No se pudo quitar.');
      closeCellEditor();
      setEditorStatus('Ajuste manual eliminado.');
      await loadOverridesForWeek(selectedMonday, true);
    } catch (err) {
      setEditorStatus(err && err.message ? err.message : 'No se pudo quitar el ajuste.', true);
    }
  });

  prevWeekBtn.addEventListener('click', async function () {
    const next = addDays(selectedMonday, -7);
    if (next.getTime() < parseIsoDate(BASE_MONDAY).getTime()) return;
    selectedMonday = next;
    await rerender();
  });

  nextWeekBtn.addEventListener('click', async function () {
    selectedMonday = addDays(selectedMonday, 7);
    await rerender();
  });

  currentWeekBtn.addEventListener('click', async function () {
    selectedMonday = maxDate(startOfWeek(new Date()), parseIsoDate(BASE_MONDAY));
    await rerender();
  });

  populateCellEditorOptions();
  rerender();
})();
</script>
</body>
