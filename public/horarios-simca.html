<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios Comerciales</title>
<style>
  :root{
    --bg:#f5f0e6;
    --card:#fffdf8;
    --card-soft:#f8f3e8;
    --ink:#1f1b16;
    --muted:#72685c;
    --line:#ddd2c0;
    --accent:#f2d24b;
    --accent-ink:#2c2412;
    --shadow:0 26px 70px rgba(62, 46, 17, 0.08);
    --morning:#8c6b11;
    --afternoon:#7fba49;
    --mid:#f6bf21;
    --gt:#5c98d2;
    --off:#eb2c2c;
    --free:#ece7dd;
    --team-a:#d56d6d;
    --team-b:#f1c232;
    --team-c:#8d7bd1;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at top left, rgba(242,210,75,.18), transparent 28%),
      linear-gradient(180deg, #faf6ee 0%, var(--bg) 100%);
  }

  .page{
    max-width:1480px;
    margin:0 auto;
    padding:24px 18px 40px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }

  .topbar-left{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }

  .back-btn,
  .nav-btn,
  .today-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:0 16px;
    border-radius:999px;
    text-decoration:none;
    border:1px solid #c8bda9;
    background:rgba(255,255,255,.9);
    color:#241d14;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }

  .today-btn{
    background:var(--accent);
    border-color:#ceb13f;
    color:var(--accent-ink);
  }

  .summary-strip,
  .board-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
  }

  .week-pill{
    display:inline-flex;
    align-items:center;
    gap:10px;
    min-height:42px;
    padding:0 16px;
    border-radius:999px;
    background:#f4efe3;
    border:1px solid var(--line);
    font-weight:700;
    color:#46392a;
  }

  .summary-strip{
    display:block;
    padding:18px;
    margin-top:18px;
  }

  .counters-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
  }

  .mini-stat{
    padding:14px;
    border-radius:18px;
    background:var(--card-soft);
    border:1px solid #e8dcc8;
  }

  .mini-stat .k{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#7d7264;
  }

  .mini-stat .v{
    margin-top:8px;
    font-size:18px;
    font-weight:800;
    line-height:1.15;
  }

  .board-card{
    padding:16px;
    overflow:hidden;
  }

  .board-scroll{
    overflow:auto;
  }

  .board{
    min-width:1180px;
    display:grid;
    grid-template-columns:250px repeat(7, minmax(150px, 1fr));
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    background:#fff;
  }

  .head-cell,
  .person-cell,
  .shift-cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  .head-cell{
    padding:12px 12px 10px;
    background:#f8f3e7;
    min-height:86px;
  }

  .head-cell.blank{
    background:#f4eee2;
  }

  .day-name{
    font-size:15px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .day-date{
    margin-top:8px;
    font-size:13px;
    color:#73695f;
    font-weight:700;
  }

  .person-cell{
    min-height:86px;
    padding:14px 16px;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
  }

  .person-name{
    font-size:18px;
    font-weight:800;
    line-height:1.05;
  }

  .person-cell.group-start,
  .shift-cell.group-start{
    border-top:3px solid #e7dbc6;
  }

  .shift-cell{
    min-height:86px;
    padding:10px;
    background:#fff;
  }

  .shift-card{
    height:100%;
    min-height:64px;
    border-radius:20px;
    padding:12px 12px 10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:10px;
    color:#15120e;
    font-weight:800;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  }

  .shift-card .title{
    font-size:13px;
    line-height:1.15;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .shift-card .meta{
    font-size:12px;
    font-weight:700;
    opacity:.9;
  }

  .shift-card.morning{background:color-mix(in srgb, var(--morning) 88%, white); color:#fff7df;}
  .shift-card.afternoon{background:color-mix(in srgb, var(--afternoon) 88%, white); color:#10200d;}
  .shift-card.mid{background:color-mix(in srgb, var(--mid) 90%, white); color:#241b08;}
  .shift-card.gt{background:color-mix(in srgb, var(--gt) 88%, white); color:#f6fbff;}
  .shift-card.off{background:color-mix(in srgb, var(--off) 90%, white); color:#fff4f4;}
  .shift-card.weekendMorning{background:color-mix(in srgb, var(--morning) 88%, white); color:#fff7df;}
  .shift-card.weekendAfternoon{background:color-mix(in srgb, var(--afternoon) 88%, white); color:#10200d;}
  .shift-card.free{background:var(--free); color:#72675b;}

  .count-cell{
    min-height:78px;
    padding:12px 14px;
    background:#faf7f1;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  .count-cell.label{
    font-size:16px;
    font-weight:800;
    display:flex;
    align-items:center;
  }

  .count-stack{
    display:grid;
    gap:6px;
  }

  .count-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    color:#5b5145;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  .count-line strong{
    font-size:15px;
    color:#1f1b16;
    letter-spacing:0;
    text-transform:none;
  }

  @media (max-width: 720px){
    .page{
      padding:18px 12px 30px;
    }
    .counters-grid{
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="/simca">Regresar a SIMCA</a>
        <button class="nav-btn" id="prevWeekBtn" type="button">Semana anterior</button>
        <div class="week-pill" id="weekRangePill">Semana</div>
        <button class="today-btn" id="currentWeekBtn" type="button">Semana actual</button>
        <button class="nav-btn" id="nextWeekBtn" type="button">Semana siguiente</button>
      </div>
    </div>

    <section class="board-card">
      <div class="board-scroll">
        <div class="board" id="board"></div>
      </div>
    </section>

    <section class="summary-strip">
      <div class="counters-grid" id="countersGrid"></div>
    </section>
  </main>

<script>
(function () {
  const WEEKDAY_NAMES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const MONTH_NAMES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const BASE_MONDAY = '2026-03-30';

  const TEAM_ORDER = [
    ['rodrigo', 'andres', 'lu'],
    ['angeles', 'rafa', 'claudia'],
    ['ayrton', 'abi']
  ];

  const ADVISORS = [
    { id: 'rodrigo', name: 'Rodrigo', team: 'alpha', phaseOffset: 0 },
    { id: 'andres', name: 'Andrés Castro', team: 'alpha', phaseOffset: 1 },
    { id: 'lu', name: 'Lu', team: 'alpha', phaseOffset: 2 },
    { id: 'angeles', name: 'Ángeles', team: 'beta', phaseOffset: 0 },
    { id: 'rafa', name: 'Rafa', team: 'beta', phaseOffset: 1 },
    { id: 'claudia', name: 'Claudia', team: 'beta', phaseOffset: 2 },
    { id: 'ayrton', name: 'Ayrton', team: 'gamma', phaseOffset: 0 },
    { id: 'abi', name: 'Abi', team: 'gamma', phaseOffset: 1 }
  ];

  const SEEDED_WEEKS = {
    '2026-03-30': {
      rodrigo: ['M','M','M','O','O','WM','WM'],
      andres:  ['M','M','M','M','M','F','F'],
      angeles: ['T','T','T','T','T','F','F'],
      rafa:    ['T','T','T','O','O','WA','WA'],
      ayrton:  ['X','G','X','X','X','F','F'],
      abi:     ['X','X','G','X','X','F','F'],
      lu:      ['G','X','X','M','M','F','F'],
      claudia: ['F','F','F','F','F','F','F']
    },
    '2026-04-06': {
      rodrigo: ['G','X','X','T','X','F','F'],
      andres:  ['X','X','G','X','T','F','F'],
      angeles: ['M','G','M','M','M','F','F'],
      rafa:    ['M','M','M','M','M','F','F'],
      ayrton:  ['T','T','T','O','O','WA','WA'],
      abi:     ['T','T','T','T','T','F','F'],
      lu:      ['M','M','X','O','O','WM','WM'],
      claudia: ['X','X','X','X','X','F','F']
    },
    '2026-04-13': {
      rodrigo: ['T','T','T','T','T','F','F'],
      andres:  ['T','T','T','O','O','WA','WA'],
      angeles: ['X','X','X','X','X','F','F'],
      rafa:    ['G','X','X','X','X','F','F'],
      ayrton:  ['M','M','G','M','M','F','F'],
      abi:     ['M','M','M','M','M','F','F'],
      lu:      ['T','G','M','T','T','F','F'],
      claudia: ['T','T','T','O','O','WM','WM']
    },
    '2026-04-20': {
      rodrigo: ['M','M','G','T','T','F','F'],
      andres:  ['M','M','M','M','M','F','F'],
      angeles: ['T','T','T','O','O','WA','WA'],
      rafa:    ['T','T','T','T','T','F','F'],
      ayrton:  ['X','X','X','X','X','F','F'],
      abi:     ['G','X','X','O','O','WM','WM'],
      lu:      ['M','M','M','M','M','F','F'],
      claudia: ['M','G','M','M','M','F','F']
    }
  };

  const SHIFT_CODE_TO_TYPE = {
    M: 'morning',
    T: 'afternoon',
    X: 'mid',
    G: 'gt',
    O: 'off',
    WM: 'weekendMorning',
    WA: 'weekendAfternoon',
    F: 'free'
  };

  const SHIFT_META = {
    morning: { title: 'Oficina NEST mañana', short: 'Mañana', tone: 'morning' },
    afternoon: { title: 'Oficina NEST tarde', short: 'Tarde', tone: 'afternoon' },
    mid: { title: 'Oficina NEST 11 a 4', short: '11 a 4', tone: 'mid' },
    gt: { title: 'Gran Tulum', short: 'Gran Tulum', tone: 'gt' },
    off: { title: 'OFF', short: 'OFF', tone: 'off' },
    weekendMorning: { title: 'Guardia fin de semana mañana', short: 'Guardia mañana', tone: 'weekend' },
    weekendAfternoon: { title: 'Guardia fin de semana tarde', short: 'Guardia tarde', tone: 'weekend' },
    free: { title: 'Libre', short: 'Libre', tone: 'free' }
  };

  const PHASE_SEQUENCE = ['morning', 'mid', 'afternoon'];

  const boardEl = document.getElementById('board');
  const countersGridEl = document.getElementById('countersGrid');
  const weekRangePillEl = document.getElementById('weekRangePill');
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  const currentWeekBtn = document.getElementById('currentWeekBtn');

  const advisorMap = new Map(ADVISORS.map((advisor) => [advisor.id, advisor]));
  let selectedMonday = maxDate(startOfWeek(new Date()), parseIsoDate(BASE_MONDAY));

  function parseIsoDate(value) {
    const [y, m, d] = String(value).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }

  function startOfWeek(date) {
    const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = copy.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    copy.setDate(copy.getDate() + diff);
    copy.setHours(0, 0, 0, 0);
    return copy;
  }

  function addDays(date, days) {
    const next = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    next.setDate(next.getDate() + days);
    next.setHours(0, 0, 0, 0);
    return next;
  }

  function maxDate(a, b) {
    return a.getTime() >= b.getTime() ? a : b;
  }

  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatShortDate(date) {
    return `${date.getDate()} ${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
  }

  function formatCompactDate(date) {
    return `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
  }

  function diffWeeks(base, target) {
    return Math.max(0, Math.round((startOfWeek(target).getTime() - startOfWeek(base).getTime()) / (7 * 24 * 60 * 60 * 1000)));
  }

  function getPreferredShift(advisor, weekIndex) {
    return PHASE_SEQUENCE[(weekIndex + advisor.phaseOffset) % PHASE_SEQUENCE.length];
  }

  function oppositeWeekendShift(shift) {
    return shift === 'weekendMorning' ? 'weekendAfternoon' : 'weekendMorning';
  }

  function createHistory() {
    return ADVISORS.reduce((acc, advisor) => {
      acc[advisor.id] = {
        morning: 0,
        afternoon: 0,
        mid: 0,
        gt: 0,
        weekend: 0,
        rebalanceMoves: 0,
        lastOfficeShift: null,
        weekendAssignments: 0,
        weekendInitialShift: null,
        lastRebalanceWeek: -1,
        lastGtWeek: -1,
        lastWeekendWeek: -1,
        lastGtOrder: -1,
        lastWeekendOrder: -1
      };
      return acc;
    }, {});
  }

  function buildCell(type, meta) {
    return {
      type,
      title: SHIFT_META[type].title,
      meta: meta || SHIFT_META[type].short
    };
  }

  function applyAssignmentToHistory(history, advisorId, type, weekIndex, options) {
    const record = history[advisorId];
    if (!record) return;
    if (options && options.rebalanced) {
      record.rebalanceMoves += 1;
      record.lastRebalanceWeek = weekIndex;
    }
    if (type === 'morning' || type === 'afternoon' || type === 'mid') {
      record[type] += 1;
      record.lastOfficeShift = type;
    }
    if (type === 'gt') {
      record.gt += 1;
      record.lastGtWeek = weekIndex;
      record.lastGtOrder = typeof options?.sortOrder === 'number' ? options.sortOrder : (weekIndex * 10);
    }
    if (type === 'weekendMorning' || type === 'weekendAfternoon') {
      if (!record.weekendInitialShift) {
        record.weekendInitialShift = type;
      }
      record.weekend += 1;
      record.weekendAssignments += 1;
      record.lastWeekendWeek = weekIndex;
      record.lastWeekendOrder = typeof options?.sortOrder === 'number' ? options.sortOrder : (weekIndex * 10);
    }
  }

  function deriveQueueFromHistory(history, kind) {
    return ADVISORS.slice().sort((a, b) => {
      const aRecord = history[a.id];
      const bRecord = history[b.id];
      const aOrder = kind === 'gt' ? aRecord.lastGtOrder : aRecord.lastWeekendOrder;
      const bOrder = kind === 'gt' ? bRecord.lastGtOrder : bRecord.lastWeekendOrder;
      if (aOrder !== bOrder) return aOrder - bOrder;
      return a.name.localeCompare(b.name, 'es');
    }).map((advisor) => advisor.id);
  }

  function takeFromQueue(queue, count, excludedSet) {
    const picked = [];
    const remaining = [];
    queue.forEach((id) => {
      if (picked.length < count && !(excludedSet && excludedSet.has(id))) {
        picked.push(id);
      } else {
        remaining.push(id);
      }
    });
    return {
      picked,
      nextQueue: remaining.concat(picked)
    };
  }

  function computeBaseShiftScore(advisor, shiftKey, history, weekIndex) {
    const record = history[advisor.id];
    const preferred = getPreferredShift(advisor, weekIndex);
    return (
      (record[shiftKey] * 100) +
      (preferred === shiftKey ? 0 : 22) +
      (record.lastOfficeShift === shiftKey ? -10 : 0)
    );
  }

  function chooseForWeeklyBase(candidates, shiftKey, count, history, weekIndex) {
    const pool = candidates.slice().sort((a, b) => {
      const scoreA = computeBaseShiftScore(a, shiftKey, history, weekIndex);
      const scoreB = computeBaseShiftScore(b, shiftKey, history, weekIndex);
      if (scoreA !== scoreB) return scoreA - scoreB;
      return a.name.localeCompare(b.name, 'es');
    });
    return pool.slice(0, count);
  }

  function getOfficeTargets(activeCount) {
    if (activeCount >= 5) {
      return { morning: 2, afternoon: 3, mid: activeCount - 5 };
    }
    if (activeCount === 4) {
      return { morning: 2, afternoon: 2, mid: 0 };
    }
    if (activeCount === 3) {
      return { morning: 1, afternoon: 2, mid: 0 };
    }
    if (activeCount === 2) {
      return { morning: 1, afternoon: 1, mid: 0 };
    }
    if (activeCount === 1) {
      return { morning: 0, afternoon: 1, mid: 0 };
    }
    return { morning: 0, afternoon: 0, mid: 0 };
  }

  function buildWeeklyBaseAssignments(history, weekIndex) {
    const advisors = ADVISORS.slice();
    const morningBase = chooseForWeeklyBase(advisors, 'morning', 2, history, weekIndex);
    const remainingAfterMorning = advisors.filter((advisor) => !morningBase.some((item) => item.id === advisor.id));
    const afternoonBase = chooseForWeeklyBase(remainingAfterMorning, 'afternoon', 2, history, weekIndex);
    const base = {};
    morningBase.forEach((advisor) => { base[advisor.id] = 'morning'; });
    afternoonBase.forEach((advisor) => { base[advisor.id] = 'afternoon'; });
    ADVISORS.forEach((advisor) => {
      if (!base[advisor.id]) base[advisor.id] = 'mid';
    });
    return base;
  }

  function computeDailyShiftScore(advisor, shiftKey, baseAssignments, history) {
    const record = history[advisor.id];
    const baseShift = baseAssignments[advisor.id];
    const basePenalty = baseShift === shiftKey ? 0 : (baseShift === 'mid' ? 28 : 48);
    return (
      (record[shiftKey] * 100) +
      basePenalty +
      (record.lastOfficeShift === shiftKey ? -8 : 0)
    );
  }

  function chooseDayAssignments(activeIds, baseAssignments, history) {
    const advisors = activeIds.map((id) => advisorMap.get(id)).filter(Boolean);
    const assignments = {};
    const targets = getOfficeTargets(advisors.length);
    const morningNeed = Math.min(targets.morning, advisors.length);
    const morningPicked = advisors.slice().sort((a, b) => {
      const scoreA = computeDailyShiftScore(a, 'morning', baseAssignments, history);
      const scoreB = computeDailyShiftScore(b, 'morning', baseAssignments, history);
      if (scoreA !== scoreB) return scoreA - scoreB;
      return a.name.localeCompare(b.name, 'es');
    }).slice(0, morningNeed);

    const afterMorning = advisors.filter((advisor) => !morningPicked.some((item) => item.id === advisor.id));
    const afternoonNeed = Math.min(targets.afternoon, afterMorning.length);
    const afternoonPicked = afterMorning.slice().sort((a, b) => {
      const scoreA = computeDailyShiftScore(a, 'afternoon', baseAssignments, history);
      const scoreB = computeDailyShiftScore(b, 'afternoon', baseAssignments, history);
      if (scoreA !== scoreB) return scoreA - scoreB;
      return a.name.localeCompare(b.name, 'es');
    }).slice(0, afternoonNeed);

    morningPicked.forEach((advisor) => { assignments[advisor.id] = 'morning'; });
    afternoonPicked.forEach((advisor) => { assignments[advisor.id] = 'afternoon'; });
    advisors.forEach((advisor) => {
      if (!assignments[advisor.id]) assignments[advisor.id] = 'mid';
    });
    return assignments;
  }

  function summarizeOfficeCounts(cells) {
    return ADVISORS.reduce((acc, advisor) => {
      const type = cells[advisor.id] ? cells[advisor.id].type : 'free';
      if (type === 'morning' || type === 'weekendMorning') acc.morning += 1;
      if (type === 'afternoon' || type === 'weekendAfternoon') acc.afternoon += 1;
      if (type === 'mid') acc.mid += 1;
      return acc;
    }, { morning: 0, afternoon: 0, mid: 0 });
  }

  function rebalanceOfficeCells(cells, history, weekIndex) {
    const moved = new Set();
    let counts = summarizeOfficeCounts(cells);
    const activeCount = counts.morning + counts.afternoon + counts.mid;
    const targets = getOfficeTargets(activeCount);

    for (let guard = 0; guard < 20; guard += 1) {
      if (
        counts.morning === targets.morning &&
        counts.afternoon === targets.afternoon &&
        counts.mid === targets.mid
      ) {
        break;
      }

      let fromType = null;
      let toType = null;

      if (counts.afternoon < targets.afternoon) {
        if (counts.morning > targets.morning) {
          fromType = 'morning';
          toType = 'afternoon';
        } else if (counts.mid > targets.mid) {
          fromType = 'mid';
          toType = 'afternoon';
        }
      } else if (counts.morning < targets.morning) {
        if (counts.afternoon > targets.afternoon) {
          fromType = 'afternoon';
          toType = 'morning';
        } else if (counts.mid > targets.mid) {
          fromType = 'mid';
          toType = 'morning';
        }
      } else if (counts.mid < targets.mid) {
        if (counts.afternoon > targets.afternoon) {
          fromType = 'afternoon';
          toType = 'mid';
        } else if (counts.morning > targets.morning) {
          fromType = 'morning';
          toType = 'mid';
        }
      } else if (counts.mid > targets.mid) {
        if (counts.afternoon < targets.afternoon) {
          fromType = 'mid';
          toType = 'afternoon';
        } else if (counts.morning < targets.morning) {
          fromType = 'mid';
          toType = 'morning';
        }
      }

      if (!fromType || !toType) break;
      const candidates = ADVISORS.filter((advisor) => cells[advisor.id] && cells[advisor.id].type === fromType);
      if (!candidates.length) break;

      candidates.sort((a, b) => {
        const aRecord = history[a.id];
        const bRecord = history[b.id];
        if (aRecord.rebalanceMoves !== bRecord.rebalanceMoves) return aRecord.rebalanceMoves - bRecord.rebalanceMoves;
        if (aRecord.lastRebalanceWeek !== bRecord.lastRebalanceWeek) return aRecord.lastRebalanceWeek - bRecord.lastRebalanceWeek;
        return a.name.localeCompare(b.name, 'es');
      });

      const picked = candidates[0];
      cells[picked.id] = buildCell(toType);
      moved.add(picked.id);
      counts = summarizeOfficeCounts(cells);
    }

    return moved;
  }

  function buildSeededWeek(weekStart, seedWeek, history, weekIndex) {
    const days = [];
    const gtAssignments = [];
    const weekendPair = [];

    for (let dayIndex = 0; dayIndex < 7; dayIndex += 1) {
      const date = addDays(weekStart, dayIndex);
      const cells = {};
      const dayAssignments = [];
      ADVISORS.forEach((advisor) => {
        const code = seedWeek[advisor.id] ? seedWeek[advisor.id][dayIndex] : 'F';
        const type = SHIFT_CODE_TO_TYPE[code] || 'free';
        if (type === 'gt') gtAssignments.push(advisor.id);
        if ((type === 'weekendMorning' || type === 'weekendAfternoon') && !weekendPair.some((item) => item.id === advisor.id)) {
          weekendPair.push({ id: advisor.id, shift: type });
        }
        cells[advisor.id] = buildCell(type, type === 'off' ? 'Descanso por guardia' : '');
        dayAssignments.push({ advisorId: advisor.id, type });
      });

      const movedIds = dayIndex <= 4 ? rebalanceOfficeCells(cells, history, weekIndex) : new Set();
      dayAssignments.forEach(({ advisorId }) => {
        applyAssignmentToHistory(history, advisorId, cells[advisorId].type, weekIndex, {
          rebalanced: movedIds.has(advisorId),
          sortOrder: (weekIndex * 10) + dayIndex
        });
      });
      days.push({ date, cells });
    }

    return {
      weekIndex,
      weekStart,
      days,
      gtAssignments,
      weekendPair,
      nextGtQueue: deriveQueueFromHistory(history, 'gt'),
      nextWeekendQueue: deriveQueueFromHistory(history, 'weekend'),
      history
    };
  }

  function buildGeneratedWeek(weekStart, history, gtQueue, weekendQueue, weekIndex) {
    const weekendPull = takeFromQueue(weekendQueue, 2, new Set());
    const weekendPair = weekendPull.picked.map((id, pairIndex) => {
      const record = history[id];
      if (!record.weekendInitialShift) {
        record.weekendInitialShift = pairIndex === 0 ? 'weekendMorning' : 'weekendAfternoon';
      }
      const shift = record.weekendAssignments % 2 === 0
        ? record.weekendInitialShift
        : oppositeWeekendShift(record.weekendInitialShift);
      return { id, shift };
    });

    const weekendIds = new Set(weekendPair.map((item) => item.id));
    const gtPull = takeFromQueue(gtQueue, 3, weekendIds);
    const gtAssignments = gtPull.picked;
    const baseAssignments = buildWeeklyBaseAssignments(history, weekIndex);
    const days = [];

    for (let dayIndex = 0; dayIndex < 7; dayIndex += 1) {
      const date = addDays(weekStart, dayIndex);
      const cells = {};
      ADVISORS.forEach((advisor) => {
        cells[advisor.id] = buildCell('free');
      });

      if (dayIndex <= 2) {
        const gtAdvisorId = gtAssignments[dayIndex];
        if (gtAdvisorId) {
          cells[gtAdvisorId] = buildCell('gt');
        }
        const activeIds = ADVISORS.map((advisor) => advisor.id).filter((id) => id !== gtAdvisorId);
        const officeAssignments = chooseDayAssignments(activeIds, baseAssignments, history);
        Object.keys(officeAssignments).forEach((advisorId) => {
          const type = officeAssignments[advisorId];
          cells[advisorId] = buildCell(type);
        });
        const movedIds = rebalanceOfficeCells(cells, history, weekIndex);
        ADVISORS.forEach((advisor) => {
          applyAssignmentToHistory(history, advisor.id, cells[advisor.id].type, weekIndex, {
            rebalanced: movedIds.has(advisor.id),
            sortOrder: (weekIndex * 10) + dayIndex
          });
        });
      } else if (dayIndex <= 4) {
        weekendPair.forEach((item) => {
          cells[item.id] = buildCell('off', 'Descanso por guardia');
        });
        const activeIds = ADVISORS.map((advisor) => advisor.id).filter((id) => !weekendIds.has(id));
        const officeAssignments = chooseDayAssignments(activeIds, baseAssignments, history);
        Object.keys(officeAssignments).forEach((advisorId) => {
          const type = officeAssignments[advisorId];
          cells[advisorId] = buildCell(type);
        });
        const movedIds = rebalanceOfficeCells(cells, history, weekIndex);
        ADVISORS.forEach((advisor) => {
          applyAssignmentToHistory(history, advisor.id, cells[advisor.id].type, weekIndex, {
            rebalanced: movedIds.has(advisor.id),
            sortOrder: (weekIndex * 10) + dayIndex
          });
        });
      } else {
        weekendPair.forEach((item) => {
          cells[item.id] = buildCell(item.shift, 'Sábado y domingo');
        });
        ADVISORS.forEach((advisor) => {
          if (!weekendIds.has(advisor.id)) {
            cells[advisor.id] = buildCell('free', 'Sin guardia');
          }
        });
        ADVISORS.forEach((advisor) => {
          applyAssignmentToHistory(history, advisor.id, cells[advisor.id].type, weekIndex, {
            sortOrder: (weekIndex * 10) + dayIndex
          });
        });
      }

      days.push({ date, cells });
    }

    return {
      weekIndex,
      weekStart,
      days,
      gtAssignments,
      weekendPair,
      nextGtQueue: gtPull.nextQueue,
      nextWeekendQueue: weekendPull.nextQueue,
      history
    };
  }

  function buildWeekSimulation(targetMonday) {
    const history = createHistory();
    const baseMonday = parseIsoDate(BASE_MONDAY);
    const totalWeeks = diffWeeks(baseMonday, targetMonday);
    let gtQueue = null;
    let weekendQueue = null;
    let targetWeek = null;

    for (let weekIndex = 0; weekIndex <= totalWeeks; weekIndex += 1) {
      const weekStart = addDays(baseMonday, weekIndex * 7);
      const key = dateKey(weekStart);
      let weekResult;

      if (SEEDED_WEEKS[key]) {
        weekResult = buildSeededWeek(weekStart, SEEDED_WEEKS[key], history, weekIndex);
        gtQueue = deriveQueueFromHistory(history, 'gt');
        weekendQueue = deriveQueueFromHistory(history, 'weekend');
      } else {
        if (!gtQueue) gtQueue = deriveQueueFromHistory(history, 'gt');
        if (!weekendQueue) weekendQueue = deriveQueueFromHistory(history, 'weekend');
        weekResult = buildGeneratedWeek(weekStart, history, gtQueue, weekendQueue, weekIndex);
        gtQueue = weekResult.nextGtQueue.slice();
        weekendQueue = weekResult.nextWeekendQueue.slice();
      }

      if (weekIndex === totalWeeks) {
        targetWeek = weekResult;
      }
    }

    return targetWeek;
  }

  function isGroupStart(advisorId) {
    return TEAM_ORDER.some((group) => group[0] === advisorId) && advisorId !== TEAM_ORDER[0][0];
  }

  function renderWeek(sim) {
    const weekEnd = addDays(sim.weekStart, 6);
    weekRangePillEl.textContent = `${formatShortDate(sim.weekStart)} · ${formatShortDate(weekEnd)}`;

    const header = [
      '<div class="head-cell blank"></div>',
      ...sim.days.map((day) => `
        <div class="head-cell">
          <div class="day-name">${WEEKDAY_NAMES[day.date.getDay() === 0 ? 6 : day.date.getDay() - 1]}</div>
          <div class="day-date">${formatCompactDate(day.date)}</div>
        </div>
      `)
    ].join('');

    const rows = ADVISORS.map((advisor) => {
      const groupStartClass = isGroupStart(advisor.id) ? ' group-start' : '';
      const row = [
        `<div class="person-cell${groupStartClass}"><div class="person-name">${advisor.name}</div></div>`
      ];
      sim.days.forEach((day) => {
        const cell = day.cells[advisor.id];
        row.push(`
          <div class="shift-cell${groupStartClass}">
            <div class="shift-card ${cell.type}">
              <div class="title">${cell.title}</div>
              <div class="meta">${cell.meta || ''}</div>
            </div>
          </div>
        `);
      });
      return row.join('');
    }).join('');

    const totalsRow = [
      '<div class="count-cell label">Conteo</div>',
      ...sim.days.map((day) => {
        const counts = summarizeOfficeCounts(day.cells);
        return `
          <div class="count-cell">
            <div class="count-stack">
              <div class="count-line"><span>Manana</span><strong>${counts.morning}</strong></div>
              <div class="count-line"><span>Tarde</span><strong>${counts.afternoon}</strong></div>
              <div class="count-line"><span>11 a 4</span><strong>${counts.mid}</strong></div>
            </div>
          </div>
        `;
      })
    ].join('');

    boardEl.innerHTML = header + rows + totalsRow;
  }

  function renderCounters(sim) {
    countersGridEl.innerHTML = ADVISORS.map((advisor) => {
      const record = sim.history[advisor.id];
      return `
        <div class="mini-stat">
          <div class="k">${advisor.name}</div>
          <div class="v">GT: ${record.gt} · FDS: ${record.weekend}</div>
        </div>
      `;
    }).join('');
  }

  function rerender() {
    const monday = maxDate(startOfWeek(selectedMonday), parseIsoDate(BASE_MONDAY));
    selectedMonday = monday;
    const sim = buildWeekSimulation(monday);
    renderWeek(sim);
    renderCounters(sim);
  }

  prevWeekBtn.addEventListener('click', function () {
    const next = addDays(selectedMonday, -7);
    if (next.getTime() < parseIsoDate(BASE_MONDAY).getTime()) return;
    selectedMonday = next;
    rerender();
  });

  nextWeekBtn.addEventListener('click', function () {
    selectedMonday = addDays(selectedMonday, 7);
    rerender();
  });

  currentWeekBtn.addEventListener('click', function () {
    selectedMonday = maxDate(startOfWeek(new Date()), parseIsoDate(BASE_MONDAY));
    rerender();
  });

  rerender();
})();
</script>
