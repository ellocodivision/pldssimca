<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro Viceroy</title>
  <style>
    :root{
      --bg:#050505;
      --card:#121212;
      --line:#2f2f2f;
      --ink:#e9e9e9;
      --muted:#9aa09a;
      --brand:#8d9488;
      --accent:#8d9488;
      --accent-2:#a4ab9e;
      --ok:#1f8d3c;
      --err:#b42318;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Akkurat","Akkurat Pro","Akkurat Std",Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      display:grid;
      place-items:center;
      min-height:100vh;
      padding:16px;
    }
    .card{
      width:min(560px,100%);
      background:linear-gradient(180deg,#171717,#101010);
      border:1px solid var(--line);
      border-radius:16px;
      padding:20px;
      box-shadow:0 16px 60px rgba(0,0,0,.45);
    }
    h1{margin:0 0 8px;font-size:17px;letter-spacing:.12em}
    p{margin:0 0 12px;color:var(--muted)}
    label{display:block;font-size:12px;font-weight:700;margin:10px 0 6px}
    .input{
      width:100%;
      padding:11px 12px;
      border:1px solid #323232;
      border-radius:10px;
      background:#0b0b0b;
      color:#f2f2f2;
    }
    .btn{
      margin-top:14px;
      border:1px solid #727a6e;
      background:linear-gradient(180deg,var(--accent-2),var(--accent));
      color:#060606;
      border-radius:10px;
      padding:11px 14px;
      font-weight:800;
      cursor:pointer;
      width:100%;
    }
    .status{margin-top:10px;font-size:13px}
    .status.ok{color:var(--ok)}
    .status.err{color:var(--err)}
    .logo-wrap{
      text-align:center;
      margin-bottom:18px;
      color:var(--brand);
    }
    .logo-main{
      margin:0;
      font-size:56px;
      letter-spacing:.14em;
      font-weight:500;
      line-height:1;
    }
    .logo-sub{
      margin:8px 0 0;
      font-size:22px;
      letter-spacing:.35em;
      font-weight:500;
      line-height:1;
    }
    .logo-location{
      margin:22px 0 40px;
      font-size:17px;
      letter-spacing:.12em;
      font-family:"Akkurat","Akkurat Pro","Akkurat Std",Arial,sans-serif;
    }
    @media (max-width:640px){
      .logo-main{font-size:38px;letter-spacing:.1em}
      .logo-sub{font-size:17px;letter-spacing:.24em}
      .logo-location{font-size:14px}
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="logo-wrap">
      <p class="logo-main">VICEROY</p>
      <p class="logo-sub">RESIDENCES</p>
      <p class="logo-location">PLAYA DEL CARMEN</p>
    </header>
    <h1>REGISTRO</h1>
    <p>Completa los datos para registrar tu interés.</p>
    <form id="leadForm">
      <label for="nombreCliente">NOMBRE COMPLETO</label>
      <input id="nombreCliente" class="input" required />

      <label for="clientEmail">CORREO</label>
      <input id="clientEmail" class="input" type="email" />

      <label for="clientPhone">TELÉFONO</label>
      <input id="clientPhone" class="input" type="tel" />

      <button class="btn" type="submit">ENVIAR DATOS</button>
      <p id="status" class="status"></p>
    </form>
  </main>

  <script>
    (function () {
      const form = document.getElementById('leadForm');
      const status = document.getElementById('status');
      const token = new URLSearchParams(window.location.search).get('t') || '';

      function setStatus(text, kind) {
        status.textContent = text || '';
        status.className = 'status' + (kind ? ' ' + kind : '');
      }

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        if (!token) {
          setStatus('Link inválido o incompleto.', 'err');
          return;
        }
        const payload = {
          token: token,
          nombreCliente: document.getElementById('nombreCliente').value,
          clientEmail: document.getElementById('clientEmail').value,
          clientPhone: document.getElementById('clientPhone').value
        };
        setStatus('Enviando...', '');
        try {
          const res = await fetch('/api/lead/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'No se pudo enviar');
          form.reset();
          setStatus('Gracias, cliente registrado correctamente.', 'ok');
        } catch (err) {
          setStatus(err.message || 'No se pudo registrar el cliente', 'err');
        }
      });
    })();
  </script>
</body>
</html>
