<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla de pago Viceroy</title>
  <style>
    :root {
      --bg: #f6f2e9;
      --paper: #fffdf9;
      --olive: #9b9b8b;
      --olive-deep: #878775;
      --olive-soft: #f2eee3;
      --ink: #373732;
      --muted: #747468;
      --line: #d6d0c2;
      --line-strong: #bcb4a1;
      --shadow: 0 28px 64px rgba(82, 72, 49, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #faf8f2 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back,
    .lang-btn,
    .print-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.88);
      color: #272722;
    }

    .lang-btn {
      gap: 8px;
    }

    .print-btn {
      border-color: var(--olive-deep);
      background: var(--olive);
      color: #fff;
    }

    .sheet {
      background: var(--paper);
      border: 1px solid rgba(187, 180, 162, 0.9);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      background: var(--olive);
      color: #f7f3ea;
      padding: 32px 28px 24px;
      text-align: center;
    }

    .brand {
      margin: 0;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      line-height: 1.05;
      font-size: 22px;
      font-weight: 700;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .location {
      margin: 8px 0 0;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    .headline {
      margin: 12px 0 0;
      font-size: 18px;
      font-style: italic;
      font-weight: 400;
    }

    .content {
      padding: 22px 24px 28px;
      display: grid;
      gap: 18px;
    }

    .form-section {
      border-bottom: 1px solid rgba(155, 155, 139, 0.35);
      padding-bottom: 18px;
    }

    .section-title {
      margin: 0 0 12px;
      color: #59584f;
      font-size: 18px;
      font-style: italic;
      font-weight: 400;
    }

    .capture-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .capture-grid.discount-on {
      grid-template-columns: 1fr 1.2fr 1fr 0.8fr 1fr;
    }

    .field,
    .field-toggle {
      display: grid;
      gap: 6px;
    }

    label {
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b6a61;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      padding: 0 12px;
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--olive-deep);
      box-shadow: inset 0 0 0 1px var(--olive-deep);
    }

    input[readonly] {
      background: #faf8f1;
      color: #5a584f;
    }

    .toggle-card {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #44433e;
    }

    .toggle-card input {
      width: 14px;
      height: 14px;
      min-height: 14px;
      margin: 0;
      accent-color: var(--olive-deep);
    }

    .discount-fields[hidden] {
      display: none !important;
    }

    .summary-shell,
    .payments-shell {
      border: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
    }

    .summary-shell {
      border-top: 2px solid var(--olive);
    }

    .summary-table,
    .payments-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .summary-table thead th {
      padding: 12px 8px 10px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: #666459;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .summary-table tbody td {
      padding: 16px 8px 18px;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #2d2c28;
      text-align: center;
    }

    .summary-table tbody td.amount {
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    .is-hidden {
      display: none;
    }

    .payments-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-top: 2px solid var(--olive);
      border-bottom: 1px solid var(--line);
    }

    .payments-head h2 {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #2e2d28;
    }

    .payments-table thead th {
      padding: 9px 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: #69675e;
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .payments-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #ebe4d5;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #34332f;
    }

    .payments-table tbody tr.highlight td {
      background: #f8f4ea;
    }

    .payments-table td.number,
    .payments-table td.percent,
    .payments-table td.amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .payments-table tfoot td {
      padding: 13px 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-bottom: none;
    }

    .logos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--line-strong);
      color: var(--olive);
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      font-size: 16px;
    }

    .logos div:nth-child(2) {
      text-align: center;
    }

    .logos div:last-child {
      text-align: right;
    }

    @media (max-width: 900px) {
      .capture-grid,
      .capture-grid.discount-on {
        grid-template-columns: 1fr;
      }

      .summary-shell,
      .payments-shell {
        overflow-x: auto;
      }

      .summary-table,
      .payments-table {
        min-width: 760px;
      }

      .logos {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .logos div:last-child,
      .logos div:nth-child(2) {
        text-align: center;
      }
    }

    @media print {
      @page {
        size: landscape;
        margin: 6mm;
      }

      body {
        background: #fff;
      }

      .topbar,
      .form-section,
      .logos {
        display: none !important;
      }

      .page {
        max-width: none;
        padding: 0;
      }

      .sheet {
        border: none;
        box-shadow: none;
      }

      .hero {
        padding: 18px 18px 14px;
      }

      .brand {
        font-size: 18px;
      }

      .brand small {
        font-size: 11px;
      }

      .location {
        font-size: 19px;
      }

      .headline {
        margin-top: 8px;
        font-size: 15px;
      }

      .content {
        padding: 10px 14px 14px;
        gap: 10px;
      }

      .summary-table thead th,
      .payments-table thead th {
        padding: 6px 8px;
        font-size: 9px;
      }

      .summary-table tbody td {
        padding: 8px 8px 10px;
        font-size: 16px;
      }

      .summary-table tbody td.amount,
      .payments-table td,
      .payments-table tfoot td {
        font-size: 11px;
      }

      .payments-head {
        padding: 8px 10px 6px;
        border-top-width: 1px;
      }

      .summary-shell {
        border-top-width: 1px;
      }

      .payments-head h2 {
        font-size: 15px;
      }

      .payments-table td {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="/viceroy" id="backBtn">Regresar a Viceroy</a>
      <div class="topbar-actions">
        <button class="lang-btn" type="button" id="langBtn"><span>🇺🇸</span><span id="langBtnText">English</span></button>
        <button class="print-btn" type="button" id="printBtn">Imprimir / Guardar PDF</button>
      </div>
    </div>

    <section class="sheet">
      <header class="hero">
        <h1 class="brand">Viceroy <small>Residences</small></h1>
        <p class="location">Playa del Carmen</p>
        <p class="headline" id="headline">Tabla de pago Viceroy</p>
      </header>

      <div class="content">
        <section class="form-section">
          <h2 class="section-title" id="sectionTitle">Formas de Pago:</h2>

          <div class="capture-grid" id="captureGrid">
            <div class="field">
              <label for="unitName" id="labelUnit">Unidad</label>
              <input id="unitName" type="text" value="402">
            </div>
            <div class="field">
              <label for="paymentPlan" id="labelPlan">Forma de pago</label>
              <select id="paymentPlan">
                <option value="0|30|10|10|10|40">30 / 10 / 10 / 10 / 40</option>
                <option value="3|50|10|10|10|20">50 / 10 / 10 / 10 / 20</option>
                <option value="5|70|10|5|5|10">70 / 10 / 5 / 5 / 10</option>
                <option value="7|90|0|5|0|5">90 / 0 / 5 / 0 / 5</option>
              </select>
            </div>
            <div class="field">
              <label for="listPrice" id="labelListPrice">Precio de lista</label>
              <input id="listPrice" type="text" inputmode="decimal" value="0">
            </div>
            <div class="field-toggle discount-fields" id="discountToggleWrap">
              <label id="labelApplyDiscount">Descuento</label>
              <label class="toggle-card" for="applyDiscount">
                <input id="applyDiscount" type="checkbox">
                <span id="applyDiscountText">Aplica descuento</span>
              </label>
            </div>
            <div class="field discount-fields" id="discountFieldWrap" hidden>
              <label for="discount" id="labelDiscount">Descuento (%)</label>
              <input id="discount" type="text" inputmode="decimal" value="0" readonly>
            </div>
            <div class="field discount-fields" id="promoFieldWrap" hidden>
              <label for="promoPrice" id="labelPromoPrice">Precio promo</label>
              <input id="promoPrice" type="text" inputmode="decimal" value="0" readonly>
            </div>
          </div>
        </section>

        <section class="summary-shell">
          <table class="summary-table">
            <thead>
              <tr>
                <th id="summaryHeadUnit">Unidad</th>
                <th id="summaryHeadPlan">Forma de pago</th>
                <th id="summaryHeadList">Precio lista</th>
                <th class="discount-col" id="summaryHeadDiscount">Descuento</th>
                <th class="discount-col" id="summaryHeadPromo">Precio promo</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="snapshotUnit">402</td>
                <td id="snapshotPlan">30/10/10/10/40</td>
                <td class="amount" id="snapshotListPrice">$0</td>
                <td class="amount discount-col" id="snapshotDiscount">$0</td>
                <td class="amount discount-col" id="snapshotPromoPrice">$0</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section class="payments-shell">
          <div class="payments-head">
            <h2 id="paymentsTitle">Desglose de pagos</h2>
          </div>
          <table class="payments-table">
            <thead>
              <tr>
                <th id="headStage">Etapa</th>
                <th id="headConcept">Concepto</th>
                <th id="headReference">Referencia</th>
                <th id="headPercent">Porcentaje</th>
                <th id="headAmount">Monto</th>
              </tr>
            </thead>
            <tbody id="paymentRows"></tbody>
            <tfoot>
              <tr>
                <td colspan="3" id="footerLabel">Totales</td>
                <td class="percent" id="footerPercent">100%</td>
                <td class="amount" id="footerAmount">$0</td>
              </tr>
            </tfoot>
          </table>
        </section>

        <section class="logos" aria-hidden="true">
          <div>Santa Fe</div>
          <div>Related</div>
          <div>SIMCA</div>
        </section>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const currency = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 2
      });

      const percentFormat = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

      const plans = [
        { key: '0|30|10|10|10|40', discount: 0, schedule: [30, 10, 10, 10, 40], shortLabel: '30/10/10/10/40' },
        { key: '3|50|10|10|10|20', discount: 3, schedule: [50, 10, 10, 10, 20], shortLabel: '50/10/10/10/20' },
        { key: '5|70|10|5|5|10', discount: 5, schedule: [70, 10, 5, 5, 10], shortLabel: '70/10/5/5/10' },
        { key: '7|90|0|5|0|5', discount: 7, schedule: [90, 0, 5, 0, 5], shortLabel: '90/0/5/0/5' }
      ];

      const translations = {
        es: {
          back: 'Regresar a Viceroy',
          lang: 'English',
          langFlag: '🇺🇸',
          print: 'Imprimir / Guardar PDF',
          headline: 'Tabla de pago Viceroy',
          section: 'Formas de Pago:',
          unit: 'Unidad',
          paymentPlan: 'Forma de pago',
          listPrice: 'Precio de lista',
          discountToggle: 'Descuento',
          applyDiscount: 'Aplica descuento',
          discount: 'Descuento (%)',
          promoPrice: 'Precio promo',
          summaryUnit: 'Unidad',
          summaryPlan: 'Forma de pago',
          summaryList: 'Precio lista',
          summaryDiscount: 'Descuento',
          summaryPromo: 'Precio promo',
          paymentsTitle: 'Desglose de pagos',
          stage: 'Etapa',
          concept: 'Concepto',
          reference: 'Referencia',
          percent: 'Porcentaje',
          amount: 'Monto',
          totals: 'Totales',
          rowConcepts: ['Enganche', 'Pago programado', 'Balance contra entrega'],
          refs: ['Enganche', 'Mes 8', 'Mes 16', 'Mes 24', 'Mes 30']
        },
        en: {
          back: 'Back to Viceroy',
          lang: 'Español',
          langFlag: '🇲🇽',
          print: 'Print / Save PDF',
          headline: 'Viceroy Payment Plan',
          section: 'Payment Structures:',
          unit: 'Unit',
          paymentPlan: 'Payment plan',
          listPrice: 'List price',
          discountToggle: 'Discount',
          applyDiscount: 'Apply discount',
          discount: 'Discount (%)',
          promoPrice: 'Promo price',
          summaryUnit: 'Unit',
          summaryPlan: 'Payment plan',
          summaryList: 'List price',
          summaryDiscount: 'Discount',
          summaryPromo: 'Promo price',
          paymentsTitle: 'Payment breakdown',
          stage: 'Stage',
          concept: 'Concept',
          reference: 'Reference',
          percent: 'Percent',
          amount: 'Amount',
          totals: 'Totals',
          rowConcepts: ['Down payment', 'Scheduled payment', 'Balance at delivery'],
          refs: ['Down payment', 'Month 8', 'Month 16', 'Month 24', 'Month 30']
        }
      };

      const els = {
        backBtn: document.getElementById('backBtn'),
        langBtn: document.getElementById('langBtn'),
        langBtnText: document.getElementById('langBtnText'),
        printBtn: document.getElementById('printBtn'),
        headline: document.getElementById('headline'),
        sectionTitle: document.getElementById('sectionTitle'),
        labelUnit: document.getElementById('labelUnit'),
        labelPlan: document.getElementById('labelPlan'),
        labelListPrice: document.getElementById('labelListPrice'),
        labelApplyDiscount: document.getElementById('labelApplyDiscount'),
        applyDiscountText: document.getElementById('applyDiscountText'),
        labelDiscount: document.getElementById('labelDiscount'),
        labelPromoPrice: document.getElementById('labelPromoPrice'),
        summaryHeadUnit: document.getElementById('summaryHeadUnit'),
        summaryHeadPlan: document.getElementById('summaryHeadPlan'),
        summaryHeadList: document.getElementById('summaryHeadList'),
        summaryHeadDiscount: document.getElementById('summaryHeadDiscount'),
        summaryHeadPromo: document.getElementById('summaryHeadPromo'),
        paymentsTitle: document.getElementById('paymentsTitle'),
        headStage: document.getElementById('headStage'),
        headConcept: document.getElementById('headConcept'),
        headReference: document.getElementById('headReference'),
        headPercent: document.getElementById('headPercent'),
        headAmount: document.getElementById('headAmount'),
        footerLabel: document.getElementById('footerLabel'),
        captureGrid: document.getElementById('captureGrid'),
        unitName: document.getElementById('unitName'),
        paymentPlan: document.getElementById('paymentPlan'),
        listPrice: document.getElementById('listPrice'),
        applyDiscount: document.getElementById('applyDiscount'),
        discountFieldWrap: document.getElementById('discountFieldWrap'),
        promoFieldWrap: document.getElementById('promoFieldWrap'),
        discount: document.getElementById('discount'),
        promoPrice: document.getElementById('promoPrice'),
        commercialRows: document.getElementById('commercialRows'),
        snapshotUnit: document.getElementById('snapshotUnit'),
        snapshotPlan: document.getElementById('snapshotPlan'),
        snapshotListPrice: document.getElementById('snapshotListPrice'),
        snapshotDiscount: document.getElementById('snapshotDiscount'),
        snapshotPromoPrice: document.getElementById('snapshotPromoPrice'),
        paymentRows: document.getElementById('paymentRows'),
        footerPercent: document.getElementById('footerPercent'),
        footerAmount: document.getElementById('footerAmount')
      };

      let currentLang = 'es';

      function sanitizeNumber(value) {
        const cleaned = String(value || '').replace(/[^\d.,-]/g, '').replace(/,/g, '');
        const parsed = Number(cleaned);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatCurrency(value) {
        return currency.format(Number(value || 0));
      }

      function formatPercent(value) {
        return percentFormat.format(Number(value || 0)) + '%';
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function findPlan(key) {
        return plans.find(function (plan) {
          return plan.key === key;
        }) || plans[0];
      }

      function updateLanguage() {
        const t = translations[currentLang];
        els.backBtn.textContent = t.back;
        els.langBtn.querySelector('span').textContent = t.langFlag;
        els.langBtnText.textContent = t.lang;
        els.printBtn.textContent = t.print;
        els.headline.textContent = t.headline;
        els.sectionTitle.textContent = t.section;
        els.labelUnit.textContent = t.unit;
        els.labelPlan.textContent = t.paymentPlan;
        els.labelListPrice.textContent = t.listPrice;
        els.labelApplyDiscount.textContent = t.discountToggle;
        els.applyDiscountText.textContent = t.applyDiscount;
        els.labelDiscount.textContent = t.discount;
        els.labelPromoPrice.textContent = t.promoPrice;
        els.summaryHeadUnit.textContent = t.summaryUnit;
        els.summaryHeadPlan.textContent = t.summaryPlan;
        els.summaryHeadList.textContent = t.summaryList;
        els.summaryHeadDiscount.textContent = t.summaryDiscount;
        els.summaryHeadPromo.textContent = t.summaryPromo;
        els.paymentsTitle.textContent = t.paymentsTitle;
        els.headStage.textContent = t.stage;
        els.headConcept.textContent = t.concept;
        els.headReference.textContent = t.reference;
        els.headPercent.textContent = t.percent;
        els.headAmount.textContent = t.amount;
        els.footerLabel.textContent = t.totals;
      }

      function syncDiscountVisibility() {
        const showDiscount = els.applyDiscount.checked;
        els.discountFieldWrap.hidden = !showDiscount;
        els.promoFieldWrap.hidden = !showDiscount;
        els.captureGrid.classList.toggle('discount-on', showDiscount);
        document.querySelectorAll('.discount-col').forEach(function (node) {
          node.classList.toggle('is-hidden', !showDiscount);
        });
      }

      function getPaymentRows(schedule, finalPrice) {
        const t = translations[currentLang];
        return schedule.map(function (part, index) {
          const isFirst = index === 0;
          const isLast = index === schedule.length - 1;
          return {
            stage: index + 1,
            concept: isFirst ? t.rowConcepts[0] : (isLast ? t.rowConcepts[2] : t.rowConcepts[1]),
            reference: t.refs[index],
            percent: part,
            amount: finalPrice * (part / 100),
            highlight: isLast
          };
        });
      }

      function update() {
        const plan = findPlan(els.paymentPlan.value);
        const listPrice = Math.max(0, sanitizeNumber(els.listPrice.value));
        const unitName = els.unitName.value.trim();
        const showDiscount = els.applyDiscount.checked;
        const discountPercent = showDiscount ? plan.discount : 0;
        const promoPrice = Math.max(0, listPrice - (listPrice * discountPercent / 100));
        const discountAmount = Math.max(0, listPrice - promoPrice);
        const rows = getPaymentRows(plan.schedule, promoPrice);
        const percentTotal = plan.schedule.reduce(function (sum, item) { return sum + item; }, 0);
        const amountTotal = rows.reduce(function (sum, row) { return sum + row.amount; }, 0);

        els.discount.value = percentFormat.format(discountPercent);
        els.promoPrice.value = String(Math.round(promoPrice * 100) / 100);

        els.snapshotUnit.textContent = unitName || '-';
        els.snapshotPlan.textContent = plan.shortLabel;
        els.snapshotListPrice.textContent = formatCurrency(listPrice);
        els.snapshotDiscount.textContent = formatCurrency(discountAmount) + ' (' + formatPercent(discountPercent) + ')';
        els.snapshotPromoPrice.textContent = formatCurrency(promoPrice);

        els.paymentRows.innerHTML = rows.map(function (row) {
          return [
            '<tr' + (row.highlight ? ' class="highlight"' : '') + '>',
            '<td class="number">' + row.stage + '</td>',
            '<td>' + escapeHtml(row.concept) + '</td>',
            '<td>' + escapeHtml(row.reference) + '</td>',
            '<td class="percent">' + formatPercent(row.percent) + '</td>',
            '<td class="amount">' + formatCurrency(row.amount) + '</td>',
            '</tr>'
          ].join('');
        }).join('');

        els.footerPercent.textContent = formatPercent(percentTotal);
        els.footerAmount.textContent = formatCurrency(amountTotal);
      }

      els.langBtn.addEventListener('click', function () {
        currentLang = currentLang === 'es' ? 'en' : 'es';
        updateLanguage();
        update();
      });

      els.paymentPlan.addEventListener('change', update);
      els.unitName.addEventListener('input', update);
      els.listPrice.addEventListener('input', update);
      els.applyDiscount.addEventListener('change', function () {
        syncDiscountVisibility();
        update();
      });

      els.printBtn.addEventListener('click', function () {
        window.print();
      });

      updateLanguage();
      syncDiscountVisibility();
      update();
    })();
  </script>
</body>
</html>
