<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla de pago Viceroy</title>
  <style>
    :root {
      --bg: #f6f2e9;
      --paper: #fffdf9;
      --olive: #9b9b8b;
      --olive-deep: #878775;
      --ink: #373732;
      --muted: #747468;
      --line: #d6d0c2;
      --line-strong: #bcb4a1;
      --shadow: 0 28px 64px rgba(82, 72, 49, 0.08);
      --print-scale: 0.92;
      --print-margin-mm: 6;
      --hero-padding-top: 18px;
      --hero-padding-sides: 18px;
      --hero-padding-bottom: 14px;
      --content-padding-top: 10px;
      --content-padding-sides: 14px;
      --content-padding-bottom: 14px;
      --content-gap: 10px;
      --headline-size: 15px;
      --summary-header-size: 9px;
      --summary-value-size: 16px;
      --payments-title-size: 15px;
      --payments-header-size: 9px;
      --payments-body-size: 11px;
      --summary-row-padding-y: 8px;
      --payment-row-padding-y: 6px;
      --olive-line-color: #9b9b8b;
      --olive-line-width: 1px;
      --shell-border-color: #d6d0c2;
      --shell-border-width: 1px;
      --payments-col-stage: 10%;
      --payments-col-concept: 22%;
      --payments-col-reference: 22%;
      --payments-col-percent: 18%;
      --payments-col-amount: 18%;
      --payments-align-stage: right;
      --payments-align-concept: left;
      --payments-align-reference: left;
      --payments-align-percent: right;
      --payments-align-amount: right;
      --summary-col-unit: 14%;
      --summary-col-plan: 26%;
      --summary-col-list: 20%;
      --summary-col-discount: 20%;
      --summary-col-promo: 20%;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #faf8f2 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body.preview-mode {
      background: #fff;
    }

    body.print-preview-mode {
      background: #d8d8dd;
      padding: 20px 0;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 36px;
    }

    body.preview-mode .page {
      max-width: 1120px;
      padding: 0;
    }

    body.print-preview-mode .page {
      width: min(816px, calc(100vw - 40px));
      max-width: none;
      padding: 0;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back,
    .lang-btn,
    .print-btn,
    .editor-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.88);
      color: #272722;
    }

    .lang-btn {
      gap: 8px;
    }

    .print-btn {
      border-color: var(--olive-deep);
      background: var(--olive);
      color: #fff;
    }

    .sheet {
      background: var(--paper);
      border: 1px solid rgba(187, 180, 162, 0.9);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    body.preview-mode .sheet {
      border: none;
      box-shadow: none;
    }

    body.print-preview-mode .sheet {
      border: none;
      box-shadow: 0 0 0 1px rgba(145, 145, 145, 0.35);
      min-height: 1056px;
      background: #fff;
    }

    .hero {
      background: var(--olive);
      color: #f7f3ea;
      padding: 32px 28px 24px;
      text-align: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .brand {
      margin: 0;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      line-height: 1.05;
      font-size: 22px;
      font-weight: 700;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .location {
      margin: 8px 0 0;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    .headline {
      margin: 12px 0 0;
      font-size: 18px;
      font-style: italic;
      font-weight: 400;
    }

    .content {
      padding: 22px 24px 28px;
      display: grid;
      gap: 18px;
    }

    .form-section {
      border-bottom: 1px solid rgba(155, 155, 139, 0.35);
      padding-bottom: 18px;
    }

    .section-title {
      margin: 0 0 12px;
      color: #59584f;
      font-size: 18px;
      font-style: italic;
      font-weight: 400;
    }

    .capture-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .capture-grid.discount-on {
      grid-template-columns: 1fr 1.2fr 1fr 0.85fr 1fr 1fr;
    }

    .field,
    .field-toggle {
      display: grid;
      gap: 6px;
    }

    label {
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b6a61;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      padding: 0 12px;
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--olive-deep);
      box-shadow: inset 0 0 0 1px var(--olive-deep);
    }

    input[readonly] {
      background: #faf8f1;
      color: #5a584f;
    }

    .toggle-card {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #44433e;
      max-width: 180px;
      white-space: nowrap;
    }

    .toggle-card input {
      width: 14px;
      height: 14px;
      min-height: 14px;
      margin: 0;
      accent-color: var(--olive-deep);
    }

    .discount-fields[hidden] {
      display: none !important;
    }

    .summary-shell,
    .payments-shell {
      border: 1px solid var(--shell-border-color);
      border-width: var(--shell-border-width);
      background: #fff;
      overflow: hidden;
    }

    .summary-shell {
      border-top: var(--olive-line-width) solid var(--olive-line-color);
    }

    .summary-table,
    .payments-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .summary-table thead th {
      padding: 12px 8px 10px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: #666459;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .summary-table tbody td {
      padding: 16px 8px 18px;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #2d2c28;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .summary-table tbody td.amount {
      font-size: 24px;
    }

    .summary-table col.col-unit { width: var(--summary-col-unit); }
    .summary-table col.col-plan { width: var(--summary-col-plan); }
    .summary-table col.col-list { width: var(--summary-col-list); }
    .summary-table col.col-discount { width: var(--summary-col-discount); }
    .summary-table col.col-promo { width: var(--summary-col-promo); }

    .summary-shell.no-discount .summary-table col.col-unit { width: 25%; }
    .summary-shell.no-discount .summary-table col.col-plan { width: 50%; }
    .summary-shell.no-discount .summary-table col.col-list { width: 25%; }

    .is-hidden {
      display: none;
    }

    .payments-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-top: var(--olive-line-width) solid var(--olive-line-color);
      border-bottom: 1px solid var(--line);
    }

    .payments-head h2 {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #2e2d28;
    }

    .payments-table thead th {
      padding: 9px 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: #69675e;
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .payments-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #ebe4d5;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #34332f;
    }

    .payments-table col.col-stage { width: var(--payments-col-stage); }
    .payments-table col.col-concept { width: var(--payments-col-concept); }
    .payments-table col.col-reference { width: var(--payments-col-reference); }
    .payments-table col.col-percent { width: var(--payments-col-percent); }
    .payments-table col.col-amount { width: var(--payments-col-amount); }

    .payments-table thead th.col-stage,
    .payments-table tbody td.col-stage {
      text-align: var(--payments-align-stage);
    }

    .payments-table thead th.col-concept,
    .payments-table tbody td.col-concept {
      text-align: var(--payments-align-concept);
    }

    .payments-table thead th.col-reference,
    .payments-table tbody td.col-reference {
      text-align: var(--payments-align-reference);
    }

    .payments-table thead th.col-percent,
    .payments-table tbody td.col-percent {
      text-align: var(--payments-align-percent);
    }

    .payments-table thead th.col-amount,
    .payments-table tbody td.col-amount {
      text-align: var(--payments-align-amount);
    }

    .payments-table tbody tr.highlight td {
      background: #f8f4ea;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .payments-table td.number,
    .payments-table td.percent,
    .payments-table td.amount {
      font-variant-numeric: tabular-nums;
    }

    .payments-table tfoot td {
      padding: 13px 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-bottom: none;
    }

    .logos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--line-strong);
      color: var(--olive);
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      font-size: 16px;
    }

    .logos div:nth-child(2) {
      text-align: center;
    }

    .logos div:last-child {
      text-align: right;
    }

    body.preview-mode .topbar,
    body.preview-mode .logos,
    body.print-preview-mode .topbar,
    body.print-preview-mode .form-section,
    body.print-preview-mode .logos {
      display: none !important;
    }

    body.preview-mode .hero,
    body.print-preview-mode .hero {
      padding: var(--hero-padding-top) var(--hero-padding-sides) var(--hero-padding-bottom);
    }

    body.preview-mode .headline,
    body.print-preview-mode .headline {
      margin-top: 8px;
      font-size: var(--headline-size);
    }

    body.preview-mode .content,
    body.print-preview-mode .content {
      padding: var(--content-padding-top) var(--content-padding-sides) var(--content-padding-bottom);
      gap: var(--content-gap);
    }

    body.preview-mode .summary-shell.is-hidden,
    body.preview-mode .payments-shell.is-hidden,
    body.print-preview-mode .summary-shell.is-hidden,
    body.print-preview-mode .payments-shell.is-hidden {
      display: none !important;
    }

    body.preview-mode.hide-hero .hero,
    body.preview-mode.hide-logos .logos,
    body.print-preview-mode.hide-hero .hero,
    body.print-preview-mode.hide-logos .logos {
      display: none !important;
    }

    body.preview-mode .summary-table thead th,
    body.print-preview-mode .summary-table thead th {
      font-size: var(--summary-header-size);
      padding: 6px 8px;
    }

    body.preview-mode .summary-table tbody td,
    body.print-preview-mode .summary-table tbody td {
      padding: var(--summary-row-padding-y) 8px calc(var(--summary-row-padding-y) + 2px);
      font-size: var(--summary-value-size);
    }

    body.preview-mode .summary-table tbody td.amount,
    body.print-preview-mode .summary-table tbody td.amount {
      font-size: var(--summary-value-size);
    }

    body.preview-mode .payments-head,
    body.print-preview-mode .payments-head {
      padding: 8px 10px 6px;
    }

    body.preview-mode .payments-head h2,
    body.print-preview-mode .payments-head h2 {
      font-size: var(--payments-title-size);
    }

    body.preview-mode .payments-table thead th,
    body.print-preview-mode .payments-table thead th {
      padding: 6px 8px;
      font-size: var(--payments-header-size);
    }

    body.preview-mode .payments-table td,
    body.preview-mode .payments-table tfoot td,
    body.print-preview-mode .payments-table td,
    body.print-preview-mode .payments-table tfoot td {
      padding: var(--payment-row-padding-y) 8px;
      font-size: var(--payments-body-size);
    }

    @media (max-width: 900px) {
      .capture-grid,
      .capture-grid.discount-on {
        grid-template-columns: 1fr;
      }

      .summary-shell,
      .payments-shell {
        overflow-x: auto;
      }

      .summary-table,
      .payments-table {
        min-width: 760px;
      }

      .logos {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .logos div:last-child,
      .logos div:nth-child(2) {
        text-align: center;
      }
    }

    @media print {
      @page {
        size: portrait;
        margin: calc(var(--print-margin-mm) * 1mm);
      }

      body {
        background: #fff;
      }

      .topbar,
      .form-section,
      .logos {
        display: none !important;
      }

      html,
      body {
        width: 100%;
      }

      .page {
        max-width: none;
        padding: 0;
        transform: scale(var(--print-scale));
        transform-origin: top left;
        width: calc(100% / var(--print-scale));
      }

      .sheet {
        border: none;
        box-shadow: none;
      }

      body.hide-hero-print .hero,
      body.hide-logos-print .logos,
      body.hide-summary-print .summary-shell,
      body.hide-payments-print .payments-shell {
        display: none !important;
      }

      .hero {
        padding: var(--hero-padding-top) var(--hero-padding-sides) var(--hero-padding-bottom);
      }

      .brand {
        font-size: 18px;
      }

      .brand small {
        font-size: 11px;
      }

      .location {
        font-size: 19px;
      }

      .headline {
        margin-top: 8px;
        font-size: var(--headline-size);
      }

      .content {
        padding: var(--content-padding-top) var(--content-padding-sides) var(--content-padding-bottom);
        gap: var(--content-gap);
      }

      .summary-table thead th {
        padding: 6px 8px;
        font-size: var(--summary-header-size);
      }

      .summary-table tbody td {
        padding: var(--summary-row-padding-y) 8px calc(var(--summary-row-padding-y) + 2px);
        font-size: var(--summary-value-size);
      }

      .summary-table tbody td.amount {
        font-size: var(--summary-value-size);
      }

      .payments-head {
        padding: 8px 10px 6px;
      }

      .payments-head h2 {
        font-size: var(--payments-title-size);
      }

      .payments-table thead th {
        padding: 6px 8px;
        font-size: var(--payments-header-size);
      }

      .payments-table td,
      .payments-table tfoot td {
        padding: var(--payment-row-padding-y) 8px;
        font-size: var(--payments-body-size);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="/viceroy" id="backBtn">Regresar a Viceroy</a>
      <div class="topbar-actions">
        <a class="editor-btn" href="/viceroy/tabla-pagos/editor" id="editorBtn">Editor PDF</a>
        <button class="lang-btn" type="button" id="langBtn"><span>🇺🇸</span><span id="langBtnText">English</span></button>
        <button class="print-btn" type="button" id="printBtn">Imprimir / Guardar PDF</button>
      </div>
    </div>

    <section class="sheet">
      <header class="hero">
        <h1 class="brand">Viceroy <small>Residences</small></h1>
        <p class="location">Playa del Carmen</p>
        <p class="headline" id="headline">Tabla de pago Viceroy</p>
      </header>

      <div class="content">
        <section class="form-section">
          <h2 class="section-title" id="sectionTitle">Formas de Pago:</h2>

          <div class="capture-grid" id="captureGrid">
            <div class="field">
              <label for="unitName" id="labelUnit">Unidad</label>
              <input id="unitName" type="text" value="402">
            </div>
            <div class="field">
              <label for="paymentPlan" id="labelPlan">Forma de pago</label>
              <select id="paymentPlan">
                <option value="0|30|10|10|10|40">30 / 10 / 10 / 10 / 40</option>
                <option value="3|50|10|10|10|20">50 / 10 / 10 / 10 / 20</option>
                <option value="5|70|10|5|5|10">70 / 10 / 5 / 5 / 10</option>
                <option value="7|90|0|5|0|5">90 / 0 / 5 / 0 / 5</option>
              </select>
            </div>
            <div class="field">
              <label for="listPrice" id="labelListPrice">Precio de lista</label>
              <input id="listPrice" type="text" inputmode="decimal" value="0">
            </div>
            <div class="field-toggle discount-fields" id="discountToggleWrap">
              <label id="labelApplyDiscount">Descuento</label>
              <label class="toggle-card" for="applyDiscount">
                <input id="applyDiscount" type="checkbox">
                <span id="applyDiscountText">Aplica descuento</span>
              </label>
            </div>
            <div class="field discount-fields" id="discountFieldWrap" hidden>
              <label for="discount" id="labelDiscount">Descuento (%)</label>
              <input id="discount" type="text" inputmode="decimal" value="0" readonly>
            </div>
            <div class="field discount-fields" id="promoFieldWrap" hidden>
              <label for="promoPrice" id="labelPromoPrice">Precio promo</label>
              <input id="promoPrice" type="text" inputmode="decimal" value="0" readonly>
            </div>
          </div>
        </section>

        <section class="summary-shell" id="summaryShell">
          <table class="summary-table">
            <colgroup>
              <col class="col-unit">
              <col class="col-plan">
              <col class="col-list">
              <col class="col-discount discount-col">
              <col class="col-promo discount-col">
            </colgroup>
            <thead>
              <tr>
                <th id="summaryHeadUnit">Unidad</th>
                <th id="summaryHeadPlan">Forma de pago</th>
                <th id="summaryHeadList">Precio lista</th>
                <th class="discount-col" id="summaryHeadDiscount">Descuento</th>
                <th class="discount-col" id="summaryHeadPromo">Precio promo</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="snapshotUnit">402</td>
                <td id="snapshotPlan">30/10/10/10/40</td>
                <td class="amount" id="snapshotListPrice">$0</td>
                <td class="amount discount-col" id="snapshotDiscount">$0</td>
                <td class="amount discount-col" id="snapshotPromoPrice">$0</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section class="payments-shell" id="paymentsShell">
          <div class="payments-head">
            <h2 id="paymentsTitle">Desglose de pagos</h2>
          </div>
          <table class="payments-table">
            <colgroup>
              <col class="col-stage">
              <col class="col-concept">
              <col class="col-reference">
              <col class="col-percent">
              <col class="col-amount">
            </colgroup>
            <thead>
              <tr>
                <th class="col-stage" id="headStage">Etapa</th>
                <th class="col-concept" id="headConcept">Concepto</th>
                <th class="col-reference" id="headReference">Referencia</th>
                <th class="col-percent" id="headPercent">Porcentaje</th>
                <th class="col-amount" id="headAmount">Monto</th>
              </tr>
            </thead>
            <tbody id="paymentRows"></tbody>
            <tfoot>
              <tr>
                <td colspan="3" id="footerLabel">Totales</td>
                <td class="percent" id="footerPercent">100%</td>
                <td class="amount" id="footerAmount">$0</td>
              </tr>
            </tfoot>
          </table>
        </section>

        <section class="logos" aria-hidden="true" id="logosBlock">
          <div>Santa Fe</div>
          <div>Related</div>
          <div>SIMCA</div>
        </section>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const query = new URLSearchParams(window.location.search || '');
      const previewQuery = String(query.get('editorPreview') || '').trim();
      const isPreviewMode = previewQuery === '1' || previewQuery === 'print';
      const isPrintPreviewMode = previewQuery === 'print';
      const initialLang = query.get('lang') === 'en' ? 'en' : 'es';
      const currency = new Intl.NumberFormat('en-US', {
        style: 'currency',

      const defaultLayout = {

      };

        { key: '3|50|10|10|10|20', discount: 3, schedule: [50, 10, 10, 10, 20], shortLabel: '50/10/10/10/20' },
        { key: '5|70|10|5|5|10', discount: 5, schedule: [70, 10, 5, 5, 10], shortLabel: '70/10/5/5/10' },
        { key: '7|90|0|5|0|5', discount: 7, schedule: [90, 0, 5, 0, 5], shortLabel: '90/0/5/0/5' }
      ];

      const translations = {
        es: {
          back: 'Regresar a Viceroy',
          editor: 'Editor PDF',
          lang: 'English',
          langFlag: '🇺🇸',
          print: 'Imprimir / Guardar PDF',
          headline: 'Tabla de pago Viceroy',

      const els = {

      let currentLang = initialLang;
      let currentLayout = normalizeLayout(defaultLayout);

      function sanitizeNumber(value) {
        const cleaned = String(value || '').replace(/[^\d.,-]/g, '').replace(/,/g, '');
        const parsed = Number(cleaned);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function normalizeLayout(input) {
        const src = input && typeof input === 'object' ? input : {};
        const out = Object.assign({}, defaultLayout, src);
        out.printScale = clamp(Number(out.printScale) || defaultLayout.printScale, 0.65, 1.15);
        out.pageMarginMm = clamp(Number(out.pageMarginMm) || defaultLayout.pageMarginMm, 0, 20);
        out.heroPaddingTop = clamp(Number(out.heroPaddingTop) || defaultLayout.heroPaddingTop, 0, 60);
        out.heroPaddingSides = clamp(Number(out.heroPaddingSides) || defaultLayout.heroPaddingSides, 0, 60);
        out.heroPaddingBottom = clamp(Number(out.heroPaddingBottom) || defaultLayout.heroPaddingBottom, 0, 60);
        out.contentPaddingTop = clamp(Number(out.contentPaddingTop) || defaultLayout.contentPaddingTop, 0, 40);
        out.contentPaddingSides = clamp(Number(out.contentPaddingSides) || defaultLayout.contentPaddingSides, 0, 40);
        out.contentPaddingBottom = clamp(Number(out.contentPaddingBottom) || defaultLayout.contentPaddingBottom, 0, 40);
        out.contentGap = clamp(Number(out.contentGap) || defaultLayout.contentGap, 0, 32);
        out.headlineSize = clamp(Number(out.headlineSize) || defaultLayout.headlineSize, 10, 28);
        out.summaryHeaderSize = clamp(Number(out.summaryHeaderSize) || defaultLayout.summaryHeaderSize, 7, 16);
        out.summaryValueSize = clamp(Number(out.summaryValueSize) || defaultLayout.summaryValueSize, 10, 30);
        out.paymentsTitleSize = clamp(Number(out.paymentsTitleSize) || defaultLayout.paymentsTitleSize, 10, 26);
        out.paymentsHeaderSize = clamp(Number(out.paymentsHeaderSize) || defaultLayout.paymentsHeaderSize, 7, 16);
        out.paymentsBodySize = clamp(Number(out.paymentsBodySize) || defaultLayout.paymentsBodySize, 8, 18);
        out.summaryRowPaddingY = clamp(Number(out.summaryRowPaddingY) || defaultLayout.summaryRowPaddingY, 2, 20);
        out.paymentRowPaddingY = clamp(Number(out.paymentRowPaddingY) || defaultLayout.paymentRowPaddingY, 2, 20);
        out.oliveLineWidth = clamp(Number(out.oliveLineWidth) || defaultLayout.oliveLineWidth, 0, 4);
        out.shellBorderWidth = clamp(Number(out.shellBorderWidth) || defaultLayout.shellBorderWidth, 0, 4);
        out.paymentsColStage = clamp(Number(out.paymentsColStage) || defaultLayout.paymentsColStage, 6, 24);
        out.paymentsColConcept = clamp(Number(out.paymentsColConcept) || defaultLayout.paymentsColConcept, 10, 36);
        out.paymentsColReference = clamp(Number(out.paymentsColReference) || defaultLayout.paymentsColReference, 10, 36);
        out.paymentsColPercent = clamp(Number(out.paymentsColPercent) || defaultLayout.paymentsColPercent, 8, 30);
        out.paymentsColAmount = clamp(Number(out.paymentsColAmount) || defaultLayout.paymentsColAmount, 8, 30);
        out.summaryColUnit = clamp(Number(out.summaryColUnit) || defaultLayout.summaryColUnit, 8, 40);
        out.summaryColPlan = clamp(Number(out.summaryColPlan) || defaultLayout.summaryColPlan, 12, 45);
        out.summaryColList = clamp(Number(out.summaryColList) || defaultLayout.summaryColList, 10, 35);
        out.summaryColDiscount = clamp(Number(out.summaryColDiscount) || defaultLayout.summaryColDiscount, 10, 35);
        out.summaryColPromo = clamp(Number(out.summaryColPromo) || defaultLayout.summaryColPromo, 10, 35);
        var validAlign = ['left', 'center', 'right'];
        out.paymentsAlignStage = validAlign.includes(String(out.paymentsAlignStage || '').toLowerCase()) ? String(out.paymentsAlignStage).toLowerCase() : defaultLayout.paymentsAlignStage;
        out.paymentsAlignConcept = validAlign.includes(String(out.paymentsAlignConcept || '').toLowerCase()) ? String(out.paymentsAlignConcept).toLowerCase() : defaultLayout.paymentsAlignConcept;
        out.paymentsAlignReference = validAlign.includes(String(out.paymentsAlignReference || '').toLowerCase()) ? String(out.paymentsAlignReference).toLowerCase() : defaultLayout.paymentsAlignReference;
        out.paymentsAlignPercent = validAlign.includes(String(out.paymentsAlignPercent || '').toLowerCase()) ? String(out.paymentsAlignPercent).toLowerCase() : defaultLayout.paymentsAlignPercent;
        out.paymentsAlignAmount = validAlign.includes(String(out.paymentsAlignAmount || '').toLowerCase()) ? String(out.paymentsAlignAmount).toLowerCase() : defaultLayout.paymentsAlignAmount;
        out.showHeroInPrint = Boolean(out.showHeroInPrint);
        out.showLogosInPrint = Boolean(out.showLogosInPrint);
        out.showSummaryInPrint = Boolean(out.showSummaryInPrint);
        out.showPaymentsInPrint = Boolean(out.showPaymentsInPrint);
        if (typeof out.oliveLineColor !== 'string') out.oliveLineColor = defaultLayout.oliveLineColor;
        if (typeof out.shellBorderColor !== 'string') out.shellBorderColor = defaultLayout.shellBorderColor;
        return out;
      }

      function applyLayout(layoutInput) {
        const layout = normalizeLayout(layoutInput);
        currentLayout = layout;
        const root = document.documentElement;
        root.style.setProperty('--print-scale', String(layout.printScale));
        root.style.setProperty('--print-margin-mm', String(layout.pageMarginMm));
        root.style.setProperty('--hero-padding-top', layout.heroPaddingTop + 'px');
        root.style.setProperty('--hero-padding-sides', layout.heroPaddingSides + 'px');
        root.style.setProperty('--hero-padding-bottom', layout.heroPaddingBottom + 'px');
        root.style.setProperty('--content-padding-top', layout.contentPaddingTop + 'px');
        root.style.setProperty('--content-padding-sides', layout.contentPaddingSides + 'px');
        root.style.setProperty('--content-padding-bottom', layout.contentPaddingBottom + 'px');
        root.style.setProperty('--content-gap', layout.contentGap + 'px');
        root.style.setProperty('--headline-size', layout.headlineSize + 'px');
        root.style.setProperty('--summary-header-size', layout.summaryHeaderSize + 'px');
        root.style.setProperty('--summary-value-size', layout.summaryValueSize + 'px');
        root.style.setProperty('--payments-title-size', layout.paymentsTitleSize + 'px');
        root.style.setProperty('--payments-header-size', layout.paymentsHeaderSize + 'px');
        root.style.setProperty('--payments-body-size', layout.paymentsBodySize + 'px');
        root.style.setProperty('--summary-row-padding-y', layout.summaryRowPaddingY + 'px');
        root.style.setProperty('--payment-row-padding-y', layout.paymentRowPaddingY + 'px');
        root.style.setProperty('--olive-line-color', layout.oliveLineColor);
        root.style.setProperty('--olive-line-width', layout.oliveLineWidth + 'px');
        root.style.setProperty('--shell-border-color', layout.shellBorderColor);
        root.style.setProperty('--shell-border-width', layout.shellBorderWidth + 'px');
        root.style.setProperty('--payments-col-stage', layout.paymentsColStage + '%');
        root.style.setProperty('--payments-col-concept', layout.paymentsColConcept + '%');
        root.style.setProperty('--payments-col-reference', layout.paymentsColReference + '%');
        root.style.setProperty('--payments-col-percent', layout.paymentsColPercent + '%');
        root.style.setProperty('--payments-col-amount', layout.paymentsColAmount + '%');
        root.style.setProperty('--payments-align-stage', layout.paymentsAlignStage);
        root.style.setProperty('--payments-align-concept', layout.paymentsAlignConcept);
        root.style.setProperty('--payments-align-reference', layout.paymentsAlignReference);
        root.style.setProperty('--payments-align-percent', layout.paymentsAlignPercent);
        root.style.setProperty('--payments-align-amount', layout.paymentsAlignAmount);
        root.style.setProperty('--summary-col-unit', layout.summaryColUnit + '%');
        root.style.setProperty('--summary-col-plan', layout.summaryColPlan + '%');
        root.style.setProperty('--summary-col-list', layout.summaryColList + '%');
        root.style.setProperty('--summary-col-discount', layout.summaryColDiscount + '%');
        root.style.setProperty('--summary-col-promo', layout.summaryColPromo + '%');

        document.body.classList.toggle('hide-hero-print', !layout.showHeroInPrint);
        document.body.classList.toggle('hide-logos-print', !layout.showLogosInPrint);
        document.body.classList.toggle('hide-summary-print', !layout.showSummaryInPrint);
        document.body.classList.toggle('hide-payments-print', !layout.showPaymentsInPrint);

        if (isPreviewMode) {
          document.body.classList.toggle('hide-hero', !layout.showHeroInPrint);
          document.body.classList.toggle('hide-logos', !layout.showLogosInPrint);
          els.summaryShell.classList.toggle('is-hidden', !layout.showSummaryInPrint);
          els.paymentsShell.classList.toggle('is-hidden', !layout.showPaymentsInPrint);
        }
      }

      function formatCurrency(value) {
        return currency.format(Number(value || 0));
      }

      function formatPercent(value) {
        return percentFormat.format(Number(value || 0)) + '%';
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function findPlan(key) {
        return plans.find(function (plan) {
          return plan.key === key;
        }) || plans[0];
      }

      function updateLanguage() {
        const t = translations[currentLang];
        els.backBtn.textContent = t.back;
        els.editorBtn.textContent = t.editor;
        els.langBtn.querySelector('span').textContent = t.langFlag;
        els.langBtnText.textContent = t.lang;
        els.printBtn.textContent = t.print;
        els.headline.textContent = t.headline;
        els.sectionTitle.textContent = t.section;
        els.labelUnit.textContent = t.unit;
        els.labelPlan.textContent = t.paymentPlan;
        els.labelListPrice.textContent = t.listPrice;
        els.labelApplyDiscount.textContent = t.discountToggle;
        els.applyDiscountText.textContent = t.applyDiscount;
        els.labelDiscount.textContent = t.discount;
        els.labelPromoPrice.textContent = t.promoPrice;
        els.summaryHeadUnit.textContent = t.summaryUnit;
        els.summaryHeadPlan.textContent = t.summaryPlan;
        els.summaryHeadList.textContent = t.summaryList;
        els.summaryHeadDiscount.textContent = t.summaryDiscount;
        els.summaryHeadPromo.textContent = t.summaryPromo;
        els.paymentsTitle.textContent = t.paymentsTitle;
        els.headStage.textContent = t.stage;
        els.headConcept.textContent = t.concept;
        els.headReference.textContent = t.reference;
        els.headPercent.textContent = t.percent;
        els.headAmount.textContent = t.amount;
        els.footerLabel.textContent = t.totals;
      }

      function syncDiscountVisibility() {
        const showDiscount = els.applyDiscount.checked;
        els.discountFieldWrap.hidden = !showDiscount;
        els.promoFieldWrap.hidden = !showDiscount;
        els.captureGrid.classList.toggle('discount-on', showDiscount);
        els.summaryShell.classList.toggle('no-discount', !showDiscount);
        document.querySelectorAll('.discount-col').forEach(function (node) {
          node.classList.toggle('is-hidden', !showDiscount);
        });
      }

      function getPaymentRows(schedule, finalPrice) {
        const t = translations[currentLang];
        return schedule.map(function (part, index) {
          const isFirst = index === 0;
          const isLast = index === schedule.length - 1;
          return {
            stage: index + 1,
            concept: isFirst ? t.rowConcepts[0] : (isLast ? t.rowConcepts[2] : t.rowConcepts[1]),
            reference: t.refs[index],
            percent: part,
            amount: finalPrice * (part / 100),
            highlight: isLast
          };
        });
      }

      function update() {
        const plan = findPlan(els.paymentPlan.value);
        const listPrice = Math.max(0, sanitizeNumber(els.listPrice.value));
        const unitName = els.unitName.value.trim();
        const showDiscount = els.applyDiscount.checked;
        const discountPercent = showDiscount ? plan.discount : 0;
        const promoPrice = Math.max(0, listPrice - (listPrice * discountPercent / 100));
        const discountAmount = Math.max(0, listPrice - promoPrice);
        const rows = getPaymentRows(plan.schedule, promoPrice);
        const percentTotal = plan.schedule.reduce(function (sum, item) { return sum + item; }, 0);
        const amountTotal = rows.reduce(function (sum, row) { return sum + row.amount; }, 0);

        els.discount.value = percentFormat.format(discountPercent);
        els.promoPrice.value = String(Math.round(promoPrice * 100) / 100);

        els.snapshotUnit.textContent = unitName || '-';
        els.snapshotPlan.textContent = plan.shortLabel;
        els.snapshotListPrice.textContent = formatCurrency(listPrice);
        els.snapshotDiscount.textContent = formatCurrency(discountAmount) + ' (' + formatPercent(discountPercent) + ')';
        els.snapshotPromoPrice.textContent = formatCurrency(promoPrice);

        els.paymentRows.innerHTML = rows.map(function (row) {
          return [
            '<tr' + (row.highlight ? ' class="highlight"' : '') + '>',
            '<td class="number col-stage">' + row.stage + '</td>',
            '<td class="col-concept">' + escapeHtml(row.concept) + '</td>',
            '<td class="col-reference">' + escapeHtml(row.reference) + '</td>',
            '<td class="percent col-percent">' + formatPercent(row.percent) + '</td>',
            '<td class="amount col-amount">' + formatCurrency(row.amount) + '</td>',
            '</tr>'
          ].join('');
        }).join('');

        els.footerPercent.textContent = formatPercent(percentTotal);
        els.footerAmount.textContent = formatCurrency(amountTotal);
      }

      async function loadLayout() {
        try {
          const res = await fetch('/api/viceroy/tabla-pagos/layout', { credentials: 'same-origin' });
          const data = await res.json().catch(function () { return {}; });
          if (res.ok && data && data.ok && data.layout) {
            applyLayout(data.layout);
            return;
          }
        } catch {}
        applyLayout(defaultLayout);
      }

      window.addEventListener('message', function (event) {
        if (!event || !event.data || event.data.type !== 'viceroy-payment-plan-layout-preview') return;
        applyLayout(event.data.layout || defaultLayout);
      });

      els.langBtn.addEventListener('click', function () {
        currentLang = currentLang === 'es' ? 'en' : 'es';
        updateLanguage();
        update();
      });

      els.paymentPlan.addEventListener('change', update);
      els.unitName.addEventListener('input', update);
      els.listPrice.addEventListener('input', update);
      els.applyDiscount.addEventListener('change', function () {
        syncDiscountVisibility();
        update();
      });

      els.printBtn.addEventListener('click', function () {
        window.print();
      });

      if (isPreviewMode) {
        document.body.classList.add('preview-mode');
      }
      if (isPrintPreviewMode) {
        document.body.classList.add('print-preview-mode');
      }

      currentLang = initialLang;
      updateLanguage();
      syncDiscountVisibility();
      update();
      loadLayout();
    })();
  </script>
